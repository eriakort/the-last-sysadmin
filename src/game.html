  { ch: 18, id: 'dr-verify', title: 'Prove it matches',
    story: "The real test: is the restored file identical to the original, byte for byte? `diff` compares two files and prints nothing at all when they are the same.",
    objective: 'Use `diff` to compare the original config with the restored copy and confirm they are identical.',
    hints: ['`diff FILE1 FILE2` — original first, restored second. No output means identical.', 'The restored copy is under ~/dr-test, at the same path the backup stored: ~/dr-test/srv/halcyon/releases/v2.3.1/config/app.conf.', 'Run `diff /srv/halcyon/releases/v2.3.1/config/app.conf ~/dr-test/srv/halcyon/releases/v2.3.1/config/app.conf`. Silence means success.'],
    check: () => { const o = getNode('/srv/halcyon/releases/v2.3.1/config/app.conf'); const r = getNode(HOME + '/dr-test/srv/halcyon/releases/v2.3.1/config/app.conf'); return !!o && !!r && o.content === r.content && (S.cmdsM.includes('diff') || S.cmdsM.includes('sha256sum') || S.cmdsM.includes('md5sum')); } },
  { ch: 18, id: 'dr-timer', title: 'Confirm it keeps happening',
    story: "A one-off restore is good; an automatic, scheduled backup is better. Confirm the systemd timer from Chapter 12 is still armed, with `systemctl list-timers`.",
    objective: 'List the timers. What is the unit name of the backup timer? Answer with `submit NAME`.',
    hints: ['`systemctl list-timers` shows active timers and the units they activate.', 'Look for the backup one in the UNIT column.', 'Run `systemctl list-timers`. It is `halcyon-backup.timer`.'],
    answer: a => /halcyon-backup\.timer/.test(a.trim()) },

  { ch: 19, id: 'grad-find', title: 'Final review: the filesystem',
    story: "Graduation. Six questions across the whole server, answered from memory with the tools you have built up. First, Chapters 1 and 2: `find` and `wc`. How crowded is /etc?",
    objective: 'How many regular files are directly in `/etc` (not in subdirectories)? Answer with `submit NUMBER`.',
    hints: ['`find /etc -maxdepth 1 -type f` lists files one level deep; pipe to `wc -l` to count.', '`-maxdepth 1` keeps it to /etc itself; `-type f` excludes the subdirectories.', 'Run `find /etc -maxdepth 1 -type f | wc -l`. The answer is 9.'],
    answer: a => a.trim() === '9' },
  { ch: 19, id: 'grad-log', title: 'Final review: the evidence',
    story: "Chapter 3: text processing. Back then you saved the attacker's requests to `~/incident/notes/evidence.txt`. Prove you can still measure a file.",
    objective: 'How many lines are in `~/incident/notes/evidence.txt`? Answer with `submit NUMBER`.',
    hints: ['`wc -l FILE` counts lines.', 'The file is ~/incident/notes/evidence.txt.', 'Run `wc -l ~/incident/notes/evidence.txt`. It is 64.'],
    answer: a => a.trim() === '64' },
  { ch: 19, id: 'grad-user', title: 'Final review: access',
    story: "Chapter 4 and Chapter 10: accounts. The contractor jmorrow was locked out. Confirm, from the account database, that they still cannot log in.",
    objective: "What login shell does the `jmorrow` account have? Answer with `submit SHELL`.",
    hints: ['`getent passwd jmorrow` prints the account line; the shell is the last field.', 'A locked-out account has a nologin shell.', 'Run `getent passwd jmorrow`. The shell is `/usr/sbin/nologin`.'],
    answer: a => /nologin/.test(a.trim()) },
  { ch: 19, id: 'grad-fw', title: 'Final review: the firewall',
    story: "Chapter 6: networking. One address was banned at the firewall for pulling the customer list. Which one?",
    objective: 'Which IP address does the firewall deny? Answer with `submit IP`.',
    hints: ['`sudo ufw status` lists the rules.', 'Look for the DENY line.', 'Run `sudo ufw status`. It is 203.0.113.77.'],
    answer: a => a.trim() === '203.0.113.77' },
  { ch: 19, id: 'grad-timer', title: 'Final review: automation',
    story: "Chapters 11 and 12: the backup script and its systemd timer. What release is the server actually running, and is the backup still scheduled? Check the live release pointer from Chapter 15.",
    objective: 'What release is live? Read `/srv/halcyon/CURRENT` and `submit` it.',
    hints: ['`cat /srv/halcyon/CURRENT` prints the live release name.', 'You cut this over yourself in Chapter 15.', 'Run `cat /srv/halcyon/CURRENT`. It is v2.4.0.'],
    answer: a => a.trim() === 'v2.4.0' },
  { ch: 19, id: 'grad-signoff', title: 'Sign the handover',
    story: "Last ticket. Twenty chapters ago Dana left you a note. Leave your own: a short all-clear for whoever is on call next, in your incident folder. You have earned it.",
    objective: 'Write a short sign-off to `~/incident/ALL_CLEAR.md`.',
    hints: ['`echo "text" > file` writes it; `echo "more" >> file` adds lines.', 'Anything meaningful counts, as long as the file has real content.', 'Run `echo "# All clear - halcyon-web01 stable on v2.4.0, backups scheduled, firewall up." > ~/incident/ALL_CLEAR.md`.'],
    check: () => { const n = getNode(HOME + '/incident/ALL_CLEAR.md'); return !!n && n.type === 'file' && n.content.trim().length > 15; } },

  { ch: 20, id: 'tw-range', title: 'Beyond simple grep',
    story: "Past graduation, the craft gets sharper. The access log you rotated back in Chapter 13 is now `access.log.1`. Use an extended regex to count every request from the attacker's whole network, not just one address.",
    objective: 'How many requests in `/var/log/halcyon/access.log.1` came from the 203.0.113.x range? Answer with `submit NUMBER`.',
    hints: ['`grep -E` turns on extended regex. A dot in a pattern means "any character", so escape the real dots: `203\\.0\\.113\\.`.', 'Anchor to the start of the line with `^`, since the IP is the first thing on each line. `grep -cE` counts.', "Run `grep -cE '^203\\.0\\.113\\.' /var/log/halcyon/access.log.1`."],
    answer: a => a.trim() === '93' },
  { ch: 20, id: 'tw-column', title: 'Make it readable',
    story: "Raw colon-separated records are hard to read. `cut` pulls out fields and `column -t` lines them up. This is the same /etc/passwd you have read since Chapter 4, now presented like a report.",
    objective: 'Show each user and their shell from `/etc/passwd`, aligned in columns.',
    hints: ['`cut -d: -f1,7 /etc/passwd` gives name and shell, colon-separated.', 'Pipe into `column -t -s:` to align on the colon.', 'Run `cut -d: -f1,7 /etc/passwd | column -t -s:`.'],
    check: () => S.cmdsM.includes('column') },
  { ch: 20, id: 'tw-awk', title: 'Fields and conditions',
    story: "`awk` is a whole language for columns. Pull out the human accounts (uid 1000 and up) and sort them, combining Chapter 3's awk with Chapter 4's knowledge of /etc/passwd.",
    objective: 'List the usernames with uid >= 1000, sorted. Which comes first alphabetically? Answer with `submit NAME`.',
    hints: ["`awk -F: '$3 >= 1000 {print $1}' /etc/passwd` prints those usernames.", 'Pipe into `sort`; the first line is the answer.', "Run `awk -F: '$3 >= 1000 {print $1}' /etc/passwd | sort`. It is dana."],
    answer: a => a.trim() === 'dana' },
  { ch: 20, id: 'tw-sed', title: 'Capture and rearrange',
    story: "`sed` with capture groups can rewrite structured text. Reformat an ISO date (YYYY-MM-DD) into DD/MM/YYYY using `\\1 \\2 \\3` back-references \u2014 the deep end of the sed you met in Chapter 10.",
    objective: 'Turn `2026-10-28` into `28/10/2026` with sed. Answer with `submit RESULT`.',
    hints: ['`-E` enables groups. `(....)` captures four characters; `\\1` recalls the first group.', 'The replacement reorders the groups and swaps dashes for slashes.', "Run `echo 2026-10-28 | sed -E 's|(....)-(..)-(..)|\\3/\\2/\\1|'`."],
    answer: a => a.trim() === '28/10/2026' },
  { ch: 20, id: 'tw-nl', title: 'Number the script',
    story: "One more small tool: `nl` numbers the lines of a file, handy when someone reports an error on \"line 3\". Number your backup script from Chapter 11.",
    objective: 'Print `~/backup.sh` with line numbers.',
    hints: ['`nl FILE` numbers non-blank lines.', 'The file is ~/backup.sh.', 'Run `nl ~/backup.sh`.'],
    check: () => S.cmdsM.includes('nl') },

  { ch: 21, id: 'net-dig', title: 'Names to addresses',
    story: "Networking by name. `dig` asks DNS to resolve a name to an address \u2014 the lookup that happens invisibly every time you use a hostname. `+short` prints just the answer.",
    objective: 'Resolve `halcyon-db01` to its IP address. Answer with `submit IP`.',
    hints: ['`dig +short NAME` prints just the address.', 'The name is halcyon-db01.', 'Run `dig +short halcyon-db01`. It is 10.0.4.20.'],
    answer: a => a.trim() === '10.0.4.20' },
  { ch: 21, id: 'net-host', title: 'Addresses to names',
    story: "The reverse direction matters too. Given an IP from a log, `host` can tell you which machine it is \u2014 a reverse DNS lookup.",
    objective: 'What hostname does `10.0.4.20` belong to? Answer with `submit NAME`.',
    hints: ['`host IP` does a reverse lookup.', 'Read the "domain name pointer" in the output.', 'Run `host 10.0.4.20`. It is halcyon-db01.'],
    answer: a => /halcyon-db01/.test(a.trim()) },
  { ch: 21, id: 'net-nc', title: 'Is the port open?',
    story: "A name resolving is not the same as a service answering. `nc -zv` checks whether a TCP port is actually open, without needing the real client \u2014 the quick test you reach for when something \"can\u2019t connect\".",
    objective: 'Check whether the database port 5432 on `10.0.4.20` is open. What does nc report? Answer with `submit WORD`.',
    hints: ['`nc -zv HOST PORT` scans one port and says whether it connected.', 'Read the last word of its message.', 'Run `nc -zv 10.0.4.20 5432`. It says `succeeded`.'],
    answer: a => /succeed|open/i.test(a.trim()) },
  { ch: 21, id: 'net-hosts', title: 'Add a name by hand',
    story: "Not every name needs DNS. `/etc/hosts` maps names to addresses locally, and it wins over DNS. Add an entry for a new cache server, with the `sudo tee -a` trick from Chapter 7.",
    objective: 'Add `10.0.4.30  halcyon-cache01` to `/etc/hosts`.',
    hints: ['`echo "IP  NAME" | sudo tee -a /etc/hosts` appends the line as root.', 'The IP is 10.0.4.30 and the name is halcyon-cache01.', 'Run `echo "10.0.4.30  halcyon-cache01" | sudo tee -a /etc/hosts`.'],
    check: () => { const h = getNode('/etc/hosts'); return !!h && /halcyon-cache01/.test(h.content) && /10\.0\.4\.30/.test(h.content); } },
  { ch: 21, id: 'net-getent', title: 'Resolve the way the system does',
    story: "`getent hosts` resolves a name the way programs actually do \u2014 checking /etc/hosts and DNS together. Confirm the entry you just added resolves.",
    objective: 'Resolve `halcyon-cache01` with getent. Answer with `submit IP`.',
    hints: ['`getent hosts NAME` prints the address it resolves to.', 'The name is halcyon-cache01.', 'Run `getent hosts halcyon-cache01`. It is 10.0.4.30.'],
    answer: a => a.trim() === '10.0.4.30' },

  { ch: 22, id: 'ker-uname', title: 'Which kernel?',
    story: "Kernel tuning starts with knowing what you are running. `uname -r` reports the running kernel version \u2014 the first thing to check when a driver or a feature is missing.",
    objective: 'What kernel release is running? Answer with `submit VERSION`.',
    hints: ['`uname -r` prints the kernel release.', 'Copy it exactly.', 'Run `uname -r`. It is 6.8.0-45-generic.'],
    answer: a => a.trim() === '6.8.0-45-generic' },
  { ch: 22, id: 'ker-read', title: 'Read a kernel setting',
    story: "The kernel exposes hundreds of tunables through `sysctl`. Read whether this box forwards packets between networks \u2014 off by default on a normal server.",
    objective: 'What is the value of `net.ipv4.ip_forward`? Answer with `submit NUMBER`.',
    hints: ['`sysctl KEY` prints `KEY = VALUE`.', 'The key is net.ipv4.ip_forward.', 'Run `sysctl net.ipv4.ip_forward`. It is 0.'],
    answer: a => a.trim() === '0' },
  { ch: 22, id: 'ker-set', title: 'Change it live',
    story: "This box is about to route traffic for the new cache tier, so it needs forwarding on. `sysctl -w` changes a value immediately \u2014 but only until the next reboot.",
    objective: 'Turn on `net.ipv4.ip_forward` (set it to 1).',
    hints: ['`sudo sysctl -w KEY=VALUE` sets it. Changing kernel parameters needs root.', 'Set net.ipv4.ip_forward to 1.', 'Run `sudo sysctl -w net.ipv4.ip_forward=1`.'],
    check: () => S.sysctl['net.ipv4.ip_forward'] === '1' },
  { ch: 22, id: 'ker-persist', title: 'Make it stick',
    story: "A `sysctl -w` change is gone on reboot, exactly like a plain `mount`. To make it permanent, write it into `/etc/sysctl.conf` \u2014 the same read / change / persist pattern as fstab and crontab.",
    objective: 'Add `net.ipv4.ip_forward = 1` to `/etc/sysctl.conf`.',
    hints: ['Append it with `echo ... | sudo tee -a /etc/sysctl.conf`.', 'The line is `net.ipv4.ip_forward = 1`.', 'Run `echo "net.ipv4.ip_forward = 1" | sudo tee -a /etc/sysctl.conf`.'],
    check: () => { const n = getNode('/etc/sysctl.conf'); return !!n && /^net\.ipv4\.ip_forward\s*=\s*1/m.test(n.content); } },
  { ch: 22, id: 'ker-dmesg', title: 'What the kernel saw',
    story: "When hardware misbehaves, the kernel's own log is where to look. `dmesg` prints the kernel ring buffer \u2014 boot messages, disks, the network card.",
    objective: 'Read the kernel messages with dmesg.',
    hints: ['Run `dmesg`. It is long; `dmesg | tail` shows the end.', 'Look for the eth0 and ext4 lines.', 'Run `dmesg | tail`.'],
    check: () => S.cmdsM.includes('dmesg') },

  { ch: 23, id: 'sh-alias', title: 'Make a shortcut',
    story: "You type `ls -l` a hundred times a day. An `alias` turns it into `ll`. The shell is yours to shape.",
    objective: 'Create an alias `ll` for `ls -l`.',
    hints: ["`alias NAME='COMMAND'` creates one. Mind the quotes.", 'Then just type `ll` to use it.', "Run `alias ll='ls -l'`, then try `ll /etc`."],
    check: () => { const v = S.aliases && S.aliases.ll; return !!v && /\bls\b/.test(v) && /-l/.test(v); } },
  { ch: 23, id: 'sh-which', title: 'Where does it live?',
    story: "When you type a command, the shell searches your PATH for a file to run. `which` tells you exactly which file that is.",
    objective: 'Find the full path of the `cat` command. Answer with `submit PATH`.',
    hints: ['`which NAME` prints the path.', 'The command is cat.', 'Run `which cat`. It is /usr/bin/cat.'],
    answer: a => a.trim() === '/usr/bin/cat' },
  { ch: 23, id: 'sh-type', title: 'Command, builtin, or alias?',
    story: "Not everything you type is a program. `cd`, for one, is built into the shell. `type` tells you what a name really is.",
    objective: 'Use `type` to find out what `cd` is. Answer with `submit WORD`.',
    hints: ['`type cd` describes it.', 'The key word in the answer describes where it lives.', 'Run `type cd`. It is a shell `builtin`.'],
    answer: a => /builtin/i.test(a.trim()) },
  { ch: 23, id: 'sh-bashrc', title: 'Keep it after logout',
    story: "An alias defined at the prompt is gone when you log out. To keep it, add it to `~/.bashrc`, which runs at every login \u2014 you edited this same file's cousin, /etc/hosts, last chapter.",
    objective: 'Add the line `alias ll=\'ls -l\'` to `~/.bashrc`.',
    hints: ['`echo "LINE" >> ~/.bashrc` appends to it (you own it, no sudo).', "The line is `alias ll='ls -l'`.", "Run `echo \"alias ll='ls -l'\" >> ~/.bashrc`, then `tail ~/.bashrc`."],
    check: () => { const n = getNode(HOME + '/.bashrc'); return !!n && /alias\s+ll=/.test(n.content); } },
  { ch: 23, id: 'sh-env', title: 'An environment variable',
    story: "Programs read their behaviour from environment variables. `export` sets one for the commands you run. Set your preferred editor and read it back \u2014 the `$VAR` you learned scripting in Chapter 11.",
    objective: 'Export `EDITOR=vim`, then echo it. Answer with `submit VALUE`.',
    hints: ['`export EDITOR=vim` sets it; `echo $EDITOR` prints it.', 'The value you set is what you submit.', 'Run `export EDITOR=vim`, then `echo $EDITOR`.'],
    answer: a => a.trim() === 'vim' },

  { ch: 24, id: 'perm-umask', title: 'Default permissions',
    story: "Every new file is born with permissions, minus whatever the `umask` removes. Check yours \u2014 the quiet rule behind every file you have created.",
    objective: 'Show the current umask. Answer with `submit VALUE`.',
    hints: ['Just run `umask`.', 'It prints a four-digit octal value.', 'Run `umask`. It is 0022.'],
    answer: a => /^0?022$/.test(a.trim()) },
  { ch: 24, id: 'perm-suid', title: 'Find the powerful files',
    story: "A setuid program runs as its owner, not as you \u2014 that is how `passwd` can edit root-owned files. These deserve an audit. Find them with `find -perm`, extending the find from Chapter 2.",
    objective: 'Find setuid files under `/usr/bin`. Answer with one of their paths using `submit PATH`.',
    hints: ['Setuid is mode bit 4000. `find /usr/bin -perm -4000` lists files that have it.', 'The `-4000` form means "has at least these bits".', 'Run `find /usr/bin -perm -4000`. `/usr/bin/passwd` is one.'],
    answer: a => /\/usr\/bin\/(passwd|sudo|mount|su)/.test(a.trim()) },
  { ch: 24, id: 'perm-setgid', title: 'A shared directory',
    story: "A setgid directory makes every file created inside it inherit the directory's group \u2014 the trick behind a shared team folder. Create one for reports, using `chmod` with a leading 2.",
    objective: 'Create `/srv/reports` and give it setgid (mode 2775).',
    hints: ['`sudo mkdir /srv/reports`, then `sudo chmod 2775 /srv/reports`. The leading 2 is the setgid bit.', 'Check with `ls -ld /srv/reports` \u2014 you should see an `s` in the group part.', 'Run `sudo mkdir -p /srv/reports`, then `sudo chmod 2775 /srv/reports`.'],
    check: () => { const n = getNode('/srv/reports'); return !!n && n.type === 'dir' && (n.mode & 0o2000) !== 0; } },
  { ch: 24, id: 'perm-acl', title: 'Grant one person access',
    story: "Normal permissions have room for one owner and one group. An ACL grants a specific extra user access without changing either. Give sam read/write on your all-clear note.",
    objective: 'Give user `sam` read+write on `~/incident/ALL_CLEAR.md` with setfacl.',
    hints: ['`setfacl -m u:USER:PERMS FILE` adds an entry. Perms are like `rw`.', 'Check it with `getfacl ~/incident/ALL_CLEAR.md`.', 'Run `setfacl -m u:sam:rw ~/incident/ALL_CLEAR.md`.'],
    check: () => { const n = getNode(HOME + '/incident/ALL_CLEAR.md'); return !!n && n.acl && n.acl.some(e => e.who === 'sam' && /r/.test(e.perms) && /w/.test(e.perms)); } },
  { ch: 24, id: 'perm-key', title: 'Lock down the key',
    story: "SSH refuses to use a private key that others can read. Make sure yours from Chapter 18 is owner-only \u2014 mode 600 \u2014 with plain `chmod`.",
    objective: 'Set `~/.ssh/id_ed25519` to mode 600.',
    hints: ['`chmod 600 FILE` gives read+write to the owner and nothing to anyone else.', 'The file is ~/.ssh/id_ed25519.', 'Run `chmod 600 ~/.ssh/id_ed25519`, then `ls -l ~/.ssh`.'],
    check: () => { const n = getNode(HOME + '/.ssh/id_ed25519'); return !!n && (n.mode & 0o777) === 0o600; } },

  { ch: 25, id: 'lvm-see', title: 'A spare disk',
    story: "The reports are outgrowing their home. There is an unused disk on this box. LVM lets you turn it into storage you can grow later without downtime. First, find it with `lsblk` from Chapter 7.",
    objective: 'List the block devices. Which disk has no partitions and is unused? Answer with `submit NAME`.',
    hints: ['`lsblk` shows disks and their partitions.', 'vda and vdb are in use. One disk has nothing under it.', 'Run `lsblk`. The empty disk is vdc.'],
    answer: a => a.trim().replace('/dev/', '') === 'vdc' },
  { ch: 25, id: 'lvm-pv', title: 'Physical volume',
    story: "LVM has three layers. The first: mark the raw disk as a physical volume with `pvcreate`, so LVM can use it.",
    objective: 'Make `/dev/vdc` an LVM physical volume.',
    hints: ['`sudo pvcreate /dev/vdc`. It needs root.', 'Check with `pvs`.', 'Run `sudo pvcreate /dev/vdc`.'],
    check: () => S.lvm.pvs.some(pv => pv.name === '/dev/vdc') },
  { ch: 25, id: 'lvm-vg', title: 'Volume group',
    story: "Second layer: pool one or more physical volumes into a volume group. Call it `data`.",
    objective: 'Create a volume group `data` on `/dev/vdc`.',
    hints: ['`sudo vgcreate NAME DEVICE`.', 'The name is data, the device is /dev/vdc.', 'Run `sudo vgcreate data /dev/vdc`, then `vgs`.'],
    check: () => S.lvm.vgs.some(v => v.name === 'data') },
  { ch: 25, id: 'lvm-lv', title: 'Logical volume',
    story: "Third layer: carve a logical volume out of the group. This is the device you actually format and mount \u2014 and you can grow it later from the group's free space.",
    objective: 'Create a 5G logical volume named `reports` in the `data` group.',
    hints: ['`sudo lvcreate -n NAME -L SIZE VG`.', 'Name reports, size 5G, group data.', 'Run `sudo lvcreate -n reports -L 5G data`, then `lvs`.'],
    check: () => S.lvm.lvs.some(l => l.name === 'reports' && l.vg === 'data') },
  { ch: 25, id: 'lvm-mount', title: 'Format and mount it',
    story: "A logical volume is just a block device. Put a filesystem on it with `mkfs`, then make a mountpoint and mount it \u2014 everything you did for the backup disk in Chapter 7, now on LVM.",
    objective: 'Format `/dev/data/reports` as ext4, then mount it at `/mnt/reports`.',
    hints: ['`sudo mkfs.ext4 /dev/data/reports` formats it. Then `sudo mkdir /mnt/reports` and `sudo mount /dev/data/reports /mnt/reports`.', 'Confirm with `df -h`.', 'Run the three commands, then `df -h | grep reports`.'],
    check: () => S.mounts.some(m => m.mp === '/mnt/reports') },

  { ch: 26, id: 'sig-lsof', title: 'What holds the port?',
    story: "Deeper into processes. Something owns port 8080; `lsof` tells you exactly what \u2014 the tool you reach for when \"address already in use\".",
    objective: 'Find what is listening on port 8080. What PID owns it? Answer with `submit PID`.',
    hints: ['`sudo lsof -i :8080` lists the process on that port.', 'Read the PID column.', 'Run `sudo lsof -i :8080`. It is 812.'],
    answer: a => a.trim() === '812' },
  { ch: 26, id: 'sig-hup', title: 'Reload without restarting',
    story: "Restarting a service drops connections. Many services reload their config instead when sent a HUP signal \u2014 no downtime. Send one to the halcyon master with `kill -HUP`.",
    objective: 'Send the HUP signal to process 812.',
    hints: ['`kill -HUP PID` sends SIGHUP. It is the halcyon user\u2019s process, so use sudo.', 'Unlike a plain kill, this reloads rather than stops it \u2014 `ps` will show it still running.', 'Run `sudo kill -HUP 812`.'],
    check: () => { return !!(S.signalled && S.signalled['812'] === 'HUP') && !!S.procs.find(x => x.pid === 812); } },
  { ch: 26, id: 'sig-still', title: 'Confirm it survived',
    story: "A HUP reloads; it does not kill. Prove the workers are all still there, with `ps` and `grep` from Chapter 5.",
    objective: 'How many `halcyon-worker` processes are running? Answer with `submit NUMBER`.',
    hints: ['`ps aux | grep halcyon-worker` lists them; `grep -c` counts.', 'Count the master plus its workers.', 'Run `ps aux | grep -c halcyon-worker`. It is 5.'],
    answer: a => a.trim() === '5' },
  { ch: 26, id: 'sig-timeout', title: 'Bound a slow command',
    story: "Some commands can hang forever. `timeout` runs one but kills it after a limit \u2014 essential in scripts that must not get stuck.",
    objective: 'Run a ping to `10.0.4.20` under a `timeout` of a few seconds.',
    hints: ['`timeout DURATION COMMAND`. For example `timeout 3 ping -c 2 10.0.4.20`.', 'The duration comes first, then the whole command.', 'Run `timeout 3 ping -c 2 10.0.4.20`.'],
    check: () => S.cmdsM.includes('timeout') },
  { ch: 26, id: 'sig-lsof2', title: 'Who has the log open?',
    story: "`lsof` also answers the reverse question: which process has a given file open? Useful before you move or delete a busy file.",
    objective: 'Find what has `/var/log/halcyon/app.log` open with lsof.',
    hints: ['`sudo lsof FILE` lists processes holding it open.', 'The file is /var/log/halcyon/app.log.', 'Run `sudo lsof /var/log/halcyon/app.log`.'],
    check: () => S.cmdsM.includes('lsof') },

  { ch: 27, id: 'obs-vmstat', title: 'A live pulse',
    story: "To keep a server healthy you must see it. `vmstat` gives a one-line snapshot of processes, memory, io and cpu \u2014 a quick pulse check.",
    objective: 'Show system activity with vmstat.',
    hints: ['Run `vmstat`.', 'The `us`, `sy` and `id` columns are user, system and idle CPU percentages.', 'Run `vmstat`.'],
    check: () => S.cmdsM.includes('vmstat') },
  { ch: 27, id: 'obs-iostat', title: 'Where the io goes',
    story: "`iostat` breaks activity down by CPU and by disk \u2014 the tool when a box feels slow but the CPU looks idle (it is usually waiting on disk).",
    objective: 'Show cpu and disk statistics with iostat.',
    hints: ['Run `iostat`.', 'Watch the `%iowait` number and the per-device rows.', 'Run `iostat`.'],
    check: () => S.cmdsM.includes('iostat') },
  { ch: 27, id: 'obs-health', title: 'Write a health check',
    onStart: () => { S.lastScriptOut = ''; },
    story: "A real monitor is just a script that checks something and reports. Write one that uses `systemctl is-active --quiet` (Chapter 12) inside an `if` (Chapter 11) to say whether halcyon is up, then run it.",
    objective: 'Write `~/health.sh` that prints `halcyon OK` when the service is active, and run it.',
    hints: ['`systemctl is-active --quiet halcyon` succeeds (exit 0) when it is running, with no output \u2014 perfect for an `if`.', 'The script: `if systemctl is-active --quiet halcyon; then echo "halcyon OK"; else echo "halcyon DOWN"; fi`.', "Create it with printf, then `chmod +x ~/health.sh`, then run it with `bash ~/health.sh` (that works from any directory)."],
    check: () => /halcyon OK/.test(S.lastScriptOut || '') },
  { ch: 27, id: 'obs-schedule', title: 'Run it on a schedule',
    story: "A check you have to remember to run is useless. Schedule your health check every 5 minutes with your own crontab (Chapter 8) \u2014 no sudo needed for your own.",
    objective: 'Install a crontab for yourself that runs `/home/rookie/health.sh` every 5 minutes.',
    hints: ['A 5-minute schedule is `*/5 * * * *`. Install it by piping into `crontab -`.', "Run `echo '*/5 * * * * /home/rookie/health.sh' | crontab -`.", 'Check with `crontab -l`.'],
    check: () => { const c = S.crontabs.rookie || ''; return /health\.sh/.test(c) && /\*\/5/.test(c); } },
  { ch: 27, id: 'obs-disk', title: 'Know your disks',
    story: "Last pulse: disk space, the thing that started this whole saga in Chapter 2. `df -h` shows it. Which device is the root filesystem on?",
    objective: 'Which device is mounted at `/`? Answer with `submit DEVICE`.',
    hints: ['`df -h /` shows just the root filesystem and its device.', 'Read the Filesystem column.', 'Run `df -h /`. It is /dev/vda1.'],
    answer: a => /vda1/.test(a.trim()) },

  { ch: 28, id: 'auto-makefile', title: 'Write a Makefile',
    story: "You keep running the same deploy and backup commands by hand. A Makefile names them as targets so anyone can run `make backup` or `make deploy` \u2014 automation is just writing down what you already do.",
    objective: 'Create a `~/Makefile` with a `backup` target and a `deploy` target.',
    hints: ['Each target is `name:` on its own line, then tab-indented commands beneath it.', 'backup should tar the config; deploy should update CURRENT and restart halcyon. Build it with printf, using \\n and \\t.', "Run: `printf 'backup:\\n\\tsudo tar -czf /mnt/backups/nightly.tar.gz /srv/halcyon/releases/v2.3.1/config\\n\\ndeploy:\\n\\techo v2.4.0 > /srv/halcyon/CURRENT\\n\\tsudo systemctl restart halcyon\\n' > ~/Makefile`, then `cat ~/Makefile`."],
    check: () => { const n = getNode(HOME + '/Makefile'); return !!n && /^backup:/m.test(n.content) && /^deploy:/m.test(n.content); } },
  { ch: 28, id: 'auto-backup', title: 'make backup',
    onStart: () => { const b = getNode('/mnt/backups'); if (b && b.children['nightly.tar.gz']) delete b.children['nightly.tar.gz']; },
    story: "Run the backup target. `make` reads the Makefile and runs that target's commands for you.",
    objective: 'Run the `backup` target so `/mnt/backups/nightly.tar.gz` is created.',
    hints: ['From your home directory (where the Makefile is), run `make backup`.', '`make` prints each command as it runs it.', 'Run `cd ~`, then `make backup`, then `ls -l /mnt/backups`.'],
    check: () => { const n = getNode('/mnt/backups/nightly.tar.gz'); return !!n && !!n.archive; } },
  { ch: 28, id: 'auto-deploy', title: 'make deploy',
    onStart: () => { S.restarted = S.restarted || {}; delete S.restarted.halcyon; },
    story: "Same idea for deploys. `make deploy` runs the deploy recipe \u2014 updating CURRENT and restarting the service \u2014 the same steps from Chapter 15, now one command.",
    objective: 'Run the `deploy` target.',
    hints: ['Run `make deploy`.', 'It runs the echo and the systemctl restart from your Makefile.', 'Run `make deploy`, then `systemctl is-active halcyon`.'],
    check: () => !!(S.restarted && S.restarted.halcyon) },
  { ch: 28, id: 'auto-tag', title: 'Tag the release',
    story: "A deploy deserves a marker in version control. Tag the release in your repo from Chapter 15, so you can always find exactly what shipped.",
    objective: 'In `~/halcyon-app`, create a git tag `v2.4.0`.',
    hints: ['`cd ~/halcyon-app`, then `git tag NAME`.', 'The tag is v2.4.0.', 'Run `cd ~/halcyon-app`, then `git tag v2.4.0`, then `git tag` to list it.'],
    check: () => S.repo.tags.includes('v2.4.0') },
  { ch: 28, id: 'auto-dry', title: 'Look before you run',
    story: "Before running automation against production, preview it. `make -n` prints the commands a target would run without running them \u2014 a dry run.",
    objective: 'Dry-run the `deploy` target (print its commands without running them).',
    hints: ['`make -n TARGET` shows the commands only.', 'Use the deploy target.', 'Run `make -n deploy`.'],
    check: () => S.cmdsM.includes('make') },

  { ch: 29, id: 'cap-user', title: 'Capstone: a service account',
    story: "Final chapter. No story hands you this one \u2014 you build a whole new 'reports' service from nothing, using everything you know. Services should run as their own unprivileged account, not as a person. Create one.",
    objective: 'Create a system user `reportsvc` with a `nologin` shell.',
    hints: ['`sudo useradd` with `-s /usr/sbin/nologin` makes an account that cannot log in interactively.', 'Name it reportsvc.', 'Run `sudo useradd -s /usr/sbin/nologin reportsvc`, then `getent passwd reportsvc`.'],
    check: () => { const pw = splitLines(getNode('/etc/passwd').content).map(l => l.split(':')).find(f => f[0] === 'reportsvc'); return !!pw && /nologin|false/.test(pw[6]); } },
  { ch: 29, id: 'cap-script', title: 'Capstone: the service script',
    onStart: () => { S.lastScriptRun = ''; },
    story: "Every service runs something. Write the report generator script and make it executable \u2014 the scripting from Chapter 11.",
    objective: 'Create an executable `~/report.sh` that prints a line, and run it to confirm it works.',
    hints: ['Any script works: `printf \'#!/bin/bash\\necho "report generated at $(date +%F)"\\n\' > ~/report.sh`.', 'Then `chmod +x ~/report.sh` and run it with `bash ~/report.sh` (works from any directory).', 'Create it, make it executable, and run `bash ~/report.sh`.'],
    check: () => { const n = getNode(HOME + '/report.sh'); return !!n && (n.mode & 0o111) !== 0 && (S.lastScriptRun || '').endsWith('/report.sh'); } },
  { ch: 29, id: 'cap-unit', title: 'Capstone: unit and timer',
    story: "Make systemd run it on a schedule \u2014 service plus timer, daemon-reload, enable --now, exactly as in Chapter 12.",
    objective: 'Create a `report-gen.service` and `report-gen.timer`, reload systemd, and enable+start the timer.',
    hints: ['Write both files under /etc/systemd/system with `sudo tee` (ExecStart=/home/rookie/report.sh in the service; OnCalendar in the timer).', 'Then `sudo systemctl daemon-reload` and `sudo systemctl enable --now report-gen.timer`.', "Service: `printf '[Unit]\\nDescription=Report generator\\n[Service]\\nType=oneshot\\nExecStart=/home/rookie/report.sh\\n' | sudo tee /etc/systemd/system/report-gen.service`. Timer: `printf '[Unit]\\nDescription=Run report generator hourly\\n[Timer]\\nOnCalendar=hourly\\n[Install]\\nWantedBy=timers.target\\n' | sudo tee /etc/systemd/system/report-gen.timer`. Then daemon-reload and `sudo systemctl enable --now report-gen.timer`."],
    check: () => { const u = S.units && S.units['report-gen.timer']; return !!u && u.active && u.enabled; } },
  { ch: 29, id: 'cap-fw', title: 'Capstone: open its port',
    story: "The reports service exposes metrics on port 9100. Open it in the firewall from Chapter 6 \u2014 and only it.",
    objective: 'Allow TCP port 9100 through the firewall.',
    hints: ['`sudo ufw allow 9100/tcp` adds the rule.', 'Check with `sudo ufw status`.', 'Run `sudo ufw allow 9100/tcp`.'],
    check: () => S.firewall.rules.some(r => r.action === 'allow' && String(r.to || '').includes('9100')) },
  { ch: 29, id: 'cap-backup', title: 'Capstone: back it up',
    onStart: () => { const b = getNode('/mnt/backups'); if (b && b.children['reports.tar.gz']) delete b.children['reports.tar.gz']; },
    story: "A service with no backup is a future incident. Archive the report script and its unit to the backups disk, with `tar` from Chapter 8.",
    objective: 'Create `/mnt/backups/reports.tar.gz` containing `~/report.sh`.',
    hints: ['`sudo tar -czf /mnt/backups/reports.tar.gz /home/rookie/report.sh`.', 'Verify with `tar -tzf /mnt/backups/reports.tar.gz`.', 'Run `sudo tar -czf /mnt/backups/reports.tar.gz /home/rookie/report.sh`.'],
    check: () => { const n = getNode('/mnt/backups/reports.tar.gz'); return !!n && !!n.archive; } },
  { ch: 29, id: 'cap-signoff', title: 'Capstone: hand it over',
    story: "The reports service is accounted for, scheduled, firewalled, and backed up. You built it from zero. Write the runbook entry for it and close the book \u2014 you are the admin on call now.",
    objective: 'Write a short runbook note to `~/incident/REPORTS.md` describing the new service.',
    hints: ['`echo "text" > file` writes it. Describe what reportsvc is and how it runs.', 'Anything real counts, as long as the file has content.', 'Run `echo "# reports service: runs report.sh via report-gen.timer as reportsvc, port 9100, backed up to /mnt/backups." > ~/incident/REPORTS.md`.'],
    check: () => { const n = getNode(HOME + '/incident/REPORTS.md'); return !!n && n.type === 'file' && n.content.trim().length > 15; } },

  /* ============ Chapter 31 — Incident File: The Phantom Disk ============ */
  { ch: 30, id: 'ph-df', title: 'PAGE: disk full, service failing',
    story: "3:02am page: halcyon is throwing write errors and the disk alarm is red. You log in cold. Before you touch anything, read the situation. How full is the root filesystem? This is the same `df -h` you first ran back in Chapter 2 — only now it's an emergency.",
    objective: 'Check free space on the root filesystem. What percent is `/` used? Answer with `submit NUMBER` (just the number).',
    hints: ['`df -h` reports free space per filesystem. Read the Use% column for the row mounted on `/`.', 'Give just the number, no percent sign.', 'Run `df -h`, read the `/` row’s Use%, then `submit 100`.'],
    onStart: () => { S.held = 6442450944; S.heldPid = 812; S.inodeBad = false; S.oom = null; S.iowait = false; S.compromise = false; },
    answer: a => { const n = a.trim().replace('%', ''); return n === '100' || n === '99'; } },
  { ch: 30, id: 'ph-du', title: 'But where did it go?',
    story: "`df` says the disk is full. The natural next move: add up what's actually on it with `du` and find the hog. Total the root filesystem (ignore the permission-denied noise) — you'll find the numbers don't agree with `df`. That disagreement is the whole case.",
    objective: 'Add up real usage with `du -sh /` (as root). Does `du` account for all the space `df` says is used? Answer `submit yes` or `submit no`.',
    hints: ['`sudo du -sh /` totals everything on disk. Compare it to the ~6G `df` claims is used.', '`du` only counts files that still have a name. If a big chunk is missing, the space is held by something with no name left.', 'The totals don’t match — `submit no`.'],
    answer: a => /^n/i.test(a.trim()) },
  { ch: 30, id: 'ph-lsof', title: 'Deleted, but not freed',
    story: "Space that `df` counts but `du` can't see almost always means a deleted file that a running process still holds open — the space isn't released until that process lets go. `lsof +L1` lists open files whose link count has dropped to zero: files that were `rm`'d while still open.",
    objective: 'Find the deleted-but-open file. Which PID is still holding it? Answer with `submit PID`.',
    hints: ['`sudo lsof +L1` lists open files with a link count of 0 (NLINK column). These are deleted files still held open.', 'Read the PID column of the row whose NAME ends with `(deleted)`.', 'Run `sudo lsof +L1`. The holder is PID 812.'],
    answer: a => a.trim() === '812' },
  { ch: 30, id: 'ph-path', title: 'Name the file',
    story: "You have the PID. Name the deleted file it's holding — that tells you what to stop logging to, and confirms this is a logging mistake, not an attack. The path is in the same `lsof +L1` output.",
    objective: 'What is the full path of the deleted file being held open? Answer with `submit PATH`.',
    hints: ['Read the NAME column of the `+L1` row — it shows the original path with `(deleted)` after it.', 'Give the path only, without the `(deleted)` marker.', 'Run `sudo lsof +L1`. It is `/var/log/halcyon/debug.log`.'],
    answer: a => a.trim().replace(/\s*\(deleted\)\s*$/, '') === '/var/log/halcyon/debug.log' },
  { ch: 30, id: 'ph-fix', title: 'Give the space back',
    story: "You can't `rm` your way out — the file is already deleted; the process just won't let go. The clean fix is to make the holder release its file handle. Restarting the service does exactly that (the real-world alternative, truncating the fd via `/proc`, is beyond this sandbox). Restart halcyon and watch the space come back.",
    objective: 'Restart the halcyon service so it releases the deleted file, then confirm `/` is no longer full.',
    hints: ['`sudo systemctl restart halcyon` makes the process close its open files, freeing the space.', 'After it restarts, run `df -h` — the `/` row should drop well below full.', 'Run `sudo systemctl restart halcyon`, then `df -h`.'],
    check: () => (S.held || 0) === 0 && S.restarted && S.restarted['halcyon'],
    nudge: () => "The space is still held. Restart the service that owns the file: `sudo systemctl restart halcyon`." },

  /* ============ Chapter 32 — Incident File: No Space, Plenty of Room ============ */
  { ch: 31, id: 'in-df', title: 'PAGE: cannot write, but df looks fine',

  { ch: 31, id: 'in-dfi', title: 'The other kind of full',
    story: "Every file needs an inode — a slot in the filesystem's table of files. You can run out of inodes with gigabytes of bytes still free, usually from millions of tiny files. `df -i` reports inodes instead of bytes. This is the flag that cracks the case.",

  { ch: 31, id: 'in-clean', title: 'Clear the old files',

function findSync() {
  const q = getNode(P.quar + '/sync_out.sh');
  if (q && q.type === 'file' && q.content === SYNC) return { abs: P.quar + '/sync_out.sh', node: q };
  let hit = null; walkAll(HOME, getNode(HOME), (p, n) => { if (!hit && n.type === 'file' && n.content === SYNC) hit = { abs: p, node: n }; });
  return hit;
}

}

  tout.appendChild(div); trimOut(); scrollEnd();
}
const promptPath = () => S.cwd === HOME ? '~' : S.cwd.startsWith(HOME + '/') ? '~' + S.cwd.slice(HOME.length) : S.cwd;

    let error = null;
    try { const r = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } }); error = r.error; } catch (e) { error = e; }
    if (error) { renderContent(`<h2>Couldn't send the link</h2><p class="race-err">${esc(error.message || 'Error')}.</p><p class="rlead">On Supabase's free built-in email, sign-in emails are rate-limited to a few per hour. For real sign-ups, add a custom SMTP sender in your project.</p><div class="race-row"><button class="btn" id="auBack" type="button">Back</button></div>`); const bk = $('#auBack'); if (bk) bk.addEventListener('click', openAuth); return; }
    renderContent(`<h2>Check your email</h2><p class="rlead">We sent a sign-in link to <b>${esc(email)}</b>. Open it on this device to finish signing in. You can close this.</p><div class="race-row"><button class="btn primary" id="auOk" type="button">Done</button></div>`);
    $('#auOk').addEventListener('click', () => { hideOverlay(); tin.focus({ preventScroll: true }); });
  });
}
/* ---------- appearance themes ---------- */
const THEMES = [
  { id: '', name: 'Halcyon Dark', bg: '#0f141c', dot: '#f2b04b' },
  { id: 'amber', name: 'Amber CRT', bg: '#120d02', dot: '#ffb224' },
  { id: 'green', name: 'Green Phosphor', bg: '#02100a', dot: '#7dff9e' },
  { id: 'nord', name: 'Nord Night', bg: '#2e3440', dot: '#88c0d0' },
  { id: 'paper', name: 'Paper (light)', bg: '#eef1f5', dot: '#c47f12' }
];
function currentTheme() { try { return localStorage.getItem('lsa-theme') || ''; } catch (e) { return ''; } }
function applyTheme(id) {
  if (id) document.documentElement.setAttribute('data-theme', id);
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('lsa-theme', id); } catch (e) {}
}
/* ---------- ⚙ Settings panel (theme + avatar + account) ---------- */
function openSettings() {
  showOverlay();
  const cur = currentTheme();
  const themeRows = THEMES.map(t => `<button class="tm-row ${t.id === cur ? 'sel' : ''}" type="button" data-th="${t.id}"><span class="tm-sw" style="background:${t.bg}"><i style="background:${t.dot}"></i></span>${esc(t.name)}${t.id === cur ? '<span class="tm-check">✓</span>' : ''}</button>`).join('');
  const av = loadAvatar();
  const avGrid = '<div class="set-avgrid">' + AVATARS.map(a => `<button class="avatar-opt ${a === av ? 'sel' : ''}" type="button" data-av="${a}" aria-label="Avatar ${a}">${a}</button>`).join('') + '</div>';
  let account;
  if (!supaConfig()) account = `<p class="rlead" style="margin:0 0 9px">Sign-in, cross-device progress sync, and the leaderboard need a free <b>Supabase</b> project. This is a self-hosted feature (not on the claude.ai version).</p><button class="btn" id="setConnect" type="button">Connect Supabase</button>`;
  else if (authUser) account = `<p class="rlead" style="margin:0 0 9px">Signed in as <b>${esc(authUser.email || authUser.name)}</b>. Your progress and race results sync to this account across devices.</p><button class="btn" id="setOut" type="button">Sign out</button>`;
  else account = `<p class="rlead" style="margin:0 0 9px">Sign in with a one-time email link (no password) to sync progress across devices and record your race times.</p><div class="race-row"><button class="btn primary" id="setSignin" type="button">Sign in</button><button class="btn" id="setReconnect" type="button">Supabase settings</button></div>`;
  const classroom = authUser
    ? `<div class="rlabel">Classroom</div><p class="rlead" style="margin:0 0 9px">Join a class with a code, or create one to teach.</p><button class="btn" id="setClassroom" type="button">Open classroom</button>`
    : '';
  renderContent(`<h2>Settings</h2>
    <div class="rlabel">Theme</div>
    <div id="setThemes" style="display:flex;flex-direction:column;gap:6px">${themeRows}</div>
    <div class="rlabel">Your avatar</div>
    ${avGrid}
    <div class="rlabel">Account</div>
    <div>${account}</div>
    ${classroom}
    <div class="race-row" style="margin-top:16px"><button class="btn primary" id="setDone" type="button">Done</button></div>`);
  document.querySelectorAll('#setThemes .tm-row').forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.th); openSettings(); }));
  document.querySelectorAll('#raceContent .avatar-opt[data-av]').forEach(bn => bn.addEventListener('click', () => { saveAvatar(bn.dataset.av); document.querySelectorAll('#raceContent .avatar-opt').forEach(x => x.classList.toggle('sel', x === bn)); }));
  const done = $('#setDone'); if (done) done.addEventListener('click', () => { hideOverlay(); tin.focus({ preventScroll: true }); });
  const conn = $('#setConnect'); if (conn) conn.addEventListener('click', () => renderSupabaseSetup(false, openSettings));
  const rec = $('#setReconnect'); if (rec) rec.addEventListener('click', () => renderSupabaseSetup(false, openSettings));
  const si = $('#setSignin'); if (si) si.addEventListener('click', openAuth);
  const out = $('#setOut'); if (out) out.addEventListener('click', async () => { const sb = await getSB(); if (sb) { try { await sb.auth.signOut(); } catch (e) {} } openSettings(); });
  const cr = $('#setClassroom'); if (cr) cr.addEventListener('click', openClassroom);
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Classroom (M2: create class + join by code + enrollment) ---------- */
async function cxLoad() {
  const sb = await getSB(); if (!sb || !authUser) return null;
  const out = { isTeacher: false, enrolled: [], owned: [] };
  try {
    const { data: prof } = await sb.from('profiles').select('is_teacher').eq('id', authUser.id).maybeSingle();
    out.isTeacher = !!(prof && prof.is_teacher);
  } catch (e) {}
  try {
    const { data } = await sb.from('enrollments').select('role,class_id,classes(name,term,join_code)').eq('user_id', authUser.id);
    out.enrolled = data || [];
  } catch (e) {}
  if (out.isTeacher) {
    try {
      const { data } = await sb.from('classes').select('id,name,term,join_code,created_at').eq('owner_id', authUser.id).order('created_at', { ascending: false });
      out.owned = data || [];
    } catch (e) {}
  }
  return out;
}
async function openClassroom() {
  if (!authUser) { openSettings(); return; }
  showOverlay();
  renderContent('<h2>Classroom</h2><p class="rlead">Loading…</p>');
  const d = await cxLoad();
  if (!d) {
    renderContent('<h2>Classroom</h2><p class="race-err">Couldn\'t reach your account. Try again.</p><div class="race-row"><button class="btn" id="cxBack" type="button">Back</button></div>');
    const b = $('#cxBack'); if (b) b.addEventListener('click', openSettings); return;
  }
  const enrolledHtml = d.enrolled.length
    ? d.enrolled.map(e => { const c = e.classes || {}; return `<div class="cx-item"><div><b>${esc(c.name || 'Class')}</b>${c.term ? ` <span class="cx-dim">· ${esc(c.term)}</span>` : ''}${e.role === 'ta' ? ' <span class="cx-badge">TA</span>' : ''}</div></div>`; }).join('')
    : '<p class="cx-dim">You haven\'t joined any classes yet.</p>';
  let teach;
  if (d.isTeacher) {
    const ownedHtml = d.owned.length
      ? d.owned.map(c => `<div class="cx-item"><div><b>${esc(c.name)}</b>${c.term ? ` <span class="cx-dim">· ${esc(c.term)}</span>` : ''}</div><code class="cx-code" data-code="${esc(c.join_code)}" title="Click to copy join code">${esc(c.join_code)}</code></div>`).join('')
      : '<p class="cx-dim">No classes yet — create one below.</p>';
    teach = `<div class="rlabel">Classes you teach</div>${ownedHtml}
      <div class="cx-form">
        <input id="cxName" type="text" placeholder="Class name (e.g. Linux Admin 101)">
        <input id="cxTerm" type="text" placeholder="Term (optional)">
        <button class="btn primary" id="cxCreate" type="button">Create class</button>
      </div>`;
  } else {
    teach = `<div class="rlabel">Teaching?</div><p class="cx-dim" style="margin:0 0 8px">Enable teacher tools to create classes and (soon) see your students' progress.</p><button class="btn" id="cxBecome" type="button">Enable teacher tools</button>`;
  }
  renderContent(`<h2>Classroom</h2>
    <div class="rlabel">Join a class</div>
    <div class="cx-form">
      <input id="cxCode" type="text" autocapitalize="characters" autocomplete="off" placeholder="Enter join code (e.g. 7FQ2K9)">
      <button class="btn primary" id="cxJoin" type="button">Join</button>
    </div>
    <div class="race-err" id="cxErr" hidden></div>
    <div class="rlabel">Classes you're in</div>
    ${enrolledHtml}
    ${teach}
    <div class="race-row" style="margin-top:16px"><button class="btn" id="cxBack" type="button">Back</button></div>`);
  $('#cxBack').addEventListener('click', openSettings);
  $('#cxJoin').addEventListener('click', cxDoJoin);
  const code = $('#cxCode'); if (code) code.addEventListener('keydown', ev => { if (ev.key === 'Enter') cxDoJoin(); });
  const bc = $('#cxBecome'); if (bc) bc.addEventListener('click', async () => {
    const sb = await getSB(); if (!sb) return;
    try { await sb.from('profiles').update({ is_teacher: true }).eq('id', authUser.id); } catch (e) {}
    openClassroom();
  });
  const cc = $('#cxCreate'); if (cc) cc.addEventListener('click', cxDoCreate);
  document.querySelectorAll('#raceContent .cx-code[data-code]').forEach(el => el.addEventListener('click', () => {
    const t = el.dataset.code; try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (e) {}
    const old = el.textContent; el.textContent = 'copied'; setTimeout(() => { el.textContent = old; }, 900);
  }));
}
async function cxDoJoin() {
  const inp = $('#cxCode'), er = $('#cxErr'); if (!inp) return;
  const code = (inp.value || '').trim();
  if (!code) { er.hidden = false; er.textContent = 'Enter a join code.'; return; }
  const sb = await getSB(); if (!sb) { er.hidden = false; er.textContent = 'Not connected.'; return; }
  er.hidden = true;
  let error = null, row = null;
  try { const r = await sb.rpc('enroll_by_code', { code }); error = r.error; row = r.data && r.data[0]; } catch (e) { error = e; }
  if (error) { er.hidden = false; er.textContent = String(error.message || 'Could not join').replace(/\.*$/, '') + '.'; return; }
  hideOverlay(); tin.focus({ preventScroll: true });
  emitSys(row && row.already_enrolled
    ? `You're already in <b>${esc(row.cname)}</b>.`
    : `Joined <b>${esc(row ? row.cname : 'the class')}</b>.`, 'ok');
}
async function cxDoCreate() {
  const nm = ($('#cxName').value || '').trim(), term = ($('#cxTerm').value || '').trim(), er = $('#cxErr');
  if (!nm) { er.hidden = false; er.textContent = 'Enter a class name.'; return; }
  const sb = await getSB(); if (!sb) return;
  let error = null, row = null;
  try { const r = await sb.from('classes').insert({ owner_id: authUser.id, name: nm, term: term || null }).select('name,join_code').single(); error = r.error; row = r.data; } catch (e) { error = e; }
  if (error) { er.hidden = false; er.textContent = String(error.message || 'Could not create class') + '.'; return; }
  await openClassroom();
  emitSys(`Created <b>${esc(row ? row.name : nm)}</b>. Share join code <code>${esc(row ? row.join_code : '')}</code> with your students.`, 'ok');
}

boot(load());
try { authInit(); } catch (e) {}

// Avatar picker init
/* Wire the rack / chips toggles and default the rack collapsed.
   (Avatar selection now lives in the ⚙ Settings panel.) */
(function initPanels() {
  const rt = document.getElementById('btnRackToggle');
  if (rt) rt.onclick = toggleRack;
  const ct = document.getElementById('btnChipsToggle');
  if (ct) ct.onclick = toggleChips;
  rackExpanded = false;
  const ledsEl = document.getElementById('leds');
  if (ledsEl) ledsEl.classList.add('collapsed');
})();

})();
</script>
