name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only builds and tests; it does not need to write repository contents,
# publish packages, or create deployments.
permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase schema and RLS tests
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER" || true
          supabase/test/run.sh

      - name: Install axe-core accessibility scanner
        run: npm install --no-save --package-lock=false axe-core@4.10.3 playwright@1.64.1

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Linux build, unit tests, verification, and generated-file check
        run: npm run check

      - name: Automated accessibility scans (axe-core + Playwright)
        run: npm run test:a11y

      - name: Automated accessibility scans (Firefox)
        run: PLAYWRIGHT_BROWSER=firefox npm run test:a11y

      - name: Automated accessibility scans (WebKit)
        run: PLAYWRIGHT_BROWSER=webkit npm run test:a11y

      - name: Linux browser smoke test
        run: npm run smoke

      - name: Firefox browser compatibility tests
        run: npm run test:ui:firefox

      - name: WebKit browser compatibility tests
        run: npm run test:ui:webkit

      - name: Linux classroom UI tests
        run: npm run test:ui

      - name: Learner reflection and evidence browser tests
        run: node test-learner-reflections-ui.js

      - name: Linux authored-mission playback tests
        run: npm run test:play

      - name: Linux server health dashboard browser tests
        run: npm run test:health

      - name: Linux guided-learning pilot tests
        run: npm run test:learning

      - name: Linux adaptive spaced-recall browser tests
        run: node test-spaced-revision-ui.js

      - name: Evidence-based skill portfolio browser tests
        run: node test-skill-portfolio-ui.js

      - name: Virtual IT company service desk browser tests
        run: node test-company-service-desk-ui.js

      - name: Validate daily practice script syntax
        run: node --check daily-practice.js

      - name: Daily practice and skill progression browser tests
        run: node test-daily-practice-ui.js

      - name: Build Network Trainer
        run: npm run build:net

      - name: Network Trainer generated-file check
        run: git diff --exit-code -- network-trainer/index.html

      - name: Network Trainer engine, CLI, mission, scenario, and classroom tests
        run: npm --prefix network-trainer test

      - name: Network Trainer browser UI tests
        run: npm --prefix network-trainer run test:ui

      - name: Network Trainer core UI tests (Firefox)
        run: npm --prefix network-trainer run test:ui:firefox

      - name: Network Trainer core UI tests (WebKit)
        run: npm --prefix network-trainer run test:ui:webkit

      - name: Network Trainer ticket queue UI tests (Firefox)
        run: npm --prefix network-trainer run test:ticket-queue:firefox

      - name: Network Trainer ticket queue UI tests (WebKit)
        run: npm --prefix network-trainer run test:ticket-queue:webkit

      - name: Network Trainer incident management UI tests (Firefox)
        run: npm --prefix network-trainer run test:incidents:firefox

      - name: Network Trainer incident management UI tests (WebKit)
        run: npm --prefix network-trainer run test:incidents:webkit

      - name: Network Trainer change management UI tests (Firefox)
        run: npm --prefix network-trainer run test:changes:firefox

      - name: Network Trainer change management UI tests (WebKit)
        run: npm --prefix network-trainer run test:changes:webkit

      - name: Network Trainer infrastructure inventory UI tests (Firefox)
        run: npm --prefix network-trainer run test:inventory:firefox

      - name: Network Trainer infrastructure inventory UI tests (WebKit)
        run: npm --prefix network-trainer run test:inventory:webkit

      - name: Network Trainer topology keyboard tests (Firefox)
        run: cd network-trainer && PLAYWRIGHT_BROWSER=firefox node test-topology-objects-keyboard-ui.js

      - name: Network Trainer topology keyboard tests (WebKit)
        run: cd network-trainer && PLAYWRIGHT_BROWSER=webkit node test-topology-objects-keyboard-ui.js

      - name: Network Trainer topology inspection tests (Firefox)
        run: cd network-trainer && PLAYWRIGHT_BROWSER=firefox node test-workbench-topology-ui.js

      - name: Network Trainer topology inspection tests (WebKit)
        run: cd network-trainer && PLAYWRIGHT_BROWSER=webkit node test-workbench-topology-ui.js

      - name: Network Trainer topology text editor tests (Firefox)
        run: npm --prefix network-trainer run test:text:firefox

      - name: Network Trainer topology text editor tests (WebKit)
        run: npm --prefix network-trainer run test:text:webkit

      - name: Verify Network Trainer generated file remains current
        run: git diff --exit-code -- network-trainer/index.html

      - name: Measure generated page transfer sizes
        run: node tools/check-performance-budget.js
