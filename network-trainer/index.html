// Networking Trainer — M1 engine spike.
// Pure, headless network model + forwarding engine. No DOM, no UI.
// IPs are stored as unsigned 32-bit integers so subnet math is bitwise.

/* ---------- IP / subnet math ---------- */
const ip = s => { const p = String(s).split('.').map(Number); return (((p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]) >>> 0); };

const networkOf = (addr, prefix) => (addr & maskOf(prefix)) >>> 0;
const sameNet = (a, b, prefix) => networkOf(a, prefix) === networkOf(b, prefix);
// parse "10.0.1.0/24" -> { net, prefix }
const cidr = s => { const [a, p] = String(s).split('/'); return { net: networkOf(ip(a), Number(p)), prefix: Number(p) }; };

/* ---------- topology helpers ---------- */
// Is a device interface present and up?
function ifaceUp(net, dev, name) {
  const d = net.devices[dev]; const f = d && d.ifaces && d.ifaces[name];
  return !!(f && f.up !== false);
}
// The interface on the other end of the link from (dev, name), if the link and both ends are up.
function neighbor(net, dev, name) {
  for (const l of net.links) {
    if (l.up === false) continue;
    const match = (l.a[0] === dev && l.a[1] === name) ? l.b
      : (l.b[0] === dev && l.b[1] === name) ? l.a : null;

// Switches are transparent (we expand to their other ports in the same VLAN);
// hosts and routers are endpoints (we don't forward through them at L2).
function l2Domain(net, startDev, startIface) {
  const endpoints = [], seen = new Set();
  const first = neighbor(net, startDev, startIface);
  if (!first) return endpoints;
  const stack = [first];
  while (stack.length) {
    const [d, i] = stack.pop(); const key = d + '|' + i;
    if (seen.has(key)) continue; seen.add(key);

        if ((dev.ifaces[p].vlan ?? null) !== vlan) continue;   // VLAN segmentation

      endpoints.push([d, i]);

const ownsIp = (dev, addr) => Object.values(dev.ifaces || {}).some(f => f.up !== false && f.ip === addr);
function directIface(dev, addr) {                 // iface whose subnet contains addr
  for (const name in dev.ifaces) {
    const f = dev.ifaces[name];
    if (f.up === false || f.ip == null) continue;
    if (sameNet(f.ip, addr, f.mask)) return name;

}

}

/* ---------- ACLs (inbound, first match wins, default allow) ---------- */
function aclMatch(rule, dir, iface, pkt) {

    }

    const r = routeLookup(dev, dst);               // otherwise route it
    if (!r) return { ok: false, path, reason: 'no route to ' + ipStr(dst), at: cur };
    const gwIface = directIface(dev, r.via);
    if (!gwIface) return { ok: false, path, reason: 'next hop not on a connected subnet', at: cur };
    const gw = l2Domain(net, cur, gwIface).find(([d, i]) => net.devices[d].ifaces[i].ip === r.via && net.devices[d].ifaces[i].up !== false);
    if (!gw) return { ok: false, path, reason: 'gateway ' + ipStr(r.via) + ' unreachable', at: cur };
    const [nd, ni] = gw;
    if (aclDecision(net.devices[nd], 'in', ni, pkt) === 'deny') return { ok: false, path: path.concat(nd), reason: 'blocked by ACL', at: nd };
    cur = nd;                                      // advance to next hop
  }
  return { ok: false, path, reason: 'TTL exceeded (routing loop?)' };
}

// The source address a device would use to reach dst (for reply packets).
function sourceIpToward(net, devId, dst) {
  const d = net.devices[devId];
  const di = directIface(d, dst); if (di) return d.ifaces[di].ip;
  const r = routeLookup(d, dst); if (r) { const gi = directIface(d, r.via); if (gi) return d.ifaces[gi].ip; }
  for (const n in d.ifaces) if (d.ifaces[n].ip != null) return d.ifaces[n].ip;
  return null;
}

// A full round trip (like ICMP echo): request must arrive AND the reply must come back.
// Catches asymmetric ACLs / missing return routes, which pure one-way reachability misses.
function ping(net, srcDev, dst, base = {}) {
  const proto = base.proto || 'icmp', dport = base.dport;
  const srcIp = sourceIpToward(net, srcDev, dst);
  const fwd = forward(net, srcDev, { src: srcIp, dst, proto, dport });

  const dstDev = deviceOwning(net, dst);
  if (!dstDev) return { ok: false, dir: 'request', reason: 'no such host' };
  const rev = forward(net, dstDev, { src: dst, dst: srcIp, proto, dport });
  return { ok: rev.ok, reason: rev.ok ? 'reachable' : ('reply: ' + rev.reason), forward: fwd, reply: rev };
}

module.exports = {
  ip, ipStr, maskOf, networkOf, sameNet, cidr,
  neighbor, l2Domain, ownsIp, directIface, routeLookup, deviceOwning,
  aclDecision, forward, ping, sourceIpToward
};

// Mission checks — pure functions of the model that return { ok, reason }.
// These are what a mission's success criteria are built from, and what the
// no-code mission editor would expose. Direct parallel to the sysadmin checkers.
const M = require('./net-model');

// Primary address of a device (first up interface with an IP).
function primaryIp(dev) {
  for (const n in dev.ifaces) { const f = dev.ifaces[n]; if (f.up !== false && f.ip != null) return f.ip; }
  return null;
}

// Host A can reach host B (round trip), optionally for a specific proto/port.
function reachable(net, aId, bId, base = {}) {
  const b = net.devices[bId]; if (!b) return { ok: false, reason: `no device ${bId}` };
  const dst = primaryIp(b); if (dst == null) return { ok: false, reason: `${bId} has no IP` };
  const r = M.ping(net, aId, dst, base);
  return { ok: r.ok, reason: r.ok ? `${aId} reaches ${bId}` : `${aId} cannot reach ${bId}: ${r.reason}` };
}
function notReachable(net, aId, bId, base = {}) {
  const r = reachable(net, aId, bId, base);
  return { ok: !r.ok, reason: r.ok ? `${aId} can reach ${bId} but should not` : `${aId} correctly cannot reach ${bId}` };
}

// Device has a route covering the given CIDR (e.g. "10.0.2.0/24").
function routeExists(net, devId, cidrStr) {
  const d = net.devices[devId]; if (!d) return { ok: false, reason: `no device ${devId}` };
  const c = M.cidr(cidrStr);
  const hit = (d.routes || []).some(r => M.networkOf(r.dest, c.prefix) === c.net && r.mask >= c.prefix);
  return { ok: hit, reason: hit ? `${devId} has a route to ${cidrStr}` : `${devId} has no route to ${cidrStr}` };
}

// An interface has an address inside the intended CIDR.
function subnetCorrect(net, devId, ifaceName, cidrStr) {
  const d = net.devices[devId]; const f = d && d.ifaces[ifaceName];
  if (!f) return { ok: false, reason: `no interface ${devId}/${ifaceName}` };
  const c = M.cidr(cidrStr);
  const ok = f.ip != null && f.mask === c.prefix && M.networkOf(f.ip, c.prefix) === c.net;
  return { ok, reason: ok ? `${devId}/${ifaceName} is correctly in ${cidrStr}` : `${devId}/${ifaceName} (${f.ip == null ? 'unset' : M.ipStr(f.ip) + '/' + f.mask}) is not in ${cidrStr}` };
}

// A firewall/host blocks a specific packet from a source host to a destination IP.
function aclBlocks(net, srcId, dstCidrOrIp, pkt) {
  const dst = typeof dstCidrOrIp === 'number' ? dstCidrOrIp : M.ip(dstCidrOrIp);
  const r = M.forward(net, srcId, { src: M.sourceIpToward(net, srcId, dst), dst, proto: pkt.proto, dport: pkt.dport });

  return { ok: blocked, reason: blocked ? `traffic is blocked (${r.reason} at ${r.at})` : `traffic was NOT blocked (${r.reason})` };

// A device is offering a service on a port.
function serviceUp(net, devId, port) {
  const d = net.devices[devId];
  const ok = !!(d && d.services && d.services[port]);
  return { ok, reason: ok ? `${devId} offers ${d.services[port]} on ${port}` : `${devId} has no service on port ${port}` };
}

module.exports = { primaryIp, reachable, notReachable, routeExists, subnetCorrect, aclBlocks, serviceUp };

      if (!dev.acls.length) return ok('Chain INPUT (policy ACCEPT)\n  (no rules)');

      return ok('Chain INPUT\n' + rows.join('\n'));

const MAN = {
  ip: 'ip — show / configure addresses and routes.\n  ip addr                     list interfaces and addresses\n  ip addr add A/p dev IF      give an interface an address\n  ip route                    show the routing table\n  ip route add default via G  set a default gateway\n  ip route add CIDR via G     add a static route',
  ping: 'ping HOST — send an echo and wait for the reply. Reports the path and, on failure, where the packet died.',
  traceroute: 'traceroute HOST — list the hops a packet passes through toward HOST.',
  iptables: 'iptables -L — list firewall rules.\n  iptables -A INPUT -i IF -p tcp --dport N -j DROP — drop matching inbound traffic.\n  Rules match top-down, first match wins.',
  nmap: 'nmap HOST — (read-only) list the services a host is exposing. Use it to see your own attack surface.',
  tcpdump: 'tcpdump — print the packets from your last ping on the wire.',
  arp: 'arp — show the neighbours learned on each interface (same L2 segment).'
};

module.exports = { makeCLI, resolve, primaryIp };

__def("./net-mission", function(module, exports, require){
// Networking Trainer — M3: the mission layer.
// A mission is DATA: a starting topology + a list of declarative checks. The
// runner builds the world, binds a CLI, and grades the checks after any command.
// Same shape as the sysadmin game's missions and its authored-mission check types,
// so a no-code mission editor can emit these directly.
const C = require('./net-checks');
const { makeCLI } = require('./net-cli');

// Map a declarative check spec -> a { ok, reason } result.
function evalCheck(net, s) {
  const opt = {}; if (s.proto) opt.proto = s.proto; if (s.dport != null) opt.dport = s.dport;
  switch (s.type) {
    case 'reachable':      return C.reachable(net, s.a, s.b, opt);
    case 'not_reachable':  return C.notReachable(net, s.a, s.b, opt);
    case 'route_exists':   return C.routeExists(net, s.dev, s.cidr);
    case 'subnet_correct': return C.subnetCorrect(net, s.dev, s.iface, s.cidr);
    case 'acl_blocks':     return C.aclBlocks(net, s.src, s.dst, { proto: s.proto, dport: s.dport });
    case 'service_up':     return C.serviceUp(net, s.dev, s.port);
    default:               return { ok: false, reason: `unknown check type: ${s.type}` };
  }
}

// Start a mission: fresh world + a console on the starting device.
function startMission(mission) {
  const net = mission.build();
  const cli = makeCLI(net, mission.console);
  const api = {
    net, cli, mission,
    run: line => cli.run(line),
    on: dev => { cli.on(dev); return api; },
    results: () => mission.success.map(s => ({ spec: s, ...evalCheck(net, s) })),
    done: () => api.results().every(r => r.ok),
    // The `check` command: what's still unmet and why (the teaching moment).
    status() {
      const unmet = api.results().filter(r => !r.ok);
      return unmet.length
        ? 'Not resolved yet:\n' + unmet.map(r => '  ✗ ' + r.reason).join('\n')
        : '✓ All objectives met — ticket resolved.';
    }
  };
  return api;
}

module.exports = { evalCheck, startMission };

// ---- UI (runs on load) ----
// Networking Trainer — M4 UI. Runs in the browser on top of the SAME tested
// modules (loaded via the tiny require() shim the build injects). Renders the
// topology, config panels, a terminal, and the mission briefing + Check.
const M = require('./net-model');
const { startMission } = require('./net-mission');
const { chapters } = require('./net-chapters');

let RUN = null, SEL = null, HINTS = 0;
const $ = s => document.querySelector(s);

/* ---------- layered auto-layout (left→right by hop distance) ---------- */
function layout(net) {
  const ids = Object.keys(net.devices), adj = {};
  ids.forEach(i => adj[i] = new Set());
  net.links.forEach(l => { adj[l.a[0]].add(l.b[0]); adj[l.b[0]].add(l.a[0]); });
  const anchor = ids.find(i => net.devices[i].kind === 'host') || ids[0];
  const layer = { [anchor]: 0 }, q = [anchor];
  while (q.length) { const n = q.shift(); adj[n].forEach(m => { if (layer[m] == null) { layer[m] = layer[n] + 1; q.push(m); } }); }
  ids.forEach(i => { if (layer[i] == null) layer[i] = 0; });
  const byLayer = {}; ids.forEach(i => (byLayer[layer[i]] = byLayer[layer[i]] || []).push(i));
  const pos = {};
  Object.keys(byLayer).map(Number).sort((a, b) => a - b).forEach(L => {
    byLayer[L].forEach((id, idx) => { pos[id] = [90 + L * 150, 60 + idx * 86]; });
  });
  return pos;
}
const primaryIp = dev => { for (const n in dev.ifaces) { const f = dev.ifaces[n]; if (f.up !== false && f.ip != null) return M.ipStr(f.ip); } return null; };
const KINDCLASS = { host: 'k-host', switch: 'k-switch', router: 'k-router', firewall: 'k-fw' };

function linkDown(net, l) {
  if (l.up === false) return true;
  const up = (d, i) => { const f = net.devices[d] && net.devices[d].ifaces[i]; return f && f.up !== false; };
  return !(up(l.a[0], l.a[1]) && up(l.b[0], l.b[1]));
}

function renderTopo() {
  const net = RUN.net, pos = layout(net);
  const maxX = Math.max(...Object.values(pos).map(p => p[0])) + 130;
  const maxY = Math.max(...Object.values(pos).map(p => p[1])) + 70;
  const cx = id => pos[id][0] + 48, cy = id => pos[id][1] + 22;
  let s = `<svg id="topo" viewBox="0 0 ${maxX} ${maxY}" role="img" aria-label="network topology">`;
  for (const l of net.links) {
    const down = linkDown(net, l);
    s += `<line x1="${cx(l.a[0])}" y1="${cy(l.a[0])}" x2="${cx(l.b[0])}" y2="${cy(l.b[0])}" class="edge${down ? ' down' : ''}"/>`;
  }
  for (const id in net.devices) {
    const d = net.devices[id], [x, y] = pos[id], ip = primaryIp(d);
    s += `<g class="node ${KINDCLASS[d.kind]} ${id === SEL ? 'sel' : ''}" data-dev="${id}" transform="translate(${x},${y})">
      <rect width="96" height="44" rx="8"/>
      <text x="48" y="19" text-anchor="middle" class="n-id">${id}</text>
      <text x="48" y="34" text-anchor="middle" class="n-sub">${ip || d.kind}</text></g>`;
  }
  return s + '</svg>';
}

function renderBrief() {
  const m = RUN.mission;
  const opts = chapters.map((c, i) => `<option value="${i}"${c.id === m.id ? ' selected' : ''}>${c.chapter} — ${c.title}</option>`).join('');
  const hints = m.hints.slice(0, HINTS).map((h, i) => `<li>${esc(h)}</li>`).join('');
  return `<div class="brandbar"><span class="brandname">Networking Trainer</span><a class="xlink" href="../" title="Back to the Linux game">The Last Sysadmin ↗</a></div>
    <select id="pick">${opts}</select>
    <div class="eyebrow">${esc(m.chapter)}</div>
    <h1>${esc(m.title)}</h1>
    <p class="story">${esc(m.story)}</p>
    <div class="label">Objective</div><p>${esc(m.objective)}</p>
    <div class="label">Hints</div><ol>${hints}</ol>
    <div class="row"><button id="hint" class="btn">Show hint</button><button id="check" class="btn primary">Check</button></div>
    <div id="status"></div>`;
}

function renderConfig() {
  if (!SEL) return '<p class="dim">Click a device to configure it.</p>';
  const d = RUN.net.devices[SEL];
  let h = `<div class="label">${SEL} · ${d.kind}</div>`;
  // interfaces
  h += '<div class="label2">Interfaces</div>';
  for (const n in d.ifaces) {
    const f = d.ifaces[n];
    h += `<div class="ifrow" data-if="${n}"><span class="ifn">${n}</span>
      <input class="ip" value="${f.ip != null ? M.ipStr(f.ip) : ''}" placeholder="address"/>
      <span>/</span><input class="pfx" value="${f.mask != null ? f.mask : ''}" placeholder="24" size="2"/>
      <label class="up"><input type="checkbox" class="upc"${f.up !== false ? ' checked' : ''}/>up</label></div>`;
  }
  // routes
  if (d.kind !== 'switch') {
    h += '<div class="label2">Routes</div>';
    (d.routes || []).forEach((r, i) => {
      const dest = r.mask === 0 ? 'default' : M.ipStr(r.dest) + '/' + r.mask;
      h += `<div class="rrow">${dest} via ${M.ipStr(r.via)} <button class="x" data-rt="${i}">✕</button></div>`;
    });
    h += `<div class="addrow"><input class="rdest" placeholder="default or 10.0.3.0/24"/><input class="rvia" placeholder="via gateway"/><button class="btn sm" id="addrt">Add route</button></div>`;
  }
  // firewall
  if (d.kind === 'router' || d.kind === 'firewall') {
    h += '<div class="label2">Firewall (inbound)</div>';
    (d.acls || []).forEach((r, i) => {
      h += `<div class="rrow">${r.action === 'deny' ? 'DROP' : 'ALLOW'} ${r.proto || 'all'} in:${r.dev || 'any'}${r.src != null ? ' src:' + M.ipStr(r.src) : ''}${r.dport != null ? ' dpt:' + r.dport : ''} <button class="x" data-acl="${i}">✕</button></div>`;
    });
    const ifopts = Object.keys(d.ifaces).map(n => `<option>${n}</option>`).join('');
    h += `<div class="addrow"><select class="aif">${ifopts}</select>
      <select class="aproto"><option value="">any</option><option>tcp</option><option>udp</option><option>icmp</option></select>
      <input class="adport" placeholder="dport" size="4"/><input class="asrc" placeholder="src ip" size="8"/>
      <select class="aact"><option value="deny">DROP</option><option value="allow">ALLOW</option></select>
      <button class="btn sm" id="addacl">Add</button></div>`;
  }
  return h;
}

/* ---------- actions ---------- */
function refresh() { $('#topoWrap').innerHTML = renderTopo(); $('#config').innerHTML = renderConfig(); wireTopo(); wireConfig(); }
function reloadMission(i) { RUN = startMission(chapters[i]); SEL = RUN.mission.console; HINTS = 0; $('#brief').innerHTML = renderBrief(); wireBrief(); refresh(); termClear(); termEcho(`— ${RUN.mission.title} — you are on ${SEL}. Try: ping, ip addr, ip route`); }

function termEcho(s) { const o = $('#tout'); o.textContent += s + '\n'; o.scrollTop = o.scrollHeight; }
function termClear() { $('#tout').textContent = ''; }

function doCheck() {
  const box = $('#status'); box.innerHTML = '';
  const done = RUN.done();
  box.className = done ? 'ok' : 'bad';
  box.innerHTML = done
    ? '✓ All objectives met — ticket resolved.'
    : 'Not resolved yet:<ul>' + RUN.results().filter(r => !r.ok).map(r => `<li>${esc(r.reason)}</li>`).join('') + '</ul>';
}

/* ---------- wiring ---------- */
function wireTopo() {
  document.querySelectorAll('#topo .node').forEach(n => n.addEventListener('click', () => { SEL = n.dataset.dev; refresh(); }));
}
function wireBrief() {
  $('#pick').addEventListener('change', e => reloadMission(+e.target.value));
  $('#hint').addEventListener('click', () => { if (HINTS < RUN.mission.hints.length) HINTS++; $('#brief').innerHTML = renderBrief(); wireBrief(); });
  $('#check').addEventListener('click', doCheck);
}
function wireConfig() {
  if (!SEL) return;
  const d = RUN.net.devices[SEL];
  document.querySelectorAll('#config .ifrow').forEach(row => {
    const n = row.dataset.if;
    const apply = () => {
      const ipv = row.querySelector('.ip').value.trim(), pfx = row.querySelector('.pfx').value.trim();
      d.ifaces[n].up = row.querySelector('.upc').checked;
      if (/^\d+\.\d+\.\d+\.\d+$/.test(ipv) && pfx) { d.ifaces[n].ip = M.ip(ipv); d.ifaces[n].mask = +pfx; }
      else if (!ipv) { delete d.ifaces[n].ip; delete d.ifaces[n].mask; }
      refresh();
    };
    row.querySelector('.ip').addEventListener('change', apply);
    row.querySelector('.pfx').addEventListener('change', apply);
    row.querySelector('.upc').addEventListener('change', apply);
  });
  const addrt = $('#addrt');
  if (addrt) addrt.addEventListener('click', () => {
    const dest = $('#config .rdest').value.trim(), via = $('#config .rvia').value.trim();
    if (!/^\d+\.\d+\.\d+\.\d+$/.test(via)) return;
    d.routes = d.routes || [];
    if (dest === 'default' || dest === '') d.routes.push({ dest: 0, mask: 0, via: M.ip(via) });
    else { const c = M.cidr(dest); d.routes.push({ dest: c.net, mask: c.prefix, via: M.ip(via) }); }
    refresh();
  });
  document.querySelectorAll('#config [data-rt]').forEach(b => b.addEventListener('click', () => { d.routes.splice(+b.dataset.rt, 1); refresh(); }));
  const addacl = $('#addacl');
  if (addacl) addacl.addEventListener('click', () => {
    const g = s => $('#config ' + s).value.trim();
    const rule = { dir: 'in', dev: g('.aif') || undefined, action: g('.aact') };
    if (g('.aproto')) rule.proto = g('.aproto');
    if (g('.adport')) rule.dport = +g('.adport');
    if (/^\d+\.\d+\.\d+\.\d+$/.test(g('.asrc'))) rule.src = M.ip(g('.asrc'));
    d.acls = d.acls || []; d.acls.push(rule); refresh();
  });
  document.querySelectorAll('#config [data-acl]').forEach(b => b.addEventListener('click', () => { d.acls.splice(+b.dataset.acl, 1); refresh(); }));
}
function wireTerm() {
  $('#tin').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const line = e.target.value; e.target.value = '';
    if (!line.trim()) return;
    termEcho(`${SEL}:~$ ${line}`);
    const r = RUN.cli.on(SEL).run(line);
    if (r.out) termEcho(r.out);
    refresh();                     // a command may have changed the model
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- boot ---------- */
function boot() {
  document.getElementById('app').innerHTML = `
    <aside id="brief"></aside>
    <main>
      <div id="topoWrap"></div>
      <div id="term"><pre id="tout"></pre><div class="tline"><span>$</span><input id="tin" autocomplete="off" placeholder="type a command — ping, ip addr, ip route add…"/></div></div>
    </main>
    <aside id="config"></aside>`;
  wireTerm();
  reloadMission(0);
}
if (document.readyState !== 'loading') boot(); else document.addEventListener('DOMContentLoaded', boot);

</script></body></html>
