name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Cancel in-progress Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            // The workflow concurrency group cancels the old *run*, but a
            // Pages deployment already handed to the API stays "in progress"
            // and the next deploy fails with "cancel <sha> first". Clear those.
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.listPagesBuilds({
                owner, repo, per_page: 10
              });
              for (const build of data) {
                if (build.status === 'queued' || build.status === 'building') {
                  core.info(`Cancelling Pages build ${build.id} (${build.commit})`);
                  await github.request('POST /repos/{owner}/{repo}/pages/builds/{build_id}/cancel', {
                    owner, repo, build_id: build.id
                  }).catch(e => core.warning(`Could not cancel build ${build.id}: ${e.message}`));
                }
              }
            } catch (e) {
              core.warning(`Could not list Pages builds: ${e.message}`);
            }

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
