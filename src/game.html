<title>The Last Sysadmin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: briefing panel on the left like a rack-side clipboard, a full-height SSH terminal on the right; stacks on phones. */
:root{
  --bg:#0f141c; --panel:#151c27; --raise:#1b2432; --line:#273244; --ink:#e3e8f0; --muted:#8e9ab0;
  --term:#0a0e14; --term-bar:#0d121a; --term-ink:#d5dce7;
  --amber:#f2b04b; --on-amber:#1d1508; --blue:#7fb2f5; --green:#78d39f; --red:#ff8471; --violet:#c79bf2; --led-off:#243042;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:24px;border:1.5px solid var(--muted);border-radius:3px;position:relative;flex:none}
.mark::before{content:"";position:absolute;left:5px;top:50%;width:13px;height:2px;margin-top:-1px;background:var(--muted)}
.mark::after{content:"";position:absolute;right:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.07em;text-transform:uppercase;line-height:1.1}
.sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;padding:0 12px;border-right:1px solid var(--line)}
.stat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--f-body);font-size:13px;font-weight:500;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:color-mix(in srgb,var(--amber) 22%,var(--raise));border-color:var(--amber);color:var(--amber)}
.stat .v.live{color:var(--amber)}
#speed .label{margin-bottom:8px}
.spd-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.spd-row:last-child{border-bottom:0}
.spd-row .sv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.spd-live{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums}
.spd-hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn:focus-visible,.chip:focus-visible,.key:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:16px;min-height:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:20px;padding-right:6px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.ticket{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.panel h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;margin:6px 0 0;text-wrap:balance}
.story{margin:0;color:var(--ink);opacity:.86;max-width:60ch}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.04em;text-transform:none;font-weight:400}
.objective{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px}
.objective p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--term);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--term-ink);word-break:break-word}
.hints ol{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hints ol:empty{display:none}
.hints li{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.leds{display:flex;flex-direction:column;gap:7px}
.grp{display:flex;align-items:center;gap:6px}
.gl{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:34px}
.led{width:18px;height:8px;border-radius:2px;background:var(--led-off)}
.led.done{background:var(--green);box-shadow:0 0 6px color-mix(in srgb,var(--green) 70%,transparent)}
.led.cur{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1.4s ease-in-out infinite}
.gt{font-size:12px;color:var(--muted);margin-left:6px}
@keyframes blink{50%{opacity:.45}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--term);color:var(--term-ink)}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.empty{font-size:13px;color:var(--muted);margin:0}
.finale{display:flex;flex-direction:column;gap:14px}
.finale .big{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--amber);line-height:1}
.next{border:1px dashed var(--muted);border-radius:8px;padding:12px 14px}
.next p{margin:4px 0 0;font-size:14px;color:var(--muted)}

.term{display:flex;flex-direction:column;min-height:0;background:var(--term);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--term-bar)}
.term-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.term-bar .r{margin-left:auto;white-space:nowrap}
.term-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 12px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;color:var(--term-ink);cursor:text}
.o{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.o.err{color:var(--red)}
.pu{color:var(--amber)}.pp{color:var(--blue)}
.c-d{color:var(--blue);font-weight:600}.c-x{color:var(--green)}.c-m{color:var(--red);font-weight:600}.c-f{color:var(--violet)}.c-n{color:var(--green)}
.sys{font-family:var(--f-body);font-size:13.5px;line-height:1.5;margin:10px 0;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);white-space:normal;cursor:auto;max-width:72ch}
.sys.ok{border-color:color-mix(in srgb,var(--green) 55%,var(--line));color:var(--green)}
.sys.ok b{color:var(--green)}
.sys.warn{border-color:var(--red)}
.sys.hint,.sys.nudge{border-color:color-mix(in srgb,var(--amber) 50%,var(--line))}
.sys.ticket b{color:var(--amber)}
.sys.chapter{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 0;margin-top:16px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.sys.chapter .chap{color:var(--amber);margin-right:8px}
.tline{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline}
.tline label{white-space:nowrap}
.tline input{flex:1 1 12ch;min-width:0;background:transparent;border:0;outline:0;color:var(--term-ink);font:inherit;caret-color:var(--amber);padding:0}
.keys{display:none;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--term-bar);overflow-x:auto}
.key{font-family:var(--f-mono);font-size:13px;min-width:38px;padding:6px 8px;border-radius:5px;border:1px solid var(--line);background:var(--raise);color:var(--term-ink)}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .stage{grid-template-columns:minmax(0,1fr)}
  .panel{overflow:visible;padding-right:0}
  .term{height:72vh;height:72svh}
  .keys{display:flex}
  .stat{padding:0 8px}
}
@media (pointer:coarse){.keys{display:flex}}
@media (prefers-reduced-motion:reduce){.led.cur{animation:none}}

/* ---- Race mode ---- */
body.racing #leds,body.racing #chips,body.racing #speed,body.racing #finale,body.racing .panel>div:last-child{display:none!important}
body.racing #raceBoard{display:block!important}
#raceOverlay{position:fixed;inset:0;z-index:50;background:rgba(7,10,15,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left)) 16px}
.race-modal{position:relative;width:min(560px,100%);max-height:88vh;max-height:88svh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.race-x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:4px 8px;border-radius:6px}
.race-x:hover{color:var(--ink);background:var(--raise)}
.race-modal h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em;margin:0 0 4px}
.race-modal .rlead{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:46ch}
.race-modal .rlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 7px}
.race-modal input[type=text]{width:100%;box-sizing:border-box;background:var(--term);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit;padding:9px 11px;outline:0}
.race-modal input[type=text]:focus{border-color:var(--amber)}
.race-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.race-row .btn{flex:0 0 auto}
.scenarios{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.scn{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--raise);color:var(--ink);cursor:pointer}
.scn:hover{border-color:var(--muted)}
.scn.sel{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--raise))}
.scn .sn{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.scn .sd{font-size:12.5px;color:var(--muted);margin-top:2px}
.scn .sx{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.race-note{font-size:12.5px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.race-err{color:var(--red);font-size:13px;margin-top:10px}
.lobby-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.lobby-p{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-size:14px}
.pdot{width:11px;height:11px;border-radius:50%;flex:none}
.lobby-p .pst{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.lobby-p .pst.ready{color:var(--green)}
.rcode{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:.18em;color:var(--amber)}
.count-big{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:1;color:var(--amber);text-align:center;padding:18px 0}
.rb-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rb-row:last-child{border-bottom:0}
.rb-row .rbrank{width:20px;font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center;flex:none}
.rb-row.win .rbrank{color:var(--amber)}
.rb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-name .you{color:var(--amber);font-size:11px;margin-left:5px}
.rb-prog{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.rb-bar{width:72px;height:7px;border-radius:4px;background:var(--led-off);overflow:hidden}
.rb-bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.rb-time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:52px;text-align:right}
.rb-row.done .rb-time{color:var(--green)}
.rb-row.win .rb-time{color:var(--amber);font-weight:600}
.race-winner{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--amber);text-align:center;margin:4px 0 14px}
@media (max-width:860px){.count-big{font-size:56px}}

/* Avatar picker */
.avatar-btn{font-size:18px;padding:4px 8px;min-width:36px}
.avatar-picker{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:none;flex-wrap:wrap;gap:6px;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.avatar-picker.open{display:flex}
.avatar-opt{font-size:22px;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--raise);cursor:pointer}
.avatar-opt:hover,.avatar-opt.sel{border-color:var(--amber)}


/* Collapsible command chips */
.chips-toggle{font-size:12px;margin-left:8px}
.chips.collapsed .chip:nth-child(n+9){display:none}

/* Collapsible rack — all screen sizes */
.rack-toggle{font-size:12px;margin-left:8px}
.leds.collapsed .grp{display:none}
.leds.collapsed .grp.current{display:flex}
.leds.expanded{max-height:50vh;overflow:auto}

/* ---- Appearance themes ---- */
:root[data-theme="amber"]{
  --bg:#120d02;--panel:#1a1304;--raise:#221903;--line:#3a2c0a;--ink:#f5d79a;--muted:#b08f4e;
  --term:#0b0800;--term-bar:#0f0b01;--term-ink:#ffcf7a;
  --amber:#ffb224;--on-amber:#1d1508;--blue:#ffd27a;--green:#ffc24d;--red:#ff7a3c;--violet:#ffe0ad;--led-off:#2a2008;color-scheme:dark;
}
:root[data-theme="green"]{
  --bg:#02100a;--panel:#04160e;--raise:#061d13;--line:#0c3a24;--ink:#8af0b0;--muted:#4e9e73;
  --term:#010b06;--term-bar:#020f09;--term-ink:#7affa8;
  --amber:#7dff9e;--on-amber:#06150c;--blue:#6fe0a0;--green:#7dff9e;--red:#ff8a6a;--violet:#a7ffc4;--led-off:#0c2a1b;color-scheme:dark;
}
:root[data-theme="nord"]{
  --bg:#2e3440;--panel:#333b4a;--raise:#3b4252;--line:#444c5e;--ink:#eceff4;--muted:#9aa5b8;
  --term:#242933;--term-bar:#2b313d;--term-ink:#d8dee9;
  --amber:#ebcb8b;--on-amber:#2e3440;--blue:#88c0d0;--green:#a3be8c;--red:#bf616a;--violet:#b48ead;--led-off:#3b4252;color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#eef1f5;--panel:#ffffff;--raise:#f3f5f8;--line:#d3d9e2;--ink:#1c2430;--muted:#5c6676;
  --term:#0f141c;--term-bar:#0d121a;--term-ink:#d5dce7;
  --amber:#c47f12;--on-amber:#ffffff;--blue:#2f6fd0;--green:#1f9d57;--red:#d2452e;--violet:#8b55c9;--led-off:#cfd6e0;color-scheme:light;
}
/* ---- Settings: theme swatch rows + avatar grid ---- */
.tm-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);cursor:pointer;font-size:13.5px;text-align:left}
.tm-row:hover{border-color:var(--muted)}
.tm-row.sel{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--raise))}
.tm-sw{width:30px;height:20px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.tm-sw i{position:absolute;right:4px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%}
.tm-check{margin-left:auto;color:var(--amber)}
.set-avgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cx-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);margin-bottom:6px;font-size:13.5px}
.cx-dim{color:var(--muted);font-size:12.5px}
.cx-badge{display:inline-block;font-size:10px;letter-spacing:.08em;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);vertical-align:middle;margin-left:4px}
.cx-code{font-family:var(--mono,monospace);letter-spacing:.14em;font-weight:700;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--raise));border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
.cx-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cx-form input{flex:1 1 150px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">The Last Sysadmin</div>
        <div class="sub">Learn Linux administration by fixing a broken server · Chapters 1–35</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">XP</span><span class="v" id="xp">0</span></div>
      <div class="stat"><span class="k">Rank</span><span class="v" id="rank">Intern</span></div>
      <div class="stat" id="clockStat" hidden><span class="k">Task time</span><span class="v live" id="clock">0:00</span></div>
      <button class="btn" id="btnTimer" type="button" title="Time each ticket and keep a performance log">Speed tracker</button>
      <button class="btn" id="btnRace" type="button" title="Race another player through an incident scenario">⚑ Race</button>
      <button class="btn" id="btnSettings" type="button" title="Themes, avatar, and account">⚙ Settings</button>
      <button class="btn" id="btnNew" type="button">New game</button>
    </div>
  </header>


  <main class="stage">
    <aside class="panel" id="panel" aria-label="Mission briefing">
      <div id="brief">
        <div class="eyebrow" id="pChapter"></div>
        <div class="ticket" id="pTicket"></div>
        <h1 id="pTitle"></h1>
      </div>
      <p class="story" id="pStory"></p>
      <div class="objective">
        <div class="label">Objective</div>
        <p id="pObj"></p>
      </div>
      <div class="hints">
        <div class="label">Hints <span id="hintCount"></span></div>
        <ol id="pHints"></ol>
        <div class="row">
          <button class="btn" id="btnHint" type="button">Show hint · −25 XP</button>
          <button class="btn" id="btnRetry" type="button">Restore checkpoint</button>
        </div>
      </div>
      <div class="finale" id="finale" hidden></div>
      <div>
        <div class="label">Rack status <span id="doneCount"></span><button class="btn rack-toggle" id="btnRackToggle" type="button" aria-expanded="false">Show all</button></div>
        <div class="leds" id="leds"></div>
      </div>
      <div id="speed" hidden>
        <div class="label">Speed tracker <span id="spdCount"></span></div>
        <div id="speedBody"></div>
      </div>
      <div id="raceBoard" hidden>
        <div class="label">Race · live standings <span id="rbMeta"></span></div>
        <div id="rbBody"></div>
        <button class="btn" id="btnRaceExit" type="button" style="margin-top:10px">Leave race</button>
      </div>
      <div>
        <div class="label">Commands you've used <span>tap one to read its manual</span><button class="btn chips-toggle" id="btnChipsToggle" type="button" aria-expanded="false">Show all</button></div>
        <div class="chips" id="chips"></div>
      </div>
    </aside>

function renderMan(n) {
  const [d, syn, op, ex, note] = MAN[n];
  const H = `${n.toUpperCase()}(1)`;
  let s = `${H}${' '.repeat(Math.max(2, 44 - H.length * 2))}${H}\n\nNAME\n       ${n} - ${d}\n\nSYNOPSIS\n       ${syn}\n`;
  if (op.length) { const w = Math.max(...op.map(o => o[0].length)) + 3; s += '\nOPTIONS\n' + op.map(o => `       ${o[0].padEnd(w)}${o[1]}`).join('\n') + '\n'; }
  if (ex.length) s += '\nEXAMPLES\n' + ex.map(e => '       ' + e).join('\n') + '\n';
  if (note) s += '\nNOTE\n       ' + note + '\n';
  return s;
}

    check: () => S.readM.includes(P.draft) },

  { ch: 3, id: 'shells', title: 'Who can log in?',
    story: "Priya read your evidence and went pale. \"Before I call legal, tell me who can actually log in to this box.\" Every account is one line in /etc/passwd, and the last field is its login shell. `/usr/sbin/nologin` means no interactive login.",
    objective: 'How many accounts in /etc/passwd have /bin/bash as their shell? Answer with `submit NUMBER`.',
    hints: ['Each line of /etc/passwd is `name:x:uid:gid:description:home:shell`. Start with `cat /etc/passwd`.', '`grep -c` counts matching lines. In a pattern, `$` means end of line, so `bash$` only matches bash at the very end.', `Run \`grep -c '/bin/bash$' /etc/passwd\`, then \`submit ${BASH_COUNT}\`.`],
    answer: a => a.trim() === String(BASH_COUNT) },
  { ch: 3, id: 'private', title: 'Lock your evidence',
    story: "One of those accounts is jmorrow, the contractor who left in July. And your `~/incident` folder can be read by every account on the box. Permissions can be written as numbers: r=4, w=2, x=1, added up for the owner, the group and everyone else. So 7 is rwx, 5 is r-x and 0 is nothing.",
    objective: 'Make `~/incident` private: full access (rwx) for you, nothing for the group or anyone else.',
    hints: ['`ls -ld ~/incident` shows the folder\'s own permissions. `drwxr-xr-x` is 755.', 'You want rwx (4+2+1 = 7) for yourself, then 0 for the group and 0 for others. `chmod` sets permissions.', 'Run `chmod 700 ~/incident`.'],
    check: () => { const n = getNode(HOME + '/incident'); return !!n && (n.mode & 0o777) === 0o700; },
    nudge: () => { const n = getNode(HOME + '/incident'); return n && (n.mode & 0o400) && !(n.mode & 0o100) ? 'Careful: without x, nobody can enter a folder, not even its owner. Folders need x. Try 700.' : null; } },
  { ch: 3, id: 'auth', title: 'Follow the logins',
    onStart: () => { S.sudo = true; editEtc('/etc/group', x => x[0] === 'sudo' && !(x[3] || '').split(',').includes(USER) ? [x[0], x[1], x[2], [...(x[3] || '').split(',').filter(Boolean), USER].join(',')].join(':') : null); },
    story: "Priya adds you to the sudo group. \"Every sudo command is written to /var/log/auth.log,\" she says. \"Yours included.\" That log can only be read by root, and so can a lot of what you need now.",
    objective: 'Use sudo to read `/var/log/auth.log`. From which IP address did jmorrow last log in? Answer with `submit IP`.',
    hints: ['Try `cat /var/log/auth.log` first and read the error. Then put `sudo` in front of the same command.', 'The log is long and full of failed login attempts from bots. Filter it: `grep jmorrow`, and look for lines that say Accepted.', "Run `sudo grep 'Accepted.*jmorrow' /var/log/auth.log`. The last line is the most recent login."],
    answer: a => a.trim() === '198.51.100.200' },
  { ch: 3, id: 'removed', title: "Who took Dana's access?",
    story: "Dana wrote that her sudo access vanished on the 21st. If someone removed it with sudo, sudo wrote it down.",
    objective: 'Find the moment Dana was removed from the sudo group. Answer with `submit HH:MM:SS`.',
    hints: ['sudo logs a line containing `COMMAND=` for every command it runs.', 'Search auth.log for lines that mention dana: `sudo grep dana /var/log/auth.log`. Which command touches the sudo group?', 'The line with `COMMAND=/usr/bin/gpasswd -d dana sudo` was logged at 22:16:40. Run `submit 22:16:40`.'],
    answer: a => a.includes('22:16:40') },
  { ch: 3, id: 'defuse', title: 'Defuse the script',
    story: "It was jmorrow, the night after Dana raised the alarm. Their script can still be run by anyone. In `ls -l` output, each x means someone may execute the file: first for the owner, then the group, then everyone else.",
    objective: 'Remove execute permission for everyone from `~/incident/quarantine/sync_out.sh`.',
    hints: ['`ls -l ~/incident/quarantine` shows `-rwxr-xr-x`. Three x\'s: owner, group, others.', '`chmod a-x FILE` removes execute for all. But you don\'t own this file (jmorrow does), and only the owner or root can change permissions.', 'Run `sudo chmod a-x ~/incident/quarantine/sync_out.sh`, then check with `ls -l`.'],
    check: () => { const f = findSync(); return !!f && (f.node.mode & 0o111) === 0; },
    fail: () => !findSync() ? 'The script is gone, and it was evidence. Type `retry` to restore it.' : null },
  { ch: 3, id: 'ownership', title: 'Take ownership',
    story: 'As long as jmorrow owns the script, jmorrow can switch execute back on. Give it to root.',
    objective: 'Make root both the owner and the group of `~/incident/quarantine/sync_out.sh`.',
    hints: ['`chown USER:GROUP FILE` changes the owner and group in one go.', 'Only root can give a file to another user, so you need sudo again. The user and the group are both called root.', 'Run `sudo chown root:root ~/incident/quarantine/sync_out.sh`.'],
    check: () => { const f = findSync(); return !!f && f.node.owner === 'root' && f.node.group === 'root'; },
    fail: () => !findSync() ? 'The script is gone, and it was evidence. Type `retry` to restore it.' : null },
  { ch: 3, id: 'lockout', title: 'Close the account',
    story: "Last step. Don't delete jmorrow's account: legal may need its files. Take away what it can do instead.",
    objective: "Remove jmorrow from the sudo group, and change jmorrow's login shell to `/usr/sbin/nologin`.",
    hints: ['`groups jmorrow` lists its groups. `sudo gpasswd -d USER GROUP` removes a user from a group.', '`sudo usermod -s SHELL USER` changes a login shell. Check the result with `getent passwd jmorrow`.', 'Run `sudo gpasswd -d jmorrow sudo`, then `sudo usermod -s /usr/sbin/nologin jmorrow`.'],
    check: () => { const pw = pwEntries().find(x => x[0] === 'jmorrow'); const sg = grEntries().find(x => x[0] === 'sudo'); return !!pw && ['/usr/sbin/nologin', '/sbin/nologin', '/bin/false', '/usr/bin/false'].includes(pw[6]) && !!sg && !(sg[3] || '').split(',').includes('jmorrow'); },
    nudge: () => S.pwLocked ? "You locked jmorrow's password. Useful, but on many SSH setups a locked password doesn't stop a login with an SSH key, and jmorrow logs in with a key. Changing the shell is what blocks an interactive login." : null },

  { ch: 4, id: 'survey', title: 'Survey the machine',
    story: "The account is locked, but jmorrow's shell history mentioned `crontab`, and so did Dana's note. Before you hunt the schedule, see what is actually running right now. `ps` lists processes; `ps aux` lists every process on the box.",
    objective: 'Run `ps aux` to list all running processes.',
    hints: ['`ps` on its own shows only your own shell. Add `aux` to see everything.', 'Look down the %CPU column once the list appears. One process stands out.', 'Run `ps aux`.'],
    check: () => S.cmdsM.includes('ps') || S.cmdsM.includes('top') },
  { ch: 4, id: 'hog', title: 'The runaway process',
    story: "One process has been pinning a CPU core since the night of the crash: a leftover from the restart loop that never died. Find it. `top` sorts processes by CPU use, and so does reading the %CPU column in `ps aux`.",
    objective: 'Find the PID of the process using the most CPU, then answer with `submit PID`.',
    hints: ['In `ps aux`, the second column is the PID and the third is %CPU. One row is near 96%.', '`top` lists the busiest process first. Its PID is the first column.', 'The runaway is the `/bin/bash /srv/halcyon/export/sync_out.sh` line. Run `submit 2447`.'],
    answer: a => a.trim() === '2447' },
  { ch: 4, id: 'kill', title: 'Stop the runaway',
    story: "That process belongs to the halcyon service account, not to you, so you cannot signal it directly. With sudo you can. `kill` sends a process the TERM signal, which asks it to shut down.",
    objective: 'Stop process 2447.',
    hints: ['Plain `kill 2447` fails with "Operation not permitted", because you do not own it.', 'Put `sudo` in front. Then confirm it is gone with `ps aux`.', 'Run `sudo kill 2447`.'],
    check: () => !S.procs.find(x => x.pid === 2447) },
  { ch: 4, id: 'enable', title: 'Make it survive a reboot',
    story: "Priya restarted the app by hand this morning, so it is running now. But if this box reboots, will it come back on its own? A service can be *active* (running now) and still not be *enabled* (set to start at boot).",
    objective: 'Check whether the `halcyon` service is enabled, then enable it so it starts on boot.',
    hints: ['`systemctl status halcyon` shows both; `systemctl is-enabled halcyon` answers in one word.', '`systemctl enable` sets a service to start at boot, and it needs root.', 'Run `sudo systemctl enable halcyon`.'],
    check: () => !!S.services.halcyon && S.services.halcyon.enabled === true },
  { ch: 4, id: 'schedule', title: 'Find the schedule',
    story: "Now the thread from jmorrow's history. cron runs commands on a timer for a given user, one per line: five time fields, then the command. jmorrow checked the halcyon user's crontab; so should you.",
    objective: "Read the halcyon user's crontab. Which script does the scheduled job run? Answer with `submit PATH`.",
    hints: ['`crontab -l` shows *your* crontab. To read another user’s you need `-u NAME`, and root.', 'Run `sudo crontab -l -u halcyon`. The fields `0 * * * *` mean "minute 0 of every hour".', 'The job runs `/bin/bash /srv/halcyon/export/sync_out.sh`. Submit the script path.'],
    answer: a => /sync_out\.sh$/.test(a.trim()) },
  { ch: 4, id: 'unschedule', title: 'Remove the schedule',
    story: "There it is: every hour, cron runs the export script as the halcyon user. Defusing the file was not enough while this line keeps trying to run it. Remove it.",
    objective: "Delete the halcyon user's crontab.",
    hints: ['`crontab -r` removes a crontab. With `-u NAME`, and root, it removes that user’s.', 'There is only the one job, so removing the whole crontab is fine here.', 'Run `sudo crontab -r -u halcyon`, then check with `sudo crontab -l -u halcyon`.'],
    check: () => !S.crontabs.halcyon },

  { ch: 5, id: 'listening', title: 'What ports are open?',
    story: "The schedule is dead, but one loose end remains: that IP address. Networking first. See what this server is listening for. `ss` lists sockets: `-t` for TCP, `-l` for listening, `-n` for numeric ports, `-p` for the owning process (that one needs root).",
    objective: 'List the listening TCP ports. Which port is the halcyon app listening on? Answer with `submit PORT`.',
    hints: ['`ss -tln` lists listening TCP sockets with numeric ports.', 'Add `-p` with sudo to see which process owns each port: `sudo ss -tlnp`.', 'The halcyon-worker line listens on 0.0.0.0:8080. Run `submit 8080`.'],
    answer: a => a.trim() === '8080' },
  { ch: 5, id: 'connected', title: 'Who is connected now?',
    story: "Listening ports are open doors. Now look at who is actually through one. Without `-l`, `ss` shows established connections: your own SSH session, the app's link to the database, and anything else.",
    objective: 'Look at the established connections. Which outside IP is still connected to the app? Answer with `submit IP`.',
    hints: ['`ss -tn` shows established TCP connections: the local address, then the peer address.', 'Your SSH comes from 10.0.4.57; the database is 10.0.4.20. One peer is neither.', 'The peer connected to :8080 is 203.0.113.77. Submit it.'],
    answer: a => a.trim() === BAD_IP },
  { ch: 5, id: 'alive', title: 'Is the app healthy?',
    onStart: () => { S.curledLocal = false; },
    story: "Before you touch any firewall rules, make sure the app itself still answers. `curl` makes a web request from the command line; `-I` asks for only the response headers.",
    objective: 'Use `curl` to request `http://localhost:8080` and confirm it answers.',
    hints: ['`curl http://localhost:8080` fetches the page; `curl -I http://localhost:8080` shows just the status line and headers.', 'A healthy app returns `HTTP/1.1 200 OK`.', 'Run `curl -I http://localhost:8080`.'],
    check: () => !!S.curledLocal },
  { ch: 5, id: 'address', title: "The server's own address",
    story: "To write a firewall rule you need to know your own network. `ip addr` shows every interface and its IP. eth0 is the one that faces the network; lo is the internal loopback.",
    objective: "What is this server's IPv4 address on eth0? Answer with `submit IP`.",
    hints: ['`ip a` (short for `ip addr`) lists the interfaces. Each `inet` line is an IPv4 address.', 'Ignore `lo` (127.0.0.1, the loopback). Look at `eth0`.', 'eth0 has `inet 10.0.4.12/24`. Submit 10.0.4.12.'],
    answer: a => a.trim() === '10.0.4.12' },
  { ch: 5, id: 'block', title: 'Block the intruder',
    story: "Now shut the door on 203.0.113.77. `ufw`, the uncomplicated firewall, manages the rules. A `deny from` rule drops every packet from an address.",
    objective: 'Add a firewall rule that denies all traffic from ' + BAD_IP + '.',
    hints: ['`ufw deny from IP` blocks an address, and changing firewall rules needs root.', 'The address is ' + BAD_IP + '.', 'Run `sudo ufw deny from ' + BAD_IP + '`.'],
    check: () => S.firewall.rules.some(r => r.action === 'deny' && r.from === BAD_IP) },
  { ch: 5, id: 'enable-fw', title: 'Turn the firewall on',
    story: "A rule does nothing until the firewall is running. Turn it on, then confirm both the status and your new rule.",
    objective: 'Enable the firewall, then check its status.',
    hints: ['`ufw status` says `inactive` until you enable it.', '`sudo ufw enable` turns it on. Then `sudo ufw status` should say active and list your deny rule.', 'Run `sudo ufw enable`, then `sudo ufw status`.'],
    check: () => S.firewall.active && S.firewall.rules.some(r => r.action === 'deny' && r.from === BAD_IP) },

  { ch: 6, id: 'disks', title: 'The new disk',
    story: "The crash in Chapter 2 started with a full root disk. Priya has had a second disk attached so backups and logs have somewhere to live. First, see what block devices this machine has. `lsblk` lists the disks and their partitions.",
    objective: 'Run `lsblk`. Which partition on the new disk has no mountpoint yet? Answer with `submit NAME`.',
    hints: ['`lsblk` shows disks (TYPE disk) with their partitions (TYPE part) indented underneath.', 'vda is the original disk (its partitions are mounted at / and /boot). vdb is the new one.', 'vdb has one partition, vdb1, with an empty MOUNTPOINTS column. Run `submit vdb1`.'],
    answer: a => a.trim().replace('/dev/', '') === 'vdb1' },
  { ch: 6, id: 'mountpoint', title: 'Make a mountpoint',
    story: "A disk is attached to the machine, but you reach it through a directory called a mountpoint. By convention, extra storage lives under /mnt. Create the directory first; you can only mount onto a directory that exists.",
    objective: 'Create the directory `/mnt/backups`.',
    hints: ['/mnt is owned by root, so you cannot write there as yourself. Use sudo.', '`mkdir -p` creates parent directories as needed and does not complain if it already exists.', 'Run `sudo mkdir -p /mnt/backups`.'],
    check: () => { const n = getNode('/mnt/backups'); return !!n && n.type === 'dir'; } },
  { ch: 6, id: 'mount', title: 'Mount the disk',
    story: "Now attach the partition to the mountpoint. After this, anything written under /mnt/backups lands on the new disk instead of the root disk.",
    objective: 'Mount `/dev/vdb1` at `/mnt/backups`.',
    hints: ['The command is `mount DEVICE DIRECTORY`, and mounting needs root.', 'The device is /dev/vdb1; the directory is /mnt/backups.', 'Run `sudo mount /dev/vdb1 /mnt/backups`, then check with `df -h` or `findmnt`.'],
    check: () => S.mounts.some(m => m.mp === '/mnt/backups') },
  { ch: 6, id: 'fstab', title: 'Make it survive a reboot',
    story: "A plain `mount` is forgotten the moment the box reboots. To make it permanent, add a line to /etc/fstab, the table the system reads at boot to mount filesystems. Because `>` redirection is done by your shell and not by sudo, the way to append to a root-owned file is `... | sudo tee -a`.",
    objective: 'Add a line to `/etc/fstab` so `/dev/vdb1` mounts at `/mnt/backups` at boot (type ext4).',
    hints: ['A fstab line is: device  mountpoint  type  options  dump  pass. For example: `/dev/vdb1 /mnt/backups ext4 defaults 0 2`.', '`sudo echo ... >> /etc/fstab` fails, because your shell opens the file as you, not root. Pipe into `sudo tee -a` instead.', "Run: `echo '/dev/vdb1  /mnt/backups  ext4  defaults  0  2' | sudo tee -a /etc/fstab`."],
    check: () => { const c = getNode('/etc/fstab') && getNode('/etc/fstab').content || ''; return /vdb1/.test(c) && /\/mnt\/backups/.test(c); } },
  { ch: 6, id: 'mountall', title: 'Prove it works',
    onStart: () => { const i = S.mounts.findIndex(m => m.mp === '/mnt/backups'); if (i >= 0) { const part = allParts().find(x => '/dev/' + x.name === S.mounts[i].dev); if (part) part.mp = ''; S.mounts.splice(i, 1); } S.mountedAll = false; },
    story: "The real test of an fstab entry is a reboot. You can simulate that: the disk has just been unmounted. `mount -a` reads /etc/fstab and mounts everything in it that is not already mounted, which is exactly what the system does at boot.",
    objective: 'The backups disk is unmounted. Remount everything from fstab with a single command.',
    hints: ['`findmnt /mnt/backups` now returns nothing: it is unmounted.', '`mount -a` mounts everything listed in /etc/fstab. It needs root.', 'Run `sudo mount -a`, then confirm with `df -h`.'],
    check: () => S.mounts.some(m => m.mp === '/mnt/backups') },

  { ch: 7, id: 'backup', title: 'Back up the config',
    story: "With somewhere safe to put it, make your first backup: the live release's config. `tar` bundles many files into one archive; add `-z` and it is gzip-compressed. The letters are `c` create, `z` gzip, `f` file.",
    objective: 'Create a gzip-compressed tar archive of `/srv/halcyon/releases/v2.3.1/config` at `/mnt/backups/halcyon-config.tar.gz`.',
    hints: ['The form is `tar -czf ARCHIVE PATHS`. The archive comes first, then what to put in it.', '/mnt/backups is owned by root, so write the archive there with sudo.', 'Run `sudo tar -czf /mnt/backups/halcyon-config.tar.gz /srv/halcyon/releases/v2.3.1/config`.'],
    check: () => { let ok = false; const b = getNode('/mnt/backups'); if (b && b.type === 'dir') for (const k in b.children) { const n = b.children[k]; if (n.archive && n.archive.entries.some(e => /app\.conf$/.test(e.path))) ok = true; } return ok; } },
  { ch: 7, id: 'list', title: 'Look inside the archive',
    story: "Never trust a backup you haven't looked at. `tar -tzf` lists what is inside an archive without extracting anything. `t` is for list (think 'table of contents').",
    objective: 'List the contents of `/mnt/backups/halcyon-config.tar.gz`.',
    hints: ['Swap the `c` (create) for `t` (list): `tar -tzf ARCHIVE`.', 'You are only reading the archive, so no sudo is needed.', 'Run `tar -tzf /mnt/backups/halcyon-config.tar.gz`.'],
    check: () => !!S.tarListed },
  { ch: 7, id: 'restore', title: 'Prove you can restore',
    story: "A backup you have never restored is just a hope. Extract this one into a scratch directory and confirm the files come back. `x` is extract; `-C` tells tar which directory to extract into.",
    objective: 'Make a directory `~/restore-test` and extract the archive into it.',
    hints: ['First `mkdir ~/restore-test`. Then extract with `tar -xzf ARCHIVE -C ~/restore-test`.', 'The archive is /mnt/backups/halcyon-config.tar.gz. You own ~/restore-test, so no sudo is needed to extract there.', 'Run `mkdir ~/restore-test`, then `tar -xzf /mnt/backups/halcyon-config.tar.gz -C ~/restore-test`, then `find ~/restore-test`.'],
    check: () => { let ok = false; const r = getNode(HOME + '/restore-test'); if (r && r.type === 'dir') walkAll(HOME + '/restore-test', r, (pp, nn) => { if (nn.type === 'file' && /app\.conf$/.test(pp)) ok = true; }); return ok; } },
  { ch: 7, id: 'gzip', title: 'Compress an old log',
    story: "Old logs are worth keeping but take up space uncompressed. `gzip` squeezes a file in place: `app.log` becomes `app.log.gz`. `gunzip` (or `gzip -d`) puts it back.",
    objective: 'Compress your saved copy of the log at `~/incident/logs/app.log`.',
    hints: ['`gzip FILE` replaces the file with a smaller `FILE.gz`.', 'The file is the copy you made in Chapter 2: ~/incident/logs/app.log.', 'Run `gzip ~/incident/logs/app.log`, then `ls -lh ~/incident/logs`.'],
    check: () => { const n = getNode(HOME + '/incident/logs/app.log.gz'); return !!n && n.type === 'file'; } },
  { ch: 7, id: 'schedule-backup', title: 'Automate it',
    story: "A backup you have to remember to run will not get run. Schedule it. You removed jmorrow's cron job in Chapter 5; now you write a good one, for root, that backs up the config every night at 02:00.",
    objective: "Install a root crontab with a nightly (02:00) job that runs the same tar backup command.",
    hints: ['You can pipe a line into crontab to install it: `echo \'LINE\' | sudo crontab -u root -`. The trailing `-` means "read from standard input".', 'A 2am line starts with `0 2 * * *` followed by the command.', "Run: `echo '0 2 * * * tar -czf /mnt/backups/halcyon-config.tar.gz /srv/halcyon/releases/v2.3.1/config' | sudo crontab -u root -`, then `sudo crontab -l -u root`."],
    check: () => { const c = S.crontabs.root || ''; return /tar/.test(c) && /backups/.test(c); } },

  { ch: 8, id: 'apt-update', title: 'Refresh the package list',
    story: "The auth log is full of brute-force SSH attempts from bots. There is a standard tool that bans an address after repeated failures: fail2ban. To install it, first refresh the list of available packages so you get the current version.",
    objective: 'Update the package index with apt.',
    hints: ['The command is `apt update` (or `apt-get update`). It needs root.', 'It talks to the package servers, so it has to run as root.', 'Run `sudo apt update`.'],
    check: () => !!S.aptUpdated },
  { ch: 8, id: 'apt-search', title: 'Find the tool',
    story: "Before installing something, find its exact package name. `apt search` looks through the package names and descriptions.",
    objective: 'Search the packages for `fail2ban`.',
    hints: ['`apt search TERM` (or `apt-cache search TERM`) searches names and descriptions.', 'Searching does not change anything, so no sudo is needed.', 'Run `apt search fail2ban`.'],
    check: () => !!S.aptSearched },
  { ch: 8, id: 'apt-install', title: 'Install fail2ban',
    story: "That is the one: 'Ban hosts that cause multiple authentication errors'. Install it.",
    objective: 'Install the `fail2ban` package.',
    hints: ['`apt install PACKAGE` installs software, and it needs root.', 'Add `-y` to skip the confirmation prompt: `sudo apt install -y fail2ban`.', 'Run `sudo apt install -y fail2ban`.'],
    check: () => !!S.packages.installed.fail2ban },
  { ch: 8, id: 'f2b-enable', title: 'Start it, and keep it started',
    story: "Installing a service does not always start it, and does not always set it to run at boot. Do both, the way you enabled halcyon in Chapter 5: `enable --now` enables it *and* starts it in one step.",
    objective: 'Enable and start the `fail2ban` service so it runs now and on every boot.',
    hints: ['`systemctl enable --now SERVICE` enables and starts it together (needs root).', 'Check afterwards with `systemctl status fail2ban`.', 'Run `sudo systemctl enable --now fail2ban`.'],
    check: () => !!S.services.fail2ban && S.services.fail2ban.active && S.services.fail2ban.enabled },
  { ch: 8, id: 'f2b-verify', title: 'Confirm the version',
    story: "For the change record, note exactly which version you installed. `dpkg -l` reports what is installed and at which version, which is a different question from what apt can install.",
    objective: 'Find the installed version of `fail2ban`. Answer with `submit VERSION`.',
    hints: ['`dpkg -l PACKAGE` shows a line beginning `ii` with the package and its version.', 'Run `dpkg -l fail2ban` and read the Version column.', 'The version is 1.0.2-3. Run `submit 1.0.2-3`.'],
    answer: a => a.trim() === '1.0.2-3' },

  { ch: 9, id: 'audit', title: 'Audit the open ports',
    story: "Final chapter: lock the doors and write it all down. Start with a clean look at what is listening. Anything open is a way in, so you want to know every one.",
    objective: 'List the listening TCP ports with their processes. How many TCP ports is the server listening on? Answer with `submit NUMBER`.',
    hints: ['`sudo ss -tlnp` lists listening TCP sockets with the owning process.', 'Count the LISTEN lines (ignore the header).', 'There are three: 22 (ssh), 8080 (halcyon) and 5432 (postgres, loopback only). Run `submit 3`.'],
    answer: a => a.trim() === '3' },
  { ch: 9, id: 'ssh-root', title: 'No root login over SSH',
    story: "SSH is the main door. Two settings in /etc/ssh/sshd_config harden it. First: never allow a direct root login, so an attacker can't target the one account that can do anything. The setting is `PermitRootLogin`.",
    objective: 'Set `PermitRootLogin no` in `/etc/ssh/sshd_config`.',
    hints: ['The file has a commented line `#PermitRootLogin prohibit-password`. You need an active line reading `PermitRootLogin no`.', 'The file is owned by root, so edit it with sudo. `sed -i` edits a file in place.', "Run: `sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config`, then `grep PermitRootLogin /etc/ssh/sshd_config`."],
    check: () => /^PermitRootLogin\s+no\b/m.test((getNode('/etc/ssh/sshd_config') || {}).content || '') },
  { ch: 9, id: 'ssh-pw', title: 'Keys only, no passwords',
    story: "Second: turn off password logins entirely, so only holders of an authorised key can get in. Passwords can be guessed; keys effectively cannot. The setting is `PasswordAuthentication`.",
    objective: 'Set `PasswordAuthentication no` in `/etc/ssh/sshd_config`.',
    hints: ['The file has `#PasswordAuthentication yes`. You want an active `PasswordAuthentication no`.', 'Edit with sudo, the same way as the last ticket.', "Run: `sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config`."],
    check: () => /^PasswordAuthentication\s+no\b/m.test((getNode('/etc/ssh/sshd_config') || {}).content || '') },
  { ch: 9, id: 'ssh-restart', title: 'Apply the changes',
    story: "Editing the config file changes nothing until sshd re-reads it. Restart the service to apply both settings. (Your own session stays up; sshd only applies the new rules to new connections.)",
    objective: 'Restart the `ssh` service.',
    hints: ['`systemctl restart ssh` reloads the service with its new config. It needs root.', 'Confirm it came back with `systemctl status ssh`.', 'Run `sudo systemctl restart ssh`.'],
    check: () => !!(S.restarted && S.restarted.ssh) && S.services.ssh.active },
  { ch: 9, id: 'handover', title: 'Leave a handover note',
    story: "Dana left a note for whoever came next: you. Close the loop. Write a short handover for the admin after you, saying what you changed, and save it in your incident folder.",
    objective: 'Write a few lines of notes to `~/incident/HANDOVER.md`.',
    hints: ['`>` sends text into a file. `echo \"line\" > file` starts it; `echo \"line\" >> file` adds more lines.', 'Anything reasonable counts, as long as the file has some content. For example: `echo \"# Handover\" > ~/incident/HANDOVER.md`.', 'Run `echo \"# Handover - incident closed, see notes/\" > ~/incident/HANDOVER.md`, then add more with `>>` if you like.'],
    check: () => { const n = getNode(HOME + '/incident/HANDOVER.md'); return !!n && n.type === 'file' && n.content.trim().length > 15; } },

  { ch: 10, id: 'first-script', title: 'Your first script',
    story: "You keep typing the same commands. A script is just a text file of commands with `#!/bin/bash` on the first line (the 'shebang', which says how to run it). Write one.",
    objective: 'Create `~/status.sh` whose first line is `#!/bin/bash` and which echoes a status line.',
    hints: ['`printf` writes exact text to a file. `\\n` is a newline. For example: `printf \'line one\\nline two\\n\' > file`.', 'You want two lines: `#!/bin/bash` then an `echo` line.', 'Run: `printf \'#!/bin/bash\\necho "halcyon-web01 status check"\\n\' > ~/status.sh`, then `cat ~/status.sh`.'],
    check: () => { const n = getNode(HOME + '/status.sh'); return !!n && n.type === 'file' && /^#!/.test(n.content) && /\becho\b/.test(n.content); } },
  { ch: 10, id: 'run-script', title: 'Make it executable',
    onStart: () => { S.lastScriptOut = ''; S.lastScriptRun = ''; },
    story: "A file is not a program until it is allowed to run. Give it execute permission, then run it as `./status.sh` (the `./` means 'in this directory').",
    objective: 'Make `~/status.sh` executable and run it.',
    hints: ['`chmod +x ~/status.sh` adds execute permission.', 'From your home directory, run it with `./status.sh`. Without the `./`, bash would not look in the current directory.', 'Run `chmod +x ~/status.sh`, then `cd ~` and `./status.sh`.'],
    check: () => { const n = getNode(HOME + '/status.sh'); return !!n && (n.mode & 0o111) !== 0 && (S.lastScriptRun || '').endsWith('/status.sh'); } },
  { ch: 10, id: 'vars', title: 'Script the backup',
    story: "Turn the backup into a proper script. Use variables so a path is written once, not repeated: set `DEST=...` and refer to it as `$DEST`. Then run it. Because it writes to /mnt/backups (owned by root), run it with sudo.",
    objective: 'Write `~/backup.sh` that uses variables and creates `/mnt/backups/nightly.tar.gz` from the live config, and run it.',
    hints: ['Build it with printf. The body: `DEST=/mnt/backups/nightly.tar.gz`, `SRC=/srv/halcyon/releases/v2.3.1/config`, then `tar -czf "$DEST" "$SRC"`.', 'Quote variables that hold paths: `tar -czf "$DEST" "$SRC"`.', 'Create it: `printf \'#!/bin/bash\\nDEST=/mnt/backups/nightly.tar.gz\\nSRC=/srv/halcyon/releases/v2.3.1/config\\ntar -czf "$DEST" "$SRC"\\necho "backed up to $DEST"\\n\' > ~/backup.sh`, then run `sudo bash ~/backup.sh`.'],
    check: () => { const n = getNode('/mnt/backups/nightly.tar.gz'); return !!n && !!n.archive && n.archive.entries.some(e => /app\.conf$/.test(e.path)); } },
  { ch: 10, id: 'loop', title: 'Loop over the releases',
    onStart: () => { S.lastScriptOut = ''; },
    story: "Scripts can repeat work with a loop. A `for` loop walks a list; a wildcard like `*` expands to the matching paths. Write one that prints every release directory.",
    objective: 'Write and run a script that loops over `/srv/halcyon/releases/*` and echoes each one.',
    hints: ['The shape is: `for d in /srv/halcyon/releases/*; do` then `echo "$d"` then `done`.', 'Build it with printf, using \\n between lines and two-space indents inside the loop if you like.', 'Create `~/releases.sh`: `printf \'#!/bin/bash\\nfor d in /srv/halcyon/releases/*; do\\n  echo "release: $d"\\ndone\\n\' > ~/releases.sh`, then `bash ~/releases.sh`.'],
    check: () => /v2\.2\.0/.test(S.lastScriptOut || '') && /v2\.3\.1/.test(S.lastScriptOut || '') },
  { ch: 10, id: 'guard', title: 'Add a safety check',
    onStart: () => { S.lastScriptOut = ''; },
    story: "A good script checks its assumptions. Add an `if` test so the backup refuses to run if its source directory is missing, and reports clearly. This is `if [ ... ]; then ... else ... fi`, the backbone of real scripts.",
    objective: 'Write a script that takes a directory as `$1`, and if it exists prints a line containing `target ok`, otherwise reports it is missing. Run it with a directory that exists.',
    hints: ['The test for a directory is `[ -d "$1" ]`. The structure: `if [ -d "$1" ]; then` ... `else` ... `fi`.', 'The success branch must print something containing the words `target ok`.', 'Create `~/check.sh`: `printf \'#!/bin/bash\\nif [ -d "$1" ]; then\\n  echo "target ok: $1"\\nelse\\n  echo "missing: $1"\\nfi\\n\' > ~/check.sh`, then run `bash ~/check.sh /srv/halcyon`.'],
    check: () => /target ok/.test(S.lastScriptOut || '') },

  { ch: 11, id: 'unit-service', title: 'Write a service unit',
    story: "cron is fine, but systemd is how modern Linux runs scheduled work, with logging and dependencies built in. A systemd job is two files. First the service: it says *what* to run. Unit files live in /etc/systemd/system.",
    objective: 'Create `/etc/systemd/system/halcyon-backup.service` with a `[Service]` section whose `ExecStart` runs `/home/rookie/backup.sh`.',
    hints: ['Write the file with printf piped into sudo tee (it is a root-owned directory): `printf \'...\' | sudo tee /etc/systemd/system/halcyon-backup.service`.', 'The content: a `[Unit]` line with Description, then `[Service]`, `Type=oneshot`, and `ExecStart=/home/rookie/backup.sh`.', 'Run: `printf \'[Unit]\\nDescription=Halcyon nightly backup\\n[Service]\\nType=oneshot\\nExecStart=/home/rookie/backup.sh\\n\' | sudo tee /etc/systemd/system/halcyon-backup.service`.'],
    check: () => { const n = getNode('/etc/systemd/system/halcyon-backup.service'); return !!n && n.type === 'file' && /ExecStart=.*backup\.sh/.test(n.content); } },
  { ch: 11, id: 'unit-timer', title: 'Write a timer unit',
    story: "Now the timer: it says *when* to run the service of the same name. `OnCalendar=daily` means once a day; `Persistent=true` catches up a run the machine missed while it was off.",
    objective: 'Create `/etc/systemd/system/halcyon-backup.timer` with a `[Timer]` section and `OnCalendar=daily`.',
    hints: ['Same technique: printf piped into `sudo tee /etc/systemd/system/halcyon-backup.timer`.', 'The content needs `[Timer]`, `OnCalendar=daily`, and `[Install]` with `WantedBy=timers.target` so it can be enabled.', 'Run: `printf \'[Unit]\\nDescription=Run halcyon backup daily\\n[Timer]\\nOnCalendar=daily\\nPersistent=true\\n[Install]\\nWantedBy=timers.target\\n\' | sudo tee /etc/systemd/system/halcyon-backup.timer`.'],
    check: () => { const n = getNode('/etc/systemd/system/halcyon-backup.timer'); return !!n && n.type === 'file' && /OnCalendar=/.test(n.content); } },
  { ch: 11, id: 'daemon-reload', title: 'Tell systemd to look',
    story: "systemd does not watch the directory; it caches units in memory. After adding or changing a unit file you must reload, or systemd will not know your new timer exists.",
    objective: 'Reload the systemd manager so it reads the new unit files.',
    hints: ['The command is `systemctl daemon-reload`, and it needs root.', 'Nothing prints on success. You will confirm it worked in the next step.', 'Run `sudo systemctl daemon-reload`.'],
    check: () => !!S.daemonReloaded && !!(S.units && S.units['halcyon-backup.timer']) },
  { ch: 11, id: 'timer-enable', title: 'Start the timer',
    story: "Enable and start the timer in one step, the same `enable --now` you used for fail2ban. Enabling makes it start at boot; starting makes it active right now. You check timers with `systemctl list-timers`.",
    objective: 'Enable and start `halcyon-backup.timer`, then confirm it appears in `systemctl list-timers`.',
    hints: ['`sudo systemctl enable --now halcyon-backup.timer` enables and starts it.', 'Then run `systemctl list-timers` to see it with its next run time.', 'Run `sudo systemctl enable --now halcyon-backup.timer`, then `systemctl list-timers`.'],
    check: () => { const u = S.units && S.units['halcyon-backup.timer']; return !!u && u.active && u.enabled; } },
  { ch: 11, id: 'drop-cron', title: 'Retire the old cron job',
    story: "The timer now owns the backup. Leaving the old root cron entry in place would run the backup twice a night. Remove it, so there is exactly one scheduler for this job.",
    objective: "Delete the root crontab you created back in Chapter 8.",
    hints: ['`sudo crontab -l -u root` shows the old job. `crontab -r` removes a crontab.', 'Remove it with `-u root` and root privileges.', 'Run `sudo crontab -r -u root`, then `sudo crontab -l -u root` to confirm it is gone.'],
    check: () => !S.crontabs.root },

  { ch: 12, id: 'status-codes', title: 'What are the servers saying?',
    story: "The app is live and serving traffic again. Every request is one line in /var/log/halcyon/access.log; the HTTP status code is the 9th field. A sudden rise in error codes is your early warning. Start by summarising them.",
    objective: 'Summarise the HTTP status codes in the access log. Which status code is the most common? Answer with `submit CODE`.',
    hints: ['`awk \'{print $9}\' FILE` prints the 9th field of each line: the status code.', 'Pipe it through `sort | uniq -c | sort -rn` to count each code, most frequent first.', 'Run `awk \'{print $9}\' /var/log/halcyon/access.log | sort | uniq -c | sort -rn`. The top one is 200.'],
    answer: a => a.trim() === '200' },
  { ch: 12, id: 'top-endpoint', title: 'The busiest endpoint',
    story: "You already know 203.0.113.77 was pulling /export/customers.csv. Set that aside and find the busiest *application* endpoint, the one real users hit most. The requested path is the 7th field.",
    objective: 'Ignoring /export/customers.csv, which path got the most requests? Answer with `submit PATH`.',
    hints: ['`awk \'{print $7}\' FILE | sort | uniq -c | sort -rn | head` ranks the paths.', 'The very top is the customers.csv leak you already handled. Look at the next line down.', 'Run the pipeline; the busiest real endpoint is /api/shipments.'],
    answer: a => a.trim() === '/api/shipments' },
  { ch: 12, id: 'unique-ips', title: 'How many visitors?',
    story: "Management wants a number: how many distinct clients hit the server. The IP is the first field; `sort -u` keeps one of each.",
    objective: 'Count the unique client IP addresses in the access log. Answer with `submit NUMBER`.',
    hints: ['`awk \'{print $1}\' FILE` prints the IP from each line.', '`sort -u` removes duplicates; `wc -l` counts what is left.', 'Run `awk \'{print $1}\' /var/log/halcyon/access.log | sort -u | wc -l`. It is 7.'],
    answer: a => a.trim() === '7' },
  { ch: 12, id: 'logrotate-cfg', title: 'Stop the logs eating the disk',
    story: "Logs grow forever unless something trims them, and a full disk is how this whole story began. logrotate handles that. A config file under /etc/logrotate.d names the logs and how many old copies to keep.",
    objective: 'Create `/etc/logrotate.d/halcyon` that rotates `/var/log/halcyon/*.log`, keeping 7 old copies.',
    hints: ['The file is a block: a log path, then `{`, some options, then `}`. Write it with printf piped into `sudo tee`.', 'Inside the braces: `daily`, `rotate 7`, `missingok`, `notifempty`.', "Run: `printf '/var/log/halcyon/*.log {\\n    daily\\n    rotate 7\\n    missingok\\n    notifempty\\n}\\n' | sudo tee /etc/logrotate.d/halcyon`."],
    check: () => { const n = getNode('/etc/logrotate.d/halcyon'); return !!n && n.type === 'file' && /\/var\/log\/halcyon/.test(n.content) && /rotate\s+\d+/.test(n.content); } },
  { ch: 12, id: 'logrotate-run', title: 'Rotate them now',
    story: "logrotate normally runs daily on its own. Force a rotation now to prove the config works: the current app.log becomes app.log.1 and a fresh, empty app.log takes its place.",
    objective: 'Force a rotation using your config, then confirm `app.log.1` appears.',
    hints: ['`logrotate -f CONFIG` forces a rotation. It touches root-owned logs, so use sudo.', 'After it runs, `ls /var/log/halcyon` should show app.log.1 (and access.log.1).', 'Run `sudo logrotate -f /etc/logrotate.d/halcyon`, then `ls -l /var/log/halcyon`.'],
    check: () => !!getNode('/var/log/halcyon/app.log.1') || !!getNode('/var/log/halcyon/app.log.1.gz') },

  { ch: 13, id: 'images', title: 'The new release is an image',
    story: "Version 2.4.0 does not ship as files to copy onto the server; it ships as a container image, a sealed box with the app and everything it needs. See what images are on this host.",
    objective: 'List the local container images. What tag is the halcyon/web image? Answer with `submit TAG`.',
    hints: ['`docker images` lists images with their REPOSITORY and TAG columns.', 'Look at the row for halcyon/web.', 'Run `docker images`. The tag is 2.4.0.'],
    answer: a => a.trim() === '2.4.0' },
  { ch: 13, id: 'run', title: 'Start the container',
    story: "Run the image. `-d` runs it in the background (detached), `--name` gives it a friendly name, and `-p 8080:8080` publishes the container's port 8080 on the host's port 8080.",
    objective: 'Run `halcyon/web:2.4.0` detached, named `halcyon-web`, publishing port 8080 to 8080.',
    hints: ['The form is `docker run -d --name NAME -p HOST:CONTAINER IMAGE`.', 'Name it halcyon-web and publish 8080:8080.', 'Run `docker run -d --name halcyon-web -p 8080:8080 halcyon/web:2.4.0`, then `docker ps`.'],
    check: () => S.containers.some(c => c.name === 'halcyon-web' && c.status === 'running') },
  { ch: 13, id: 'ps', title: 'Check what is running',
    story: "`docker ps` lists running containers: their image, status, published ports and names. Confirm your new container is up and note which host port it answers on.",
    objective: 'List the running containers. Which host port does `halcyon-web` publish? Answer with `submit PORT`.',
    hints: ['`docker ps` shows a PORTS column like `0.0.0.0:8080->8080/tcp`.', 'The number before the arrow is the host port.', 'Run `docker ps`. The halcyon-web container publishes 8080.'],
    answer: a => a.trim() === '8080' },
  { ch: 13, id: 'logs', title: 'Read its logs',
    story: "A container writes its output to the docker log, not to /var/log. When something looks wrong, `docker logs` is the first place to look.",
    objective: 'Show the logs of the `halcyon-web` container.',
    hints: ['`docker logs NAME` prints what the container has written.', 'The name is halcyon-web.', 'Run `docker logs halcyon-web`.'],
    check: () => !!S.dockerLogged },
  { ch: 13, id: 'cleanup', title: 'Retire the old container',
    story: "An older container, `halcyon-web-old`, is still running from a previous deploy, holding port 8081. Clean it up: you cannot remove a running container, so stop it first, then remove it.",
    objective: 'Stop and remove the `halcyon-web-old` container.',
    hints: ['`docker stop NAME` stops it; `docker rm NAME` removes it. `docker rm` refuses while it is still running.', 'You can chain them: `docker stop halcyon-web-old && docker rm halcyon-web-old`.', 'Run `docker stop halcyon-web-old`, then `docker rm halcyon-web-old`, and confirm with `docker ps -a`.'],
    check: () => !S.containers.some(c => c.name === 'halcyon-web-old') },

  { ch: 14, id: 'git-status', title: 'What changed?',
    story: "The deploy is driven from a git repository in ~/halcyon-app, where the config change for 2.4.0 was made. Before committing anything, see the state of the working tree. First move into the repository.",
    objective: 'Go to `~/halcyon-app` and check the repository status. What branch are you on? Answer with `submit BRANCH`.',
    hints: ['`cd ~/halcyon-app` first, then `git status`.', 'The first line of `git status` names the branch.', 'Run `cd ~/halcyon-app`, then `git status`. The branch is main.'],
    answer: a => a.trim() === 'main' },
  { ch: 14, id: 'git-log', title: 'The history',
    story: "Every commit is a saved snapshot with a message. `git log` shows them newest first; `--oneline` condenses each to a single line.",
    objective: 'Show the commit history in one-line form. How many commits are there? Answer with `submit NUMBER`.',
    hints: ['`git log --oneline` prints one line per commit.', 'Count the lines.', 'Run `git log --oneline`. There are 3 commits.'],
    answer: a => a.trim() === '3' },
  { ch: 14, id: 'git-diff', title: 'Review the change',
    story: "One file has an uncommitted change: the worker count was raised for peak season. Always read a diff before you commit it. `git diff` shows exactly what changed, line by line.",
    objective: 'Show the unstaged changes in the repository.',
    hints: ['`git diff` shows changes you have not staged yet.', 'Lines starting with `-` were removed; `+` were added.', 'Run `git diff`.'],
    check: () => !!S.gitDiffed },
  { ch: 14, id: 'git-commit', title: 'Commit the change',
    story: "The change looks right. Record it: stage everything with `git add -A`, then commit it with a clear message. That message is what the next person reads to understand why.",
    objective: 'Stage all changes and commit them with a message.',
    hints: ['`git add -A` stages every change, including new files. Then `git commit -m "your message"`.', 'Pick a message that explains the why, e.g. "Raise worker count for 2.4.0".', 'Run `git add -A`, then `git commit -m "Raise worker count for 2.4.0"`, then `git log --oneline`.'],
    check: () => S.repo.commits.length >= 4 && S.repo.staged.length === 0 },
  { ch: 14, id: 'deploy', title: 'Cut over to 2.4.0',
    story: "Last step. The live release is named in /srv/halcyon/CURRENT, and release v2.4.0 is already unpacked under releases/. Point CURRENT at the new version and restart the service so it loads it. This is the deploy.",
    objective: 'Set `/srv/halcyon/CURRENT` to `v2.4.0` and restart the `halcyon` service.',
    hints: ['`echo v2.4.0 > /srv/halcyon/CURRENT` updates the pointer (you can write there). Then restart the service.', 'Confirm the release first: `ls /srv/halcyon/releases` shows v2.4.0 is present.', 'Run `echo v2.4.0 > /srv/halcyon/CURRENT`, then `sudo systemctl restart halcyon`, and check with `cat /srv/halcyon/CURRENT` and `systemctl status halcyon`.'],
    check: () => { const c = getNode('/srv/halcyon/CURRENT'); return !!c && c.content.trim() === 'v2.4.0' && !!(S.restarted && S.restarted.halcyon); } },

  { ch: 15, id: 'inc-status', title: 'The pager goes off',
    onStart: () => {
      S.services.halcyon.active = false; S.restarted = S.restarted || {}; delete S.restarted.halcyon;
      const cf = getNode('/srv/halcyon/releases/v2.4.0/config/app.conf');
      if (cf) cf.content = cf.content.replace(/count\s*=\s*\d+/, 'count = 0');
      S.journal = S.journal || {};
      S.journal.halcyon = [
        'Oct 28 02:58:03 halcyon-web01 systemd[1]: Started halcyon.service - Halcyon Freight web app.',
        'Oct 28 02:58:03 halcyon-web01 halcyon-worker[4120]: reading /srv/halcyon/releases/v2.4.0/config/app.conf',
        'Oct 28 02:58:03 halcyon-web01 halcyon-worker[4120]: FATAL: [workers] count must be >= 1 (got 0)',
        'Oct 28 02:58:04 halcyon-web01 systemd[1]: halcyon.service: Main process exited, code=exited, status=1/FAILURE',
        "Oct 28 02:58:04 halcyon-web01 systemd[1]: halcyon.service: Failed with result 'exit-code'."
      ];
    },
    story: "2:58am. The app is down again. This is everything from Chapters 3 to 6, now against the clock. Start where every on-call starts: is the service even running? (Remember `systemctl status` from Chapter 5.)",
    objective: 'Check the `halcyon` service. What does the Active line report? Answer with `submit WORD`.',
    hints: ['`systemctl status halcyon` shows an Active line.', 'Read the first word after "Active:".', 'Run `systemctl status halcyon`. It is `inactive` (the process died).'],
    answer: a => /inactive|failed|dead/i.test(a.trim()) },
  { ch: 15, id: 'inc-journal', title: 'Why did it die?',
    story: "It is down, not starting. The reason is in the journal, the same `journalctl` you met in Chapter 12. systemd keeps the last words of every service there.",
    objective: "Read the halcyon service's log. Which config setting does it complain about? Answer with `submit NAME`.",
    hints: ['`journalctl -u halcyon` shows the service log. Look for the line marked FATAL.', 'The error names a setting under [workers].', 'Run `journalctl -u halcyon`. It complains that `count` must be >= 1.'],
    answer: a => /count|workers/i.test(a.trim()) },
  { ch: 15, id: 'inc-grep', title: 'Confirm it in the config',
    story: "Trust, then verify. Look at the live release's config and confirm the bad value with your own eyes, using `grep` from Chapter 3.",
    objective: 'Find the `count` line in `/srv/halcyon/releases/v2.4.0/config/app.conf`. What value is it set to? Answer with `submit NUMBER`.',
    hints: ['`grep count FILE` prints the matching line.', 'The file is /srv/halcyon/releases/v2.4.0/config/app.conf.', 'Run `grep count /srv/halcyon/releases/v2.4.0/config/app.conf`. It is 0 — that is the bug.'],
    answer: a => a.trim() === '0' },
  { ch: 15, id: 'inc-fix', title: 'Fix the config',
    story: "A deploy shipped `count = 0`, so no workers ever start. Set it back to 4, in place, with `sed` (Chapters 10 and 16). You own /srv/halcyon, so no sudo is needed here.",
    objective: 'Change the workers `count` in that app.conf from 0 to 4.',
    hints: ['`sed -i \'s/OLD/NEW/\' FILE` edits a file in place.', 'The line reads `count = 0`; you want `count = 4`.', "Run `sed -i 's/count = 0/count = 4/' /srv/halcyon/releases/v2.4.0/config/app.conf`, then grep it again to check."],
    check: () => { const cf = getNode('/srv/halcyon/releases/v2.4.0/config/app.conf'); return !!cf && /count\s*=\s*[1-9]/.test(cf.content); } },
  { ch: 15, id: 'inc-restart', title: 'Bring it back',
    story: "Config fixed. Restart the service so it re-reads the file and starts its workers, exactly as you did in Chapter 10.",
    objective: 'Restart the `halcyon` service and confirm it is active again.',
    hints: ['`sudo systemctl restart halcyon` restarts it.', 'Check with `systemctl is-active halcyon` — it should say `active`.', 'Run `sudo systemctl restart halcyon`, then `systemctl is-active halcyon`.'],
    check: () => S.services.halcyon.active && !!(S.restarted && S.restarted.halcyon) },
  { ch: 15, id: 'inc-listen', title: 'Confirm it is serving',
    story: "Running is not the same as serving. Prove the app is actually listening for traffic again, with `ss` from Chapter 6.",
    objective: 'Check the listening TCP ports. Which port is halcyon back on? Answer with `submit PORT`.',
    hints: ['`sudo ss -tlnp` lists listening sockets with their process.', 'Find the halcyon-worker line.', 'Run `sudo ss -tlnp`. It is back on 8080. Incident over.'],
    answer: a => a.trim() === '8080' },

  { ch: 16, id: 'perf-uptime', title: 'Everything is slow',
    onStart: () => { if (!S.procs.find(x => x.pid === 3301)) S.procs.push({ pid: 3301, user: 'halcyon', cpu: 187.0, mem: 6.2, vsz: 512000, rss: 258000, tty: '?', stat: 'R', start: '10:40', time: '52:18', cmd: '/usr/bin/python3 /opt/report/generate_quarterly.py', nice: 0 }); },
    story: "The app is up but painfully slow. First question for any slow box: how loaded is it? `uptime` shows the load average — the number of processes wanting the CPU, over 1, 5 and 15 minutes. On 4 cores, anything near 4 is maxed out.",
    objective: 'Run `uptime` and read the load.',
    hints: ['Just run `uptime`.', 'The three numbers after "load average:" are the 1, 5 and 15 minute averages.', 'Run `uptime`. The 1-minute load is over 4 — something is pegging the CPU.'],
    check: () => S.cmdsM.includes('uptime') },
  { ch: 16, id: 'perf-hog', title: 'Find the hog',
    story: "High load means a process is eating the CPU. Find it the way you found the runaway back in Chapter 5: `top` (or `ps aux`) sorts by CPU, busiest first.",
    objective: 'Find the PID of the process using the most CPU. Answer with `submit PID`.',
    hints: ['`top` lists the busiest process at the top; `ps aux` shows a %CPU column.', 'One process is near 187% (it is using more than a full core).', 'It is the quarterly report script. Run `top` and submit its PID: 3301.'],
    answer: a => a.trim() === '3301' },
  { ch: 16, id: 'perf-kill', title: 'Stop the batch job',
    story: "A quarterly-report batch job is hammering the box during peak hours. Stop it now (you can reschedule it for the night later), with `kill` from Chapter 5. It is the halcyon user's process, so use sudo.",
    objective: 'Stop process 3301.',
    hints: ['`kill 3301` fails (not your process); `sudo kill 3301` works.', 'Confirm with `uptime` or `top` afterwards — the load should fall.', 'Run `sudo kill 3301`.'],
    check: () => !S.procs.find(x => x.pid === 3301) },
  { ch: 16, id: 'perf-free', title: 'Check the memory',
    story: "CPU was the problem this time, but always check memory too. `free -h` shows it. The number that matters is `available`, not `free`: Linux keeps spare RAM as cache and gives it back on demand.",
    objective: 'Show the memory usage.',
    hints: ['Run `free -h` for human-readable sizes.', 'Compare the `used` and `available` columns.', 'Run `free -h`.'],
    check: () => S.cmdsM.includes('free') },
  { ch: 16, id: 'perf-renice', title: 'Tame the workers',
    story: "The app workers are greedy and starve interactive work. Rather than kill them, lower their priority so they yield when something else needs the CPU. That is `renice`: a higher niceness (up to 19) means 'be more generous'. Nice the master worker, PID 812, up to 10.",
    objective: 'Set the niceness of process 812 to 10.',
    hints: ['`renice -n N -p PID` changes priority; raising niceness on another user’s process needs sudo.', 'You want niceness 10 on PID 812.', 'Run `sudo renice -n 10 -p 812`.'],
    check: () => { const p2 = S.procs.find(x => x.pid === 812); return !!p2 && p2.nice === 10; } },

  { ch: 17, id: 'nh-create', title: 'Onboard a new admin',
    story: "A new admin, Sam, starts Monday. Everything here is Chapter 4, with one new command to make the account. `useradd -m` creates the user and a home directory; `-s` sets the login shell.",
    objective: 'Create a user `sam` with a home directory and the `/bin/bash` login shell.',
    hints: ['`useradd` needs root. `-m` makes the home dir, `-s /bin/bash` sets the shell.', 'The name goes last.', 'Run `sudo useradd -m -s /bin/bash sam`, then `getent passwd sam` to check.'],
    check: () => { const pw = splitLines(getNode('/etc/passwd').content).map(l => l.split(':')).find(f => f[0] === 'sam'); return !!pw && pw[6] === '/bin/bash'; } },
  { ch: 17, id: 'nh-sudo', title: 'Give Sam admin rights',
    story: "Sam needs to run admin commands, which means the `sudo` group — exactly what you added yourself to in Chapter 10. `usermod -aG` adds a user to a group without removing them from others.",
    objective: 'Add `sam` to the `sudo` group.',
    hints: ['`usermod -aG GROUP USER` appends a group. The `-a` is important: without it you replace all of sam’s groups.', 'The group is sudo.', 'Run `sudo usermod -aG sudo sam`, then `groups sam`.'],
    check: () => { const g = splitLines(getNode('/etc/group').content).map(l => l.split(':')).find(f => f[0] === 'sudo'); return !!g && (g[3] || '').split(',').includes('sam'); } },
  { ch: 17, id: 'nh-verify', title: 'Check the account',
    story: "Verify your work with `id`, from Chapter 4. It prints the user's numeric id and all their groups in one line.",
    objective: "What is sam's numeric user id (uid)? Answer with `submit NUMBER`.",
    hints: ['`id sam` prints `uid=NNNN(sam) ...`.', 'The number in the first parentheses is the uid.', 'Run `id sam`. It is 1003.'],
    answer: a => a.trim() === '1003' },
  { ch: 17, id: 'nh-key', title: 'Set up key-based login',
    story: "You turned passwords off in Chapter 10, so logins are by SSH key. Generate a key pair with `ssh-keygen`. It writes two files: a private key (kept secret) and a `.pub` public key (shared).",
    objective: 'Generate an ed25519 SSH key pair (the default path `~/.ssh/id_ed25519` is fine).',
    hints: ['`ssh-keygen -t ed25519` makes an ed25519 key. Add `-C "label"` to tag it.', 'Accept the default file location.', 'Run `ssh-keygen -t ed25519 -C "halcyon admin"`, then `ls -l ~/.ssh`.'],
    check: () => { const n = getNode(HOME + '/.ssh/id_ed25519.pub'); return !!n && n.type === 'file'; } },
  { ch: 17, id: 'nh-audit', title: 'Audit who can log in',
    story: "Before Sam's first day, audit the box. Who can actually log in? That is the shell question from Chapter 4 again: count the accounts with a real shell in /etc/passwd.",
    objective: 'How many accounts have `/bin/bash` as their shell? Answer with `submit NUMBER`.',
    hints: ['`grep -c \'/bin/bash$\' /etc/passwd` counts them. The `$` anchors to the end of the line.', 'Think about who that includes now that sam exists and jmorrow was locked out.', "Run `grep -c '/bin/bash$' /etc/passwd`. It is 4 (root, dana, rookie, sam)."],
    answer: a => a.trim() === '4' },
  { ch: 17, id: 'nh-lock', title: 'Close a departed account',
    story: "The audit turns up Dana's account — and Dana left the company weeks ago. Her account should not be able to log in. Do what you did to jmorrow in Chapter 10: change her shell to nologin.",
    objective: "Change dana's login shell to `/usr/sbin/nologin`.",
    hints: ['`usermod -s SHELL USER` changes a login shell, and it needs root.', 'The shell is /usr/sbin/nologin.', 'Run `sudo usermod -s /usr/sbin/nologin dana`, then `getent passwd dana`.'],
    check: () => { const pw = splitLines(getNode('/etc/passwd').content).map(l => l.split(':')).find(f => f[0] === 'dana'); return !!pw && /nologin|false/.test(pw[6]); } },

  { ch: 18, id: 'dr-run', title: 'Disaster-recovery drill',
    onStart: () => { const b = getNode('/mnt/backups'); if (b && b.children['nightly.tar.gz']) delete b.children['nightly.tar.gz']; },
    story: "Today is a DR drill: prove you can actually recover. Start with a fresh backup by running the script you wrote in Chapter 11. (If you deleted it, the hint rebuilds it.)",
    objective: 'Run your backup script so that `/mnt/backups/nightly.tar.gz` is (re)created.',
    hints: ['Run `sudo bash ~/backup.sh` — the script from Chapter 11 that tars the config into /mnt/backups/nightly.tar.gz.', 'Check it exists with `ls -l /mnt/backups`.', "If ~/backup.sh is gone, recreate it: `printf '#!/bin/bash\\ntar -czf /mnt/backups/nightly.tar.gz /srv/halcyon/releases/v2.3.1/config\\n' > ~/backup.sh`, then `sudo bash ~/backup.sh`."],
    check: () => { const n = getNode('/mnt/backups/nightly.tar.gz'); return !!n && !!n.archive; } },
  { ch: 18, id: 'dr-sum', title: 'Fingerprint the original',
    story: "Before restoring, record a fingerprint of the live config so you can prove the restore matches. `sha256sum` turns a file's contents into a short unique string; two files with the same sum are identical.",
    objective: 'Compute the sha256 checksum of `/srv/halcyon/releases/v2.3.1/config/app.conf`.',
    hints: ['`sha256sum FILE` prints the checksum and the file name.', 'The file is /srv/halcyon/releases/v2.3.1/config/app.conf.', 'Run `sha256sum /srv/halcyon/releases/v2.3.1/config/app.conf`.'],
    check: () => S.cmdsM.includes('sha256sum') },
  { ch: 18, id: 'dr-restore', title: 'Restore to a safe place',
    story: "Never restore straight over production. Extract the backup into a scratch directory first, with `tar -x` from Chapter 8, and see the files come back.",
    objective: 'Make `~/dr-test` and extract `/mnt/backups/nightly.tar.gz` into it.',
    hints: ['`mkdir ~/dr-test`, then `tar -xzf ARCHIVE -C ~/dr-test`.', 'The archive is /mnt/backups/nightly.tar.gz. You own ~/dr-test, so no sudo.', 'Run `mkdir ~/dr-test`, then `tar -xzf /mnt/backups/nightly.tar.gz -C ~/dr-test`, then `find ~/dr-test`.'],
    check: () => { let ok = false; const r = getNode(HOME + '/dr-test'); if (r && r.type === 'dir') walkAll(HOME + '/dr-test', r, (pp, nn) => { if (nn.type === 'file' && /app\.conf$/.test(pp)) ok = true; }); return ok; } },
