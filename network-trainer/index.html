      if (ip == null || !cfg || !(cfg.prefixLists && cfg.prefixLists[name])) return err('bgp: create the prefix-list before attaching it');
      const n = cfg.neighbors.find(x => x.ip === ip); if (!n) return err('bgp: neighbor is not configured');

    }

      const cfg = ensure(), name = a[1].toUpperCase(), seq = Number(a[3]), action = a[4], network = parseCIDR(a[5]);
      if (!Number.isInteger(seq) || seq < 1 || seq > 65535 || !['permit','deny'].includes(action) || !network) return err('usage: bgp prefix-list <name> seq <1-65535> permit|deny <CIDR> [ge <n>] [le <n>]');
      const opts = a.slice(6); let ge = null, le = null;
      if (opts.length && opts.length !== 2 && opts.length !== 4) return err('bgp prefix-list: invalid ge/le options');
      for (let i=0;i<opts.length;i+=2) { const n=Number(opts[i+1]); if (!['ge','le'].includes(opts[i]) || !Number.isInteger(n) || n < network.prefix || n > 32) return err('bgp prefix-list: invalid ge/le value'); if(opts[i]==='ge')ge=n;else le=n; }

      list.push({ seq, action, dest: network.net, mask: network.prefix, ge, le }); list.sort((x,y)=>x.seq-y.seq);
      return ok('BGP prefix-list ' + name + ' sequence ' + seq + ' added');
    }
    if (a[0] === 'prefix-list' && a[1] && ['permit','deny'].includes(a[2]) && a[3]) {
      const cfg = ensure(), name = a[1].toUpperCase(), network = parseCIDR(a[3]);
      if (!network) return err('bgp prefix-list: invalid IPv4 CIDR');
      const opts = a.slice(4); let ge = null, le = null;
      if (opts.length && opts.length !== 2 && opts.length !== 4) return err('bgp prefix-list: invalid ge/le options');
      for (let i=0;i<opts.length;i+=2) { const n=Number(opts[i+1]); if (!['ge','le'].includes(opts[i]) || !Number.isInteger(n) || n < network.prefix || n > 32) return err('bgp prefix-list: invalid ge/le value'); if(opts[i]==='ge')ge=n;else le=n; }
      if (ge != null && le != null && ge > le) return err('bgp prefix-list: ge cannot exceed le');
      const list = cfg.prefixLists[name] = cfg.prefixLists[name] || [], seq = Math.max(0,...list.map(x=>x.seq))+10;
      list.push({seq,action:a[2],dest:network.net,mask:network.prefix,ge,le}); return ok('BGP prefix-list ' + name + ' sequence ' + seq + ' added');
    }
    if (a[0] === 'no' && a[1] === 'prefix-list' && a[2]) {
      const cfg = dev.bgp, name = a[2].toUpperCase();
      if (!cfg || !cfg.prefixLists || !cfg.prefixLists[name]) return err('bgp: prefix-list not found');
      if (a[3] === 'seq' && a[4]) { const seq=Number(a[4]), before=cfg.prefixLists[name].length; cfg.prefixLists[name]=cfg.prefixLists[name].filter(x=>x.seq!==seq); return before===cfg.prefixLists[name].length?err('bgp: sequence not found'):ok(''); }
      if ((cfg.neighbors||[]).some(n=>n.inPrefixList===name||n.outPrefixList===name)) return err('bgp: prefix-list is attached to a neighbor; detach it first');
      delete cfg.prefixLists[name]; return ok('');
    }
    if (a[0] === 'no' && a[1] === 'neighbor' && a[2] && a.length === 3) {
      const cfg=dev.bgp, ip=parseIPv4(a[2]); if(!cfg||ip==null)return err('bgp: invalid or unknown neighbor');
      const before=cfg.neighbors.length; cfg.neighbors=cfg.neighbors.filter(n=>n.ip!==ip);
      return before===cfg.neighbors.length?err('bgp: neighbor not found'):ok('');
    }
    if (a[0] === 'no' && a[1] === 'neighbor' && a[2] && a[3] === 'prefix-list' && a[4] && ['in','out'].includes(a[5])) {
      const cfg=dev.bgp, ip=parseIPv4(a[2]), n=cfg&&(cfg.neighbors||[]).find(x=>x.ip===ip);
      if(!n)return err('bgp: neighbor not found'); const key=a[5]==='in'?'inPrefixList':'outPrefixList';
      if(n[key]!==a[4].toUpperCase())return err('bgp: matching prefix-list is not attached');
      delete n[key]; return ok('');
    }
    if (a[0] === 'network' && a[1] && a.length === 2) {
      const network = parseCIDR(a[1]); if (!network) return err('bgp: use a valid IPv4 CIDR');
      const cfg=ensure(); if (!cfg.networks.includes(a[1])) cfg.networks.push(a[1]); return ok('BGP network ' + a[1]);
    }
    if (a[0] === 'no' && a[1] === 'network' && a[2]) {
      const cfg=dev.bgp, before=cfg?(cfg.networks||[]).length:0;
      if(cfg)cfg.networks=cfg.networks.filter(x=>x!==a[2]);
      return before===(cfg?(cfg.networks||[]).length:0)?err('bgp: network statement not found'):ok('');
    }
    if (a[0] === 'advertised') {
      const peer = a[1] ? parseIPv4(a[1]) : null;
      if (a[1] && peer == null) return err('bgp: invalid neighbor address');
      return ok('Advertised prefixes:\\n' + (M.bgpAdvertised(cli.net,cli.cur,peer).map(r=>M.ipStr(r.dest)+'/'+r.mask).join('\\n') || '(none)'));
    }
    if (a[0] === 'received') {
      const rows=M.bgpLearned(cli.net,cli.cur).map(r=>M.ipStr(r.dest)+'/'+r.mask+' via '+M.ipStr(r.via)+' AS path '+(r.asPath||[]).join(' '));
      return ok('Received prefixes:\\n'+(rows.join('\\n')||'(none)'));
    }
    if (a[0] === 'summary' || a[0] === 'neighbor' && !a[1]) {
      const ss = M.bgpSessions(cli.net, cli.cur);
      if (!ss.length) return ok('BGP: no neighbors configured');
      return ok('BGP sessions:\\n' + ss.map(s => '  ' + M.ipStr(s.ip) + '  AS' + s.remoteAs + '  ' + s.type + '  ' + (s.up ? 'Established' : s.reason) + '  prefixes ' + M.bgpLearned(cli.net,cli.cur).filter(r=>r.via===s.ip).length).join('\\n'));
    }
    return err('usage: bgp asn <n> | bgp neighbor <ip> remote-as <n> | bgp neighbor <ip> prefix-list <name> in|out | bgp network <cidr> | bgp prefix-list <name> permit|deny <cidr> | bgp summary|advertised|received');
  },
  ospf: (cli, a) => {
    const dev = cli.net.devices[cli.cur];
    if (a[0] === 'neighbor' || a[0] === 'neighbors' || (a[0] === 'show' )) {
      const ns = M.ospfNeighbors(cli.net, cli.cur);
      if (!ns.length) return ok('OSPF neighbors: (none)');
      return ok('OSPF neighbors:\n' + ns.map(n => `  ${n.id}  ${M.ipStr(n.ip)}  area ${n.area}  via ${n.via}`).join('\n'));
    }
    // ip-style: ospf <iface> area <n>
    const ifn = a[0], area = a[2];
    if (!ifn || a[1] !== 'area' || area == null) return err('usage: ospf <iface> area <n>   |   ospf neighbor');
    if (!dev.ifaces[ifn]) return err('ospf: no interface ' + ifn);
    dev.ifaces[ifn].ospf = Number(area);
    return ok(`OSPF enabled on ${ifn} area ${area}`);
  },
  help: () => ok('commands: ip, vlan, interface, switchport, spanning-tree, show, clear, exit, ping, traceroute, arp, tcpdump, iptables, nmap, dig, dhclient, resolvectl, man, help\n  IOS routing: router ospf <process-id> · router-id <id> · network <address> <wildcard> area <id> · passive-interface <if>\n  OSPF verification: show ip ospf neighbor · show ip ospf interface brief · show ip protocols · show ip route (C/S/O/B)\n  BGP operations: bgp asn · bgp neighbor · bgp network · bgp prefix-list · bgp advertised|received|summary\\n  BGP verification: show ip bgp summary · show ip bgp · show ip bgp neighbors · show ip bgp advertised-routes\\n  IOS services: ip dhcp pool · ip helper-address · ip name-server · ip host · ntp server|master · logging host|trap\n  show ip dhcp pool|binding|server statistics · show hosts · show ntp status|associations · show logging\n  ip addr | ip addr add|replace|del <A>/<p> dev <if> | ip link set <if> up|down\n  ip route | ip route add|replace [default|<cidr>] via <ip> | ip route del [default|<cidr>]\n  vlan <id> · interface <port> · switchport mode access|trunk · switchport access vlan <id>\n  switchport trunk native vlan <id> · switchport trunk allowed vlan <all|id,id> · spanning-tree vlan <id> priority <n>\n  show vlan brief · show interfaces trunk · show spanning-tree · show mac address-table dynamic · clear mac address-table dynamic\n  ping <host|ip|name> · traceroute <host|ip> · arp · tcpdump · iptables -L|-A ... · nmap <host|ip>\n  dig <name> · dhclient <if> · resolvectl dns <if> <ip> | resolvectl status'),

  man: (cli, a) => ok(MAN[a[0]] || `no manual entry for ${a[0] || ''}`),

  ip: (cli, a) => {
    const dev = cli.net.devices[cli.cur];
    const sub = a[0];
    if (sub === 'link') {                                   // ip link set eth0 up|down
      const si = a.indexOf('set'); const ifn = si >= 0 ? a[si + 1] : null;
      const state = (a[si + 2] || '').toLowerCase();
      if (!ifn || !dev.ifaces[ifn] || !['up', 'down'].includes(state))
        return err('usage: ip link set <iface> up|down');
      dev.ifaces[ifn].up = state === 'up';
      return ok(ifn + ': ' + state);
    }
    if (sub === 'addr' || sub === 'a' || sub === 'address') {
      if (a[1] === 'add' || a[1] === 'replace') {
        const di = a.indexOf('dev'); const ifn = di >= 0 ? a[di + 1] : null;
        const parsed = parseCIDR(a[2]);
        if (!parsed || !ifn) return err('usage: ip addr add <valid-IPv4>/<0-32> dev <existing-interface>');
        if (!dev.ifaces[ifn]) return err('ip addr: no such interface ' + ifn);
        const address = parseIPv4(String(a[2]).split('/')[0]);
        if (a[1] === 'add' && dev.ifaces[ifn].ip != null
            && (dev.ifaces[ifn].ip !== address || dev.ifaces[ifn].mask !== parsed.prefix))
          return err('ip addr: interface already has an address; use replace or delete it first');
        for (const [id, other] of Object.entries(cli.net.devices)) {
          for (const [otherIf, f] of Object.entries(other.ifaces || {})) {
            if (f.up !== false && f.ip === address && !(id === cli.cur && otherIf === ifn))
              return err('ip addr: address already in use by ' + id + '/' + otherIf);
          }
        }
        dev.ifaces[ifn] = { ...dev.ifaces[ifn], ip: address, mask: parsed.prefix };
        return ok(ifn + ': ' + M.ipStr(address) + '/' + parsed.prefix);
      }
      if (a[1] === 'del' || a[1] === 'delete') {
        const di = a.indexOf('dev'); const ifn = di >= 0 ? a[di + 1] : null;
        const parsed = parseCIDR(a[2]);
        if (!parsed || !ifn) return err('usage: ip addr del <valid-IPv4>/<0-32> dev <existing-interface>');
        const iface = dev.ifaces[ifn];
        if (!iface) return err('ip addr: no such interface ' + ifn);
        const address = parseIPv4(String(a[2]).split('/')[0]);
        if (iface.ip !== address || iface.mask !== parsed.prefix) return err('ip addr: address not configured on ' + ifn);
        delete iface.ip; delete iface.mask;
        return ok(ifn + ': address removed');
      }
      const lines = Object.entries(dev.ifaces).map(([n, f]) =>
        `${n}: ${f.up === false ? 'DOWN' : 'UP'}  ${f.ip != null ? M.ipStr(f.ip) + '/' + f.mask : '(no address)'}${f.vlan != null ? ' vlan ' + f.vlan : ''}`);
      return ok(lines.join('\n'));
    }
    if (sub === 'route' || sub === 'r') {
      if (a[1] === 'add' || a[1] === 'replace') {
        const vi = a.indexOf('via');
        if (vi !== 3 || !a[vi + 1]) return err('usage: ip route add <default|valid-CIDR> via <gateway-IPv4>');
        const via = parseIPv4(a[vi + 1]);
        const target = a[2] === 'default' ? { net: 0, prefix: 0 } : parseCIDR(a[2]);
        if (!target || via == null) return err('ip route: invalid destination or gateway address');
        const gatewayIface = M.directIface(dev, via);
        if (!gatewayIface || dev.ifaces[gatewayIface].up === false)
          return err('ip route: gateway ' + a[vi + 1] + ' is not on an active connected subnet');
        if (Object.values(dev.ifaces).some(f => f.ip === via && f.up !== false))
          return err('ip route: gateway cannot be this device own address');
        dev.routes = dev.routes || [];
        const samePrefix = r => r.mask === target.prefix && r.dest === target.net;
        if (a[1] === 'replace') dev.routes = dev.routes.filter(r => !samePrefix(r));
        else if (dev.routes.some(r => samePrefix(r) && r.via === via))
          return err('ip route: identical route already exists');
        dev.routes.push({ dest: target.net, mask: target.prefix, via });
        return ok('route ' + (target.prefix === 0 ? 'default' : M.ipStr(target.net) + '/' + target.prefix) + ' via ' + a[vi + 1]);
      }
      if (a[1] === 'del' || a[1] === 'delete') {
        const target = a[2] === 'default' ? { net: 0, prefix: 0 } : parseCIDR(a[2]);
        if (!target) return err('usage: ip route del <default|valid-CIDR>');
        const before = (dev.routes || []).length;
        dev.routes = (dev.routes || []).filter(r => !(r.mask === target.prefix && r.dest === target.net));
        if (dev.routes.length === before) return err('ip route: no matching route to delete');
        return ok('route removed');
      }
      const rs = (dev.routes || []).map(r => routeLabel(cli.net, cli.cur, r));
      return ok(rs.length ? rs.join('\n') : '(no routes)');
    }
    if (sub === 'neigh' || sub === 'neighbor') return COMMANDS.arp(cli, []);
    return err(`ip: unknown object '${sub || ''}'`);
  },

  arp: cli => {
    const dev = cli.net.devices[cli.cur]; const seen = {};
    for (const ifn in dev.ifaces) {
      const f = dev.ifaces[ifn]; if (f.up === false || f.ip == null) continue;
      for (const [d, i] of M.l2Domain(cli.net, cli.cur, ifn)) {
        const nf = cli.net.devices[d].ifaces[i];
        if (nf.ip != null) seen[M.ipStr(nf.ip)] = `${M.ipStr(nf.ip)} dev ${ifn} (${d})`;
      }
    }
    const rows = Object.values(seen);
    return ok(rows.length ? rows.join('\n') : '(no neighbours learned)');
  },

  ping: (cli, a) => {
    const t = a[0]; if (!t) return err('usage: ping <host|ip|name>');
    const rt = resolveTarget(cli, t); if (rt.err) return err(`PING ${t}: ${rt.err}`);
    const dst = rt.ip;
    const base = {};
    const pi = a.indexOf('-p'); if (pi >= 0) base.proto = a[pi + 1];
    const di = a.indexOf('--dport'); if (di >= 0) base.dport = Number(a[di + 1]);
    const r = M.ping(cli.net, cli.cur, dst, base);
    cli.lastPing = { src: M.sourceIpToward(cli.net, cli.cur, dst), dst, proto: base.proto || 'icmp', dport: base.dport, path: (r.forward && r.forward.path) || [cli.cur], ok: r.ok };
    cli.flows = cli.flows || [];
    cli.flows.unshift({ t: Date.now(), from: cli.cur, ...cli.lastPing });
    if (cli.flows.length > 12) cli.flows.length = 12;
    const path = ((r.forward && r.forward.path) || [cli.cur]).join(' -> ');
    if (r.ok) return ok(`PING ${t} (${M.ipStr(dst)}): reply received — reachable\npath: ${path}`);
    return err(`PING ${t} (${M.ipStr(dst)}): ${r.reason}\npath: ${path}`);
  },

  traceroute: (cli, a) => {
    const t = a[0]; if (!t) return err('usage: traceroute <host|ip>');
    const dst = resolve(cli.net, t); if (dst == null) return err(`traceroute: cannot resolve ${t}`);
    const src = M.sourceIpToward(cli.net, cli.cur, dst);
    const f = M.forward(cli.net, cli.cur, { src, dst, proto: 'icmp' });
    const lines = f.path.map((d, i) => {
      const dev = cli.net.devices[d]; const inIf = M.directIface(dev, src) || Object.keys(dev.ifaces)[0];
      const hopIp = dev.ifaces[inIf] && dev.ifaces[inIf].ip != null ? M.ipStr(dev.ifaces[inIf].ip) : '*';
      return ` ${i + 1}  ${d}  ${hopIp}`;
    });
    if (!f.ok) lines.push(` *  ${f.reason}`);
    return { out: `traceroute to ${t} (${M.ipStr(dst)})\n` + lines.join('\n'), code: f.ok ? 0 : 1 };
  },

  tcpdump: cli => {
    const p = cli.lastPing;
    if (!p) return ok('(no packets captured — run a ping first)');
    const proto = p.proto.toUpperCase();
    const svc = p.dport ? ` ${proto} ${M.ipStr(p.dst)}.${p.dport}` : ` ${proto}`;
    const lines = [`${M.ipStr(p.src)} > ${M.ipStr(p.dst)}:${svc} request`];
    if (p.ok) lines.push(`${M.ipStr(p.dst)} > ${M.ipStr(p.src)}:${svc} reply`);
    else lines.push(`(no reply — delivery failed along ${p.path.join(' -> ')})`);
    return ok(lines.map(l => 'IP ' + l).join('\n'));
  },

  iptables: (cli, a) => {
    const dev = cli.net.devices[cli.cur]; dev.acls = dev.acls || [];
    if (a[0] === '-t' && a[1] === 'nat') return iptablesNat(cli, dev, a.slice(2));
    if (a[0] === '-t') a = a.slice(2);                       // -t filter (the default)
    if (a[0] === '-L' || a[0] === '--list') {
      if (!dev.acls.length) return ok('Chain INPUT (policy ACCEPT)\n  (no rules)');
      const dstTxt = r => r.dst != null ? ' dst:' + M.ipStr(r.dst) : r.dstnet ? ' dst:' + M.ipStr(r.dstnet.net) + '/' + r.dstnet.prefix : '';
      const rows = dev.acls.map(r => `  ${r.action === 'deny' ? 'DROP' : 'ACCEPT'}  ${r.proto || 'all'}  in:${r.dev || 'any'}${r.src != null ? ' src:' + M.ipStr(r.src) : ''}${dstTxt(r)}${r.dport != null ? ' dpt:' + r.dport : ''}${r.any ? '  anywhere' : ''}`);
      return ok('Chain INPUT\n' + rows.join('\n'));
    }
    if (a[0] === '-A') {                                       // iptables -A INPUT -i eth0 -p tcp --dport 23 -j DROP
      const get = flag => { const i = a.indexOf(flag); return i >= 0 ? a[i + 1] : null; };
      const chain = a[1];
      if (!/^INPUT$|^IN$/i.test(chain || '')) return err('this prototype supports the INPUT chain only');
      const rule = { dir: 'in', dev: get('-i') || undefined };
      const proto = get('-p'); if (proto) rule.proto = proto;
      const dport = get('--dport'); if (dport) rule.dport = Number(dport);
      const src = get('-s'); if (src) rule.src = M.ip(src);
      const dst = get('-d'); if (dst) { if (dst.includes('/')) rule.dstnet = M.cidr(dst); else rule.dst = M.ip(dst); }
      const j = get('-j'); rule.action = /DROP|REJECT/i.test(j || '') ? 'deny' : 'allow';
      dev.acls.push(rule);
      return ok('');
    }
    if (a[0] === '-F') { dev.acls = []; return ok(''); }
    return err('usage: iptables -L | -A INPUT -i <if> [-p tcp] [--dport N] -j DROP|ACCEPT | -F');
  },

  nmap: (cli, a) => {                                          // read-only, defensive: what is this host exposing?
    const t = a[0]; if (!t) return err('usage: nmap <host|ip>');
    const dst = resolve(cli.net, t); if (dst == null) return err(`nmap: cannot resolve ${t}`);
    const owner = M.deviceOwning(cli.net, dst);
    if (!owner) return ok(`Host ${M.ipStr(dst)} seems down (no such host).`);
    const reach = M.ping(cli.net, cli.cur, dst);
    if (!reach.ok) return ok(`Host ${M.ipStr(dst)} is unreachable from here (${reach.reason}).`);
    const svcs = cli.net.devices[owner].services || {};
    const ports = Object.keys(svcs);
    const body = ports.length ? ports.map(p => `${p}/tcp  open  ${svcs[p]}`).join('\n') : '(no open ports)';
    return ok(`Scan report for ${t} (${M.ipStr(dst)}) — host is up\nPORT     STATE SERVICE\n${body}`);
  },

  dig: (cli, a) => {                                          // resolve a name via this host's configured DNS server
    const name = a[0]; if (!name) return err('usage: dig <name>');
    const r = M.resolveName(cli.net, cli.cur, name);
    if (r.ok) return ok(`; <<>> dig ${name}\n;; ANSWER SECTION:\n${name}.\t\tIN\tA\t${M.ipStr(r.ip)}`);
    return err(`; <<>> dig ${name}\n;; resolution failed: ${r.reason}`);
  },

  dhclient: (cli, a) => {                                     // request a DHCP lease on an interface
    const ifn = a[0] || 'eth0';
    const r = M.dhclient(cli.net, cli.cur, ifn);
    if (!r.ok) return err(`dhclient ${ifn}: ${r.reason}`);
    return ok(`dhclient ${ifn}: lease acquired\n  address ${M.ipStr(r.ip)}/${r.prefix}\n  gateway ${r.gw != null ? M.ipStr(r.gw) : '(none)'}\n  dns     ${r.dns != null ? M.ipStr(r.dns) : '(none)'}`);
  },

  resolvectl: (cli, a) => {                                   // systemd-resolved: show/set the DNS server for a link
    const dev = cli.net.devices[cli.cur];
    if (a[0] === 'dns' && a[1] && a[2]) {                     // resolvectl dns eth0 10.0.0.53
      if (!dev.ifaces[a[1]]) return err(`resolvectl: no such link ${a[1]}`);
      if (!/^\d+\.\d+\.\d+\.\d+$/.test(a[2])) return err(`resolvectl: '${a[2]}' is not an address`);
      dev.resolver = M.ip(a[2]);
      return ok(`Set DNS server for ${a[1]} to ${a[2]}.`);
    }
    if (!a[0] || a[0] === 'status') return ok(`Current DNS Server: ${dev.resolver != null ? M.ipStr(dev.resolver) : '(none)'}`);
    return err('usage: resolvectl dns <link> <server-ip> | resolvectl status');
  }
};

// iptables -t nat: PREROUTING DNAT (port-forward) + POSTROUTING MASQUERADE/SNAT.
function iptablesNat(cli, dev, a) {
  dev.nat = dev.nat || [];
  const get = flag => { const i = a.indexOf(flag); return i >= 0 ? a[i + 1] : null; };
  if (a[0] === '-L' || a[0] === '--list') {
    if (!dev.nat.length) return ok('Chain PREROUTING\n  (no rules)\nChain POSTROUTING\n  (no rules)');
    const rows = dev.nat.map(r => r.kind === 'dnat'
      ? `  DNAT   ${r.proto || 'all'}  in:${r.oif}${r.dport != null ? ' dpt:' + r.dport : ''}  ->  ${M.ipStr(r.toIp)}`
      : `  MASQ   out:${r.oif}  src:${M.ipStr(r.srcNet.net)}/${r.srcNet.prefix}`);

// Networking Trainer — M3: the mission layer.
// A mission is DATA: a starting topology + a list of declarative checks. The
// runner builds the world, binds a CLI, and grades the checks after any command.
// Same shape as the sysadmin game's missions and its authored-mission check types,
// so a no-code mission editor can emit these directly.
const C = require('./net-checks');
const { makeCLI } = require('./net-cli');

// Map a declarative check spec -> a { ok, reason } result.
function evalCheck(net, s) {
  const opt = {}; if (s.proto) opt.proto = s.proto; if (s.dport != null) opt.dport = s.dport;
  switch (s.type) {
    case 'reachable':      return C.reachable(net, s.a, s.b, opt);
    case 'not_reachable':  return C.notReachable(net, s.a, s.b, opt);
    case 'route_exists':   return C.routeExists(net, s.dev, s.cidr);
    case 'subnet_correct': return C.subnetCorrect(net, s.dev, s.iface, s.cidr);
    case 'acl_blocks':     return C.aclBlocks(net, s.src, s.dst, { proto: s.proto, dport: s.dport });
    case 'service_up':     return C.serviceUp(net, s.dev, s.port);
    case 'resolves':       return C.resolves(net, s.dev, s.name, s.ip);
    case 'ospf_neighbor':  return C.ospfNeighbor(net, s.dev, s.peer);
    case 'ospf_route':     return C.ospfRoute(net, s.dev, s.cidr);
    case 'hsrp_state':    return C.hsrpState(net, s.dev, s.iface, s.state);
    case 'bgp_session':    return C.bgpSession(net, s.dev, s.peer);
    case 'bgp_route':      return C.bgpRoute(net, s.dev, s.cidr);
    case 'bgp_route_absent': return C.bgpRouteAbsent(net, s.dev, s.cidr);
    case 'port_forward':   return C.portForward(net, s.from, s.public, s.dport, s.server, s.proto);
    case 'mac_entry':      return C.macEntry(net, s.dev, s.device, s.vlan, s.port);
    case 'stp_root':       return C.stpRoot(net, s.dev, s.vlan, s.root);
    case 'stp_blocked':    return C.stpBlocked(net, s.dev, s.port, s.vlan);
    case 'dhcp_lease':     return C.dhcpLease(net, s.dev, s.iface, s.cidr);
    case 'ntp_sync':       return C.ntpSynchronized(net, s.dev);
    case 'syslog_received':return C.syslogReceived(net, s.collector, s.source);
    default:               return { ok: false, reason: `unknown check type: ${s.type}` };
  }
}

// Start a mission: fresh world + a console on the starting device.
function startMission(mission) {
  const net = mission.build();
  const cli = makeCLI(net, mission.console);
  const api = {
    net, cli, mission,
    run: line => cli.run(line),
    on: dev => { cli.on(dev); return api; },
    results: () => mission.success.map(s => ({ spec: s, ...evalCheck(net, s) })),
    done: () => api.results().every(r => r.ok) && api.reviewOk() && api.faultsOk(),
    // Diagnosis gate: the player must localize the fault before fixing it.
    // A mission with no `diagnose` block has no gate (ok for any index).
    requiresDiagnosis: !!mission.diagnose,
    // Design-review: planted findings the player must identify (and not the distractors).
    review: mission.review || null,
    selectedFindings: new Set(),
    foundFaults: new Set(),
    toggleFault(id) {
      if (api.foundFaults.has(id)) api.foundFaults.delete(id);
      else api.foundFaults.add(id);
    },
    faultsOk() {
      const fs = mission.faults; if (!fs) return true;
      const need = new Set(fs.filter(f => f.present).map(f => f.id));
      if (api.foundFaults.size !== need.size) return false;
      for (const id of need) if (!api.foundFaults.has(id)) return false;
      return true;
    },
    toggleFinding(id) {
      if (api.selectedFindings.has(id)) api.selectedFindings.delete(id);
      else api.selectedFindings.add(id);
    },
    reviewOk() {
      const r = mission.review; if (!r) return true;
      const planted = new Set(r.findings.filter(f => f.planted).map(f => f.id));
      if (api.selectedFindings.size !== planted.size) return false;
      for (const id of planted) if (!api.selectedFindings.has(id)) return false;
      return true;
    },
    gradeDiagnosis(idx) {
      const d = mission.diagnose;
      if (!d) return { ok: true, because: '' };
      return { ok: idx === d.answer, because: d.because };
    },
    // The `check` command: what's still unmet and why (the teaching moment).
    status() {
      const unmet = api.results().filter(r => !r.ok);
      const lines = unmet.map(r => '  ✗ ' + r.reason);
      if (mission.review && !api.reviewOk()) lines.push('  ✗ design review incomplete — check every real fault, and only those');
      if (mission.faults && !api.faultsOk()) lines.push('  ✗ localize every real fault before the ticket closes');
      return lines.length
        ? 'Not resolved yet:\n' + lines.join('\n')
        : '✓ All objectives met — ticket resolved.';
    }
  };
  cli.mission = mission;
  cli.selected = api.selectedFindings;
  cli.found = api.foundFaults;
  return api;
}

module.exports = { evalCheck, startMission };

// Builder ops — pure, headless mutations of a topology ({ devices, links }).
// The design-mode UI and the no-code authoring tool are thin layers over these;
// keeping them pure means the builder is testable without a DOM. Every op keeps
// the topology valid for the engine (unique ids, real interfaces, no dangling links).
const PREFIX = { host: 'h', server: 'srv', switch: 'sw', router: 'r', firewall: 'fw' };
const SPEC = {
  host:     () => ({ kind: 'host',     ifaces: { eth0: { up: true } }, routes: [] }),
  server:   () => ({ kind: 'host',     ifaces: { eth0: { up: true } }, routes: [], services: {} }),
  switch:   () => ({ kind: 'switch',   ifaces: { p1: { up: true }, p2: { up: true }, p3: { up: true }, p4: { up: true } } }),
  router:   () => ({ kind: 'router',   ifaces: { eth0: { up: true }, eth1: { up: true } }, routes: [], acls: [] }),
  firewall: () => ({ kind: 'firewall', ifaces: { eth0: { up: true }, eth1: { up: true } }, routes: [], acls: [] })
};
const KINDS = Object.keys(SPEC);

function blank() { return { devices: {}, links: [] }; }

function uniqueId(topo, base) { let i = 1; while (topo.devices[base + i]) i++; return base + i; }

// Add a device of `kind` (host/server/switch/router/firewall). Returns its id.
function addDevice(topo, kind, id) {
  if (!SPEC[kind]) throw new Error('unknown device kind: ' + kind);
  const newId = id || uniqueId(topo, PREFIX[kind]);
  if (topo.devices[newId]) throw new Error('device id already exists: ' + newId);
  topo.devices[newId] = { id: newId, ...SPEC[kind]() };
  return newId;
}

// Remove a device and any links touching it.
function removeDevice(topo, id) {
  if (!topo.devices[id]) return false;
  delete topo.devices[id];
  if (topo.pos) delete topo.pos[id];
  topo.links = topo.links.filter(l => l.a[0] !== id && l.b[0] !== id);
  return true;
}

// An interface on `id` not already occupied by a link, or null if all are used.
function freePort(topo, id) {
  const dev = topo.devices[id]; if (!dev) return null;
  const used = new Set();
  for (const l of topo.links) {
    if (l.a[0] === id) used.add(l.a[1]);
    if (l.b[0] === id) used.add(l.b[1]);
  }
  for (const ifn in dev.ifaces) if (!used.has(ifn)) return ifn;
  return null;
}

// A free port, growing switches (pN) and routers/firewalls (ethN) when full.
// Hosts/servers keep their single interface.
function ensurePort(topo, id) {
  const p = freePort(topo, id); if (p) return p;
  const dev = topo.devices[id]; if (!dev) return null;
  if (dev.kind === 'switch') { const np = 'p' + (Object.keys(dev.ifaces).length + 1); dev.ifaces[np] = { up: true }; return np; }
  if (dev.kind === 'router' || dev.kind === 'firewall') { const np = 'eth' + Object.keys(dev.ifaces).length; dev.ifaces[np] = { up: true }; return np; }
  return null;
}

// Wire two devices. Picks free ports unless given. Returns the link, or throws.
function addLink(topo, aId, bId, aIf, bIf) {
  if (!topo.devices[aId] || !topo.devices[bId]) throw new Error('link endpoint does not exist');
  if (aId === bId) throw new Error('cannot link a device to itself');
  const a = aIf || ensurePort(topo, aId);
  const b = bIf || ensurePort(topo, bId);
  if (!a || !b) throw new Error('no free port available');
  const taken = (d, i) => topo.links.some(l => (l.a[0] === d && l.a[1] === i) || (l.b[0] === d && l.b[1] === i));
  if (taken(aId, a) || taken(bId, b)) throw new Error('port already in use');
  const link = { a: [aId, a], b: [bId, b], up: true };
  topo.links.push(link);
  return link;
}

function removeLink(topo, index) {
  if (index < 0 || index >= topo.links.length) return false;
  topo.links.splice(index, 1); return true;
}

// Duplicate a device's configuration without copying its physical links.
// The new device receives a unique id and a nearby canvas position.
function cloneDevice(topo, id) {
  const source = topo.devices[id]; if (!source) throw new Error('no such device: ' + id);
  const kind = source.services ? 'server' : source.kind;
  const newId = uniqueId(topo, PREFIX[kind] || PREFIX.host);
  const copy = JSON.parse(JSON.stringify(source));
  copy.id = newId;
  if (copy.hostname === id) copy.hostname = newId;
  topo.devices[newId] = copy;
  if (topo.pos && topo.pos[id]) topo.pos[newId] = [topo.pos[id][0] + 32, topo.pos[id][1] + 32];
  return newId;
}

// Set (or clear) an interface address. Empty ip clears it.
function setAddress(topo, id, iface, ipStr, prefix) {
  const dev = topo.devices[id]; if (!dev || !dev.ifaces[iface]) throw new Error('no such interface');
  const M = require('./net-model');
  if (!ipStr) { delete dev.ifaces[iface].ip; delete dev.ifaces[iface].mask; }
  else { dev.ifaces[iface].ip = M.ip(ipStr); dev.ifaces[iface].mask = Number(prefix); dev.ifaces[iface].up = true; }
}

module.exports = { KINDS, blank, addDevice, cloneDevice, removeDevice, freePort, ensurePort, addLink, removeLink, setAddress };

// Scenario format — a portable, authorable mission. A scenario is plain data:
// a starting topology, a success spec (the objectives), and the framing text.
// It serializes to JSON (shareable / assignable), validates, and converts to a
// mission object the existing startMission() runner can play. This is what the
// no-code builder emits and what a student is assigned.
//
// scenario = {
//   id, title, mode: 'build' | 'fix',
//   ticket?: { id, from, priority, symptom },
//   objective, hints: [..], diagnose?: {..},
//   start: { devices, links },      // for 'build' this may be minimal/blank
//   success: [ check specs ],       // the spec the student must satisfy
//   palette?: [kinds]               // which devices the student may add
// }

// Check types the author can pick, and the fields each needs. Mirrors evalCheck.
const CHECKS = {
  reachable:      ['a', 'b'],
  not_reachable:  ['a', 'b'],
  subnet_correct: ['dev', 'iface', 'cidr'],
  route_exists:   ['dev', 'cidr'],
  acl_blocks:     ['src', 'dst'],
  service_up:     ['dev', 'port'],
  resolves:       ['dev', 'name'],
  ospf_neighbor:  ['dev', 'peer'],
  ospf_route:     ['dev', 'cidr'],
  bgp_session:    ['dev', 'peer'],
  bgp_route:      ['dev', 'cidr'],
  port_forward:   ['from', 'public', 'dport', 'server'],
  mac_entry:      ['dev', 'device', 'vlan', 'port'],
  stp_root:       ['dev', 'vlan', 'root'],
  stp_blocked:    ['dev', 'vlan', 'port']
};

function validate(scn) {
  const errors = [];
  if (!scn || typeof scn !== 'object') return { ok: false, errors: ['scenario is not an object'] };
  if (!scn.title) errors.push('scenario needs a title');
  const start = scn.start || { devices: {}, links: [] };
  if (!start.devices || typeof start.devices !== 'object') errors.push('start.devices must be an object');
  // links must reference real devices + interfaces
  for (const l of start.links || []) {
    for (const end of [l.a, l.b]) {
      if (!Array.isArray(end)) { errors.push('a link endpoint is malformed'); continue; }
      const d = start.devices[end[0]];
      if (!d) errors.push(`link references missing device "${end[0]}"`);
      else if (!d.ifaces || !d.ifaces[end[1]]) errors.push(`link references missing interface "${end[0]}/${end[1]}"`);
    }
  }
  // success spec
  if (!Array.isArray(scn.success) || scn.success.length === 0) errors.push('a scenario needs at least one success check');
  for (const s of scn.success || []) {
    if (!s || !CHECKS[s.type]) { errors.push(`unknown or missing check type: ${s && s.type}`); continue; }
    for (const field of CHECKS[s.type]) if (s[field] == null) errors.push(`check "${s.type}" needs "${field}"`);
  }
  return { ok: errors.length === 0, errors };
}

function clone(x) { return JSON.parse(JSON.stringify(x)); }

// Convert a scenario into a mission object the runner understands.
function toMission(scn) {
  const start = scn.start || { devices: {}, links: [] };
  const configurable = Object.keys(start.devices).find(id => ['host', 'router', 'firewall'].includes(start.devices[id].kind));
  return {
    id: scn.id || 'authored-' + String(scn.title || 'untitled').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
    chapter: scn.chapter || 'Authored',
    title: scn.title || 'Untitled scenario',
    story: scn.story || scn.objective || '',
    objective: scn.objective || '',
    hints: scn.hints || [],
    ticket: scn.ticket || null,
    diagnose: scn.diagnose || null,
    console: configurable || Object.keys(start.devices)[0] || null,
    build: () => clone(start),
    success: clone(scn.success || []),
    authored: true,
    mode: scn.mode || 'build',
    palette: scn.palette || ['host', 'server', 'switch', 'router', 'firewall']
  };
}

// Capture the live topology from a running mission back into a scenario's start,
// including hand-placed node positions so a saved/exported layout is preserved.
function fromTopology(topo) {
  const out = { devices: clone(topo.devices), links: clone(topo.links) };
  if (topo.pos && Object.keys(topo.pos).length) out.pos = clone(topo.pos);
  if (Array.isArray(topo.notes) && topo.notes.length) out.notes = clone(topo.notes);
  if (Array.isArray(topo.zones) && topo.zones.length) out.zones = clone(topo.zones);
  if (Array.isArray(topo.drawings) && topo.drawings.length) out.drawings = clone(topo.drawings);
  if (topo.layerVisibility && typeof topo.layerVisibility === 'object') out.layerVisibility = clone(topo.layerVisibility);
  return out;
}

function toJSON(scn) { return JSON.stringify(scn, null, 2); }
function fromJSON(text) {
  const scn = JSON.parse(text);
  const v = validate(scn);
  if (!v.ok) throw new Error('invalid scenario: ' + v.errors.join('; '));
  return scn;
}

module.exports = { CHECKS, validate, toMission, fromTopology, toJSON, fromJSON, clone };

});

// Classroom data-access layer for the network trainer. A thin, headless wrapper
// over a Supabase client (`sb`) — no DOM, so it's tested against a mock client.
// It mirrors the sysadmin game's classroom calls and reuses the shared tables
// (classes, enrollments, assignments, attempts); the only network-specific
// pieces are net_scenarios and the get_class_net_scenarios delivery RPC.
//
// Attempt ids are namespaced `net:<scenarioId>` so network attempts never
// collide with sysadmin mission ids in the shared `attempts` table.

const ATTEMPT_PREFIX = 'net:';

// Save (insert or update) an authored scenario. `scenario.dbId` means update.
function saveScenario(sb, authorId, scenario) {
  const title = scenario.title || 'Untitled scenario';
  if (scenario.dbId) {
    return sb.from('net_scenarios').update({ title, data: scenario, updated_at: new Date().toISOString() }).eq('id', scenario.dbId).select();
  }
  return sb.from('net_scenarios').insert({ author_id: authorId, title, data: scenario }).select();
}

// List the signed-in author's own scenarios (metadata only).
function myScenarios(sb, authorId) {
  return sb.from('net_scenarios').select('id, title, created_at').eq('author_id', authorId).order('created_at', { ascending: false });
}

// Load one scenario's full data (author only; students use assignedScenarios).
function loadScenario(sb, id) {
  return sb.from('net_scenarios').select('id, title, data').eq('id', id).maybeSingle();
}

// Assign scenarios to a class (reuses the shared assignments table).
function assignScenarios(sb, classId, title, scenarioIds, dueAt) {
  return sb.from('assignments').insert({ class_id: classId, title, mission_ids: scenarioIds, due_at: dueAt || null });
}

// The scenarios a member of this class has been assigned (SECURITY DEFINER RPC).
function assignedScenarios(sb, classId) {
  return sb.rpc('get_class_net_scenarios', { p_class_id: classId });
}

// Record (upsert) a student's attempt at a scenario.
function recordAttempt(sb, userId, scenarioId, res) {
  res = res || {};
  return sb.from('attempts').upsert({
    user_id: userId,
    mission_id: ATTEMPT_PREFIX + scenarioId,
    passed: !!res.passed,
    ms: res.ms != null ? res.ms : null,
    hints: res.hints || 0,
    updated_at: new Date().toISOString()
  }, { onConflict: 'user_id,mission_id' });
}

// A student's own attempts across network scenarios (for marking solved).
function myAttempts(sb, userId) {

function renderDiagnose(m) {

function renderReview(m) {

function renderFaults(m) {

function renderDeviceExplorer() {

function renderBrief() {

    ? renderDiagnose(m)

function scanConfigFleet() {

async function renderClassroom(sb, body) {
  body.innerHTML = '<p class="dim">Loading your classes…</p>';

  try { const { data } = await sb.from('profiles').select('is_teacher').eq('id', AUTHUSER.id).maybeSingle(); isTeacher = !!(data && data.is_teacher); } catch (e) {}
  try { const { data } = await sb.from('enrollments').select('class_id, classes(name)').eq('user_id', AUTHUSER.id); enrolled = data || []; } catch (e) {}
  try { const { data } = await sb.from('classes').select('id, name').eq('owner_id', AUTHUSER.id); owned = data || []; } catch (e) {}
  let student = '';
  for (const e of enrolled) {
    let scns = []; try { const { data } = await NC.assignedScenarios(sb, e.class_id); scns = data || []; } catch (_) {}
    const cname = (e.classes && e.classes.name) || 'Class';
    student += `<div class="rlabel">${esc(cname)}</div>` + (scns.length

      : '<p class="dim">No network scenarios assigned yet.</p>');
  }
  let teacher = '';

    const scnOpts = mine.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join('') || '<option value="">(save a scenario first)</option>';
    const clsOpts = owned.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('') || '<option value="">(no classes — create one in the Linux game)</option>';
    teacher = `<div class="rlabel" style="margin-top:12px">Teach — assign a scenario</div>
      <div class="addrow"><select id="asgScn" class="wide">${scnOpts}</select></div>
      <div class="addrow"><select id="asgCls">${clsOpts}</select><input id="asgTitle" placeholder="assignment title" size="12"/><button class="btn sm" id="doAssign">Assign</button></div>
      <div id="asgOut" class="dim"></div>`;
  }

  body.querySelectorAll('.playScn').forEach(b => b.addEventListener('click', () => {
    try { const scn = JSON.parse(b.dataset.scn); closeModal(); MODE = 'play'; PLAYING_DBID = b.dataset.id || null; runMission(S.toMission(scn)); } catch (e) { flashStatus('Could not open scenario.'); }
  }));
  const asg = body.querySelector('#doAssign');
  if (asg) asg.addEventListener('click', async () => {
    const scnId = body.querySelector('#asgScn').value, clsId = body.querySelector('#asgCls').value;
    const title = body.querySelector('#asgTitle').value.trim() || 'Network scenario';
    const out = body.querySelector('#asgOut');
    if (!scnId || !clsId) { out.textContent = 'Pick a scenario and a class.'; return; }
    try { await NC.assignScenarios(sb, clsId, title, [scnId], null); out.textContent = '✓ Assigned to the class.'; }
    catch (e) { out.textContent = 'Assign failed: ' + (e && e.message); }
  });
}

/* ---------- global workstation search ---------- */
let PALETTE_RESULTS = [], PALETTE_ACTIVE = 0;
function collectPaletteResults(query) {
  const q=query.trim().toLowerCase(), results=[];
  const add=(kind,title,detail,action)=>{if(!q||[kind,title,detail].join(' ').toLowerCase().includes(q))results.push({kind,title,detail,action});};
  [['overview','Operations overview','Shift dashboard'],['incidents','Incident queue','Tickets and investigation'],['workbench','Network Workbench','Topology, device console and inspector'],['infrastructure','Infrastructure inventory','Devices, interfaces, routes and services'],['knowledge','Network knowledge','Cisco command reference and playbooks'],['journal','Engineering journal','Commands, evidence and notes'],['changes','Change management','Planned network changes']].forEach(([view,title,detail])=>add('Workspace',title,detail,()=>showWorkspaceView(view)));
  if(RUN&&RUN.net) Object.entries(RUN.net.devices||{}).forEach(([id,d])=>add('Device',id,(d.kind||'device')+' · '+(primaryIp(d)||'no IP'),()=>{showWorkspaceView('workbench');selectDevice(id);}));
  allTickets().forEach(t=>add('Incident',t.id+' · '+t.title,[t.priority,t.status,t.service,t.symptom].join(' · '),()=>{INCIDENT_SELECTED=t.id;INCIDENT_FILTERS.query='';INCIDENT_FILTERS.status='all';showWorkspaceView('incidents');}));
  (PROG.changes||[]).forEach(c=>add('Change',c.id+' · '+c.title,[changeStateLabel(c.status),c.affected].join(' · '),()=>{CHANGE_SELECTED=c.id;showWorkspaceView('changes');}));
  KNOWLEDGE_COMMANDS.forEach(c=>add('Command',c.cmd,c.cat+' · '+c.desc,()=>{showWorkspaceView('workbench');const input=$('#tin');if(input){input.value=c.cmd;input.focus();}}));
  (PROG.journal||[]).forEach((e,i)=>add('Journal',e.type||'Activity',[e.device,e.ticket,e.command,e.text,e.output].filter(Boolean).join(' · '),()=>{JOURNAL_FILTERS.query=q;JOURNAL_FILTERS.type='all';JOURNAL_FILTERS.range='all';showWorkspaceView('journal');}));
  return results.slice(0,40);
}
function renderPaletteResults() {
  const list=$('#paletteResults'); if(!list)return;
  list.innerHTML=PALETTE_RESULTS.length?PALETTE_RESULTS.map((r,i)=>'<button type="button" class="palette-result'+(i===PALETTE_ACTIVE?' active':'')+'" data-palette-index="'+i+'" role="option" aria-selected="'+(i===PALETTE_ACTIVE)+'"><span class="palette-result-kind">'+esc(r.kind)+'</span><span class="palette-result-copy"><b>'+esc(r.title)+'</b><small>'+esc(r.detail)+'</small></span><span class="palette-result-enter">↵</span></button>').join(''):'<div class="palette-empty">No matching devices, incidents, changes or commands.</div>';
  list.querySelectorAll('[data-palette-index]').forEach(b=>b.addEventListener('click',()=>activatePaletteResult(Number(b.dataset.paletteIndex))));
}
function activatePaletteResult(index) {
  const item=PALETTE_RESULTS[index]; if(!item)return;
  closePalette(); item.action();
}
function openPalette() {
  if($('#workstationPalette')){const input=$('#paletteSearch');$('#workstationPalette').hidden=false;input.value='';PALETTE_RESULTS=collectPaletteResults('');PALETTE_ACTIVE=0;renderPaletteResults();input.focus();return;}
  const modal=document.createElement('div');modal.id='workstationPalette';modal.className='palette-overlay';modal.innerHTML='<section class="palette-dialog" role="dialog" aria-modal="true" aria-label="Search workstation"><div class="palette-search-row"><span aria-hidden="true">⌕</span><input id="paletteSearch" type="search" autocomplete="off" placeholder="Search devices, incidents, changes, commands…"><kbd>ESC</kbd></div><div id="paletteResults" class="palette-results" role="listbox"></div><footer><span>↑ ↓ Navigate</span><span>↵ Open</span><span>Ctrl K Search</span></footer></section>';
  document.body.appendChild(modal);
  const input=modal.querySelector('#paletteSearch');
  input.addEventListener('input',()=>{PALETTE_RESULTS=collectPaletteResults(input.value);PALETTE_ACTIVE=0;renderPaletteResults();});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();PALETTE_ACTIVE=Math.min(PALETTE_RESULTS.length-1,PALETTE_ACTIVE+1);renderPaletteResults();}
    else if(e.key==='ArrowUp'){e.preventDefault();PALETTE_ACTIVE=Math.max(0,PALETTE_ACTIVE-1);renderPaletteResults();}
    else if(e.key==='Enter'){e.preventDefault();activatePaletteResult(PALETTE_ACTIVE);}
    else if(e.key==='Escape'){e.preventDefault();closePalette();}
    else if(e.key==='Tab'){const first=modal.querySelector('.palette-result');if(first){e.preventDefault();first.focus();}}
  });
  modal.addEventListener('click',e=>{if(e.target===modal)closePalette();});
  PALETTE_RESULTS=collectPaletteResults('');PALETTE_ACTIVE=0;renderPaletteResults();input.focus();
}
function closePalette(){const modal=$('#workstationPalette');if(modal)modal.remove();}
function wireGlobalPalette() {
  document.addEventListener('keydown',e=>{if(canBuild()&&RUN&&!/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'')){const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoTopology():undoTopology();return;}if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redoTopology();return;}if(mod&&e.key.toLowerCase()==='c'){e.preventDefault();copyTopologySelection();return;}if(mod&&e.key.toLowerCase()==='v'){e.preventDefault();pasteTopologySelection();return;}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;} if(canBuild()&&RUN&&!/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||'')){if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='d'&&SEL){e.preventDefault();try{const id=B.cloneDevice(RUN.net,SEL);selectDevice(id);refresh();}catch(err){flashStatus(err.message);}return;}if(e.key==='Delete'&&LINK_SEL!=null){e.preventDefault();B.removeLink(RUN.net,LINK_SEL);LINK_SEL=null;refresh();return;}}if(e.key==='Escape'&&$('#workstationPalette'))closePalette();});
}
