version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-production-and-development:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /network-trainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      network-trainer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
